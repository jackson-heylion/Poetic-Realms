<!doctype html>
<html lang="zh-CN" class="stage-root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070d">
<meta name="description" content="诗境 Poetic Realms：以中国古典诗词为索引的 3D 场景博物馆。每次进入随机放映一个已建成的三维诗境。">
<title>诗境 · Poetic Realms</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/poems-data.js" defer></script>
<script src="assets/agent-prompt.js" defer></script>
<script src="assets/clipboard.js" defer></script>
<script src="assets/stage.js" defer></script>
</head>
<body class="stage-body">
<a class="skip" href="#stage-panel">跳至当前场景信息</a>

<main class="theater" id="stage">
  <!-- 预置第一个原型：脚本未执行或目录拉取失败时，这里仍是一段可看的场景 -->
  <iframe class="stage-frame" id="stage-frame" src="scenes/jiangxue.html"
    title="《江雪》三维场景" allow="autoplay"></iframe>
  <div class="stage-veil" aria-hidden="true"></div>

  <header class="stage-top">
    <a class="brand" href="./" aria-label="诗境首页"><b>诗境</b><span>POETIC REALMS</span></a>
    <nav class="stage-topnav" aria-label="主导航">
      <a href="catalog.html">馆藏</a>
      <a href="catalog.html#tasks">共建</a>
      <a href="https://github.com/jackson-heylion/Poetic-Realms" target="_blank" rel="noopener">GitHub ↗</a>
      <button class="stage-toggle" id="stage-toggle" type="button" aria-pressed="false"
        title="隐藏界面（H）" aria-label="隐藏界面">
        <span class="stage-toggle-glyph" aria-hidden="true">◑</span>
        <span class="stage-toggle-label">隐藏界面</span>
      </button>
    </nav>
  </header>

  <div class="stage-panel" id="stage-panel">
    <div class="stage-info" aria-live="polite" aria-atomic="true">
      <div class="stage-kicker">
        <span id="stage-scene">初版 · 江雪</span>
        <span class="sep" aria-hidden="true">/</span>
        <span class="num" id="stage-count">—</span>
      </div>
      <h1 class="stage-title" id="stage-title">江雪</h1>
      <p class="stage-meta" id="stage-meta">唐 · 柳宗元 · 五言绝句</p>
      <p class="stage-verse" id="stage-verse">千山鸟飞绝，万径人踪灭。</p>
      <div class="stage-tags" id="stage-tags"></div>
    </div>

    <div class="stage-actions">
      <a class="stage-cta" id="stage-enter" href="gallery.html?poem=jiangxue">进入展厅 ↗</a>
      <button class="stage-ghost copy-btn" id="stage-copy" type="button" data-copy="jiangxue">复制提示词</button>
    </div>

    <div class="stage-controls">
      <button class="stage-arrow" id="stage-prev" type="button" aria-label="上一个场景">←</button>
      <button class="stage-next" id="stage-next" type="button">下一个场景 <span aria-hidden="true">→</span></button>
      <span class="stage-hint">或按 →</span>
    </div>
  </div>

  <div class="stage-empty" id="stage-empty" hidden>
    <h2>还没有建成的场景</h2>
    <p>馆藏里的诗都还等着第一次创作。挑一首，把提示词交给 AI。</p>
    <a class="stage-cta" href="catalog.html">打开馆藏 ↗</a>
  </div>
</main>

<noscript>
  <p class="stage-noscript">随机漫游需要 JavaScript。你仍可以在 <a href="catalog.html">馆藏</a> 中挑选诗句。</p>
</noscript>

<div id="copy-status" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
