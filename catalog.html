<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f3ed" />
    <meta
      name="description"
      content="在诗境馆藏里寻找山水、月色与人间。读完整诗文，追溯文本出处，走入三维诗境。"
    />
    <title>诗词馆藏 · 诗境</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/collection.css" />
    <link rel="stylesheet" href="assets/catalog.css" />
    <link rel="stylesheet" href="assets/poem-detail.css" />
    <script src="assets/poems-data.js" defer></script>
    <script src="assets/agent-prompt.js" defer></script>
    <script src="assets/clipboard.js" defer></script>
    <script src="assets/poem-detail.js" defer></script>
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#catalog">跳至诗词目录</a>
    <header class="topbar">
      <a class="brand" href="./" aria-label="诗境首页"
        ><span class="seal" aria-hidden="true">诗<br />境</span
        ><span class="brand-name">诗境<small>POETIC REALMS</small></span></a
      >
      <nav class="topnav" aria-label="主导航">
        <a href="./">漫游</a
        ><a href="catalog.html" aria-current="page">诗词馆藏</a
        ><a
          class="github-link"
          href="https://github.com/jackson-heylion/Poetic-Realms"
          target="_blank"
          rel="noopener"
          >GitHub ↗</a
        >
      </nav>
    </header>
    <main class="wrap">
      <section class="catalog-hero">
        <div>
          <p class="eyebrow">THE COLLECTION <span>／</span> 诗词馆藏</p>
          <h1>字里有山河，<br /><em>眼前皆诗境。</em></h1>
        </div>
        <div class="hero-aside">
          <p>循着一句诗，去往一片天地。<br />让千年前的山水，与你此刻相逢。</p>
          <p class="collection-count">
            <b class="num" id="metric-total">—</b> 篇诗文<span>·</span
            ><b class="num" id="metric-scenes">—</b> 个诗境
          </p>
        </div>
      </section>
      <section class="featured" aria-labelledby="featured-title">
        <div class="section-heading">
          <h2 id="featured-title">可游之境 <small>从文字，走入风景</small></h2>
          <a class="text-link" href="./">随机漫游 ↗</a>
        </div>
        <div class="featured-grid" id="featured-grid">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </section>
      <section class="library" id="catalog" aria-labelledby="library-title">
        <div class="library-heading">
          <h2 id="library-title">翻开诗卷</h2>
          <span class="eyebrow">A VERSE, A WORLD</span>
        </div>
        <label class="search"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m16 16 5 5" /></svg
          ><input
            id="search"
            type="search"
            placeholder="搜一首诗、一位诗人，或一种意境"
            autocomplete="off"
            aria-label="搜索诗题、诗人、全文或景观"
          /><kbd>/</kbd></label
        >
        <div class="filterbar">
          <div class="status-tabs" role="group" aria-label="体验状态">
            <button
              type="button"
              class="filter-tab"
              data-status=""
              aria-pressed="true"
            >
              全部诗词</button
            ><button
              type="button"
              class="filter-tab"
              data-status="playable"
              aria-pressed="false"
            >
              可入境
            </button>
          </div>
          <span class="filter-divider" aria-hidden="true"></span>
          <div class="popular" id="popular"></div>
          <button
            class="filter-toggle"
            id="toggle-advanced"
            type="button"
            aria-expanded="false"
            aria-controls="advanced"
          >
            细选 <span aria-hidden="true">＋</span>
          </button>
        </div>
        <div class="advanced" id="advanced" hidden>
          <div class="filter-fields">
            <label
              >朝代<select id="dynasty">
                <option value="">不限朝代</option>
              </select></label
            ><label
              >体裁<select id="form">
                <option value="">不限体裁</option>
              </select></label
            ><label
              >意象<select id="theme">
                <option value="">不限意象</option>
              </select></label
            >
          </div>
          <details class="creation-filters">
            <summary>创作条件</summary>
            <div class="filter-fields">
              <label
                >工程难度<select id="hardness">
                  <option value="">不限难度</option>
                  <option>H1</option>
                  <option>H2</option>
                  <option>H3</option>
                  <option>H4</option>
                  <option>H5</option>
                </select></label
              ><label
                >创作模型<select id="model">
                  <option value="">不限模型</option>
                </select></label
              ><label
                >制作工具<select id="tool">
                  <option value="">不限工具</option>
                </select></label
              >
            </div>
          </details>
        </div>
        <div class="results-bar">
          <p class="num" id="showing" role="status">正在展开诗卷…</p>
          <button class="text-button" id="reset" type="button" hidden>
            清除筛选 ↺
          </button>
        </div>
        <div class="poem-grid" id="catalog-grid" aria-label="诗词检索结果">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="wrap foot">
        <p class="footer-title">诗有尽，境无穷。</p>
        <p>
          古典文字 · 数字山河<br /><span
            >电子文本保留来源，版本校勘状态见诗文详情。</span
          >
        </p>
        <a href="./">再游一境 ↗</a>
      </div>
    </footer>
    <dialog class="drawer" id="drawer" aria-labelledby="detail-title">
      <div class="drawer-head">
        <span class="eyebrow">诗文笺</span
        ><button
          class="icon-button"
          id="close-detail"
          type="button"
          aria-label="关闭诗文详情"
        >
          ×
        </button>
      </div>
      <div class="drawer-scroll">
        <h2 id="detail-title"></h2>
        <p class="detail-sub" id="detail-sub"></p>
        <div id="detail-body"></div>
      </div>
    </dialog>
    <div
      id="copy-status"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </body>
</html>
