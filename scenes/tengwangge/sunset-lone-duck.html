<style>

      radial-gradient(135% 95% at 50% 44%, rgba(0,0,0,0) 42%, rgba(5,3,10,.42) 100%),
      linear-gradient(to bottom, rgba(6,5,14,.30) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 76%, rgba(5,3,9,.40) 100%);

  .grain{
    position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.055;mix-blend-mode:overlay;

  }

  .poem{
    position:fixed;top:9.5vh;right:clamp(20px,4.4vw,70px);z-index:4;pointer-events:none;
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:clamp(15px,1.45vw,23px);
    letter-spacing:.42em;line-height:1.60;
    color:rgba(250,238,224,.86);
    text-shadow:0 2px 30px rgba(16,8,26,.65), 0 0 1px rgba(40,20,20,.5);
    opacity:0;animation:rise 3s 1.1s cubic-bezier(.16,.72,.2,1) forwards;
  }
  .poem .verse{display:block;white-space:nowrap;margin-block-end:.55em}
  .poem .src{
    display:block;font-size:.52em;letter-spacing:.28em;line-height:1.9;
    color:rgba(240,220,205,.52);margin-block-end:0;
  }
  .seal{
    position:absolute;left:-2.9em;bottom:-.1em;
    width:1.55em;height:1.55em;border:.09em solid rgba(196,72,58,.78);
    border-radius:.14em;display:grid;place-items:center;
    transform:rotate(-2.5deg);opacity:.9;
  }
  .seal span{
    writing-mode:vertical-rl;text-orientation:upright;

  }
  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }

  .hint{
    position:fixed;left:50%;bottom:4.2vh;transform:translateX(-50%);z-index:4;pointer-events:none;
    font-size:11.5px;letter-spacing:.5em;color:rgba(248,232,214,.34);

  @keyframes hintIn{from{opacity:0}to{opacity:1}}

  #veil{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:radial-gradient(120% 90% at 50% 58%, #241a24 0%, #0b0812 62%, #05040a 100%);
    transition:opacity 2.2s ease;

  #veil.hide{opacity:0;pointer-events:none}
  #veil .inner{display:flex;flex-direction:column;align-items:center;gap:22px}
  #veil .t{
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:13px;letter-spacing:.62em;color:rgba(247,226,206,.62);
    animation:breathe 2.6s ease-in-out infinite;
  }
  #veil .bar{width:1px;height:52px;background:linear-gradient(to bottom,rgba(247,208,168,.05),rgba(247,208,168,.55),rgba(247,208,168,.05))}
  #veil .err{display:none;max-width:76vw;text-align:center;font-size:13px;line-height:2.2;letter-spacing:.18em;color:rgba(250,220,200,.8)}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:.95}}

  #bar{
    position:fixed;right:clamp(16px,3vw,34px);bottom:clamp(16px,3vh,28px);z-index:6;
    display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px);
  }
  #bar .btn{
    font:11px/1 system-ui,-apple-system,"PingFang SC",sans-serif;letter-spacing:.06em;
    padding:9px 12px;color:rgba(246,232,214,.90);text-decoration:none;cursor:pointer;
    background:rgba(22,15,26,.55);border:1px solid rgba(196,148,102,.42);border-radius:2px;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:background .18s,border-color .18s;
  }
  #bar .btn:hover{background:rgba(44,30,48,.78);border-color:rgba(226,176,120,.8)}
  #bar .btn:focus-visible{outline:2px solid rgba(232,200,160,.9);outline-offset:2px}
  #fps{
    position:fixed;right:clamp(16px,3vw,34px);top:clamp(14px,2.4vh,26px);z-index:6;
    font:10px/1.9 system-ui,-apple-system,sans-serif;letter-spacing:.14em;
    color:rgba(226,196,166,.62);text-shadow:0 2px 16px rgba(6,3,12,.8);
  }
  .embed #bar,.embed #fps{display:none}

  @media (max-aspect-ratio: 4/5){
    .poem{top:7vh;right:16px;font-size:14px;gap:.8em}
    .hint{font-size:10px;letter-spacing:.35em}
  }

<script>if(window.self!==window.top)document.documentElement.classList.add("embed");</script>
<script type="module">
/* =========================================================
   落霞与孤鹜齐飞 · 秋水共长天一色
   单文件 three.js 实时场景
   ========================================================= */

const CDN = [
  'https://lib.baomitu.com/three.js/0.160.0/three.module.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
];

const veil = document.getElementById('veil');
const errEl = document.getElementById('err');

function fail(msg){
  errEl.style.display = 'block';
  errEl.textContent = msg;
  document.querySelector('#veil .t').style.display = 'none';
}

(async () => {
  const withTimeout = (p, ms) => Promise.race([
    p, new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), ms))
  ]);
  let THREE = null;
  for (const url of CDN){
    try { THREE = await withTimeout(import(url), 7000); break; } catch (e) { /* 换下一个镜像 */ }
  }
  if (!THREE){ fail('未能载入 3D 引擎（baomitu / bootcdn / jsdelivr 三个镜像均不可用），请检查网络后刷新页面'); return; }
  try {
    boot(THREE);
  } catch (e){
    console.error(e);
    fail('场景初始化失败：' + (e && e.message ? e.message : '未知错误'));
  }
})();

/* ---------------------------------------------------------
   工具
   --------------------------------------------------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const DEG   = Math.PI/180;

/* ---------------------------------------------------------
   程序化贴图
   --------------------------------------------------------- */
function makeValueNoise(seed){
  const rnd = mulberry32(seed);
  const perm = new Uint8Array(512);
  const p = new Uint8Array(256);
  for (let i=0;i<256;i++) p[i]=i;
  for (let i=255;i>0;i--){ const j=(rnd()*(i+1))|0; const t=p[i]; p[i]=p[j]; p[j]=t; }
  for (let i=0;i<512;i++) perm[i]=p[i&255];
  const fade = t => t*t*(3-2*t);
  function noise(x,y){
    const xi=Math.floor(x), yi=Math.floor(y);
    const xf=x-xi, yf=y-yi;
    const u=fade(xf), v=fade(yf);
    const X=xi&255, Y=yi&255;
    const aa=perm[(perm[X]+Y)&255]/255;
    const ba=perm[(perm[(X+1)&255]+Y)&255]/255;
    const ab=perm[(perm[X]+((Y+1)&255))&255]/255;
    const bb=perm[(perm[(X+1)&255]+((Y+1)&255))&255]/255;
    return lerp(lerp(aa,ba,u), lerp(ab,bb,u), v);
  }
  function fbm(x,y,oct){
    let s=0, amp=0.5, f=1;
    for (let i=0;i<oct;i++){ s+=amp*noise(x*f,y*f); f*=2.03; amp*=0.5; }
    return s;
  }
  return {noise, fbm};
}

function makeCloudTexture(THREE, size, seed, streak){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size,size);
  const {fbm} = makeValueNoise(seed);
  const smooth = (a,b,t)=>{ const x=clamp((t-a)/(b-a),0,1); return x*x*(3-2*x); };
  for (let y=0;y<size;y++){
    for (let x=0;x<size;x++){
      const u=x/size, v=y/size;
      const wx = fbm(u*1.6+3.1, v*1.6+7.7, 3)-0.5;
      const wy = fbm(u*1.6+11.3, v*1.6+1.9, 3)-0.5;
      const billow = fbm((u+wx*0.7)*2.2, (v+wy*0.5)*2.2*streak, 4);
      let n = fbm((u+wx*0.4)*3.4, (v+wy*0.25)*3.4*streak, 6);
      n = n*0.62 + billow*0.38;
      const dx=(u-0.5)*2.0, dy=(v-0.5)*2.0;
      const r=Math.sqrt(dx*dx+dy*dy);
      const fall = 1-smooth(0.22,0.99,r);
      const shape = fbm(u*1.15+17.0, v*1.7+5.0, 3);
      const lobes = 0.40 + 0.60*smooth(0.34,0.62,shape);
      let a = smooth(0.34,0.58,n)*fall*lobes;
      a = Math.pow(clamp(a,0,1),1.02);
      const i=(y*size+x)*4;
      img.data[i]=255; img.data[i+1]=255; img.data[i+2]=255;
      img.data[i+3]=Math.round(a*255);
    }
  }
  ctx.putImageData(img,0,0);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.needsUpdate = true;
  return tex;
}

function makeSoftTexture(THREE, size, power){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d');
  const img=ctx.createImageData(size,size);
  for (let y=0;y<size;y++) for (let x=0;x<size;x++){
    const dx=(x/size-0.5)*2, dy=(y/size-0.5)*2;
    const r=Math.min(1,Math.sqrt(dx*dx+dy*dy));
    const a=Math.pow(1-r,power);
    const i=(y*size+x)*4;
    img.data[i]=255; img.data[i+1]=255; img.data[i+2]=255;
    img.data[i+3]=Math.round(clamp(a,0,1)*255);
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(c);
  tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;
  return tex;
}

function makeReedTexture(THREE){
  const W=300, H=620;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.clearRect(0,0,W,H);
  g.lineCap='round';
  const rnd=mulberry32(1937);

  for (let k=0;k<4;k++){
    const baseX = 40 + k*72 + (rnd()-0.5)*26;
    const topX  = baseX + (rnd()-0.5)*64;
    const topY  = 105 + rnd()*150;
    const sway  = (topX-baseX);

    // 秆
    g.strokeStyle='rgba(255,255,255,0.96)';
    g.lineWidth = 3.6 - k*0.45;
    g.beginPath();
    g.moveTo(baseX,H);
    g.quadraticCurveTo(baseX+sway*0.35, H*0.52, topX, topY);
    g.stroke();

    // 芦花
    const plumeH = 170 + rnd()*90;
    const lean = (rnd()-0.5)*16;
    for (let i=0;i<210;i++){
      const t=Math.pow(i/210, 0.85);
      const cx = topX + lean*t;
      const cy = topY + t*plumeH;
      const env = Math.sin(Math.pow(t,0.45)*Math.PI*0.96);
      const spread = (7 + rnd()*13) * env;
      const dir = (i%2)?1:-1;
      g.strokeStyle = `rgba(255,255,255,${0.08+0.34*(1-t*0.6)*(0.3+rnd()*0.7)})`;
      g.lineWidth = 0.55 + rnd()*0.8;
      g.beginPath();
      g.moveTo(cx, cy);
      g.quadraticCurveTo(cx+dir*spread*0.5, cy+6, cx+dir*spread, cy+13+rnd()*12);
      g.stroke();
    }
    // 叶
    for (let i=0;i<2;i++){
      const t=0.28+rnd()*0.45;
      const y=lerp(H,topY,t);
      const x=lerp(baseX,topX,t);
      const dir=(i%2)?1:-1;
      g.strokeStyle='rgba(255,255,255,0.6)';
      g.lineWidth=2.2;
      g.beginPath();
      g.moveTo(x,y);
      g.quadraticCurveTo(x+dir*26, y-34, x+dir*16, y-96);
      g.stroke();
    }
  }
  const tex=new THREE.CanvasTexture(c);
  tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;
  tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
  return tex;
}

/* ---------------------------------------------------------
   主程序
   --------------------------------------------------------- */
function boot(THREE){
  const Q = new URLSearchParams(location.search);
  const HIDE = new Set((Q.get('hide')||'').split(',').filter(Boolean));

  /* ---------- 渲染器 ---------- */
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.92;
  document.getElementById('stage').appendChild(renderer.domElement);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 9000);
  camera.position.set(0, 2.7, 0);

  /* ---------- 太阳与天色 ---------- */
  const SUN_AZ = 14*DEG;
  const SUN_EL = 3.15*DEG;
  const sunDir = new THREE.Vector3(
    Math.sin(SUN_AZ)*Math.cos(SUN_EL),
    Math.sin(SUN_EL),
    -Math.cos(SUN_AZ)*Math.cos(SUN_EL)
  ).normalize();

  const C = {
    zenith : new THREE.Color(0x141a36),
    mid    : new THREE.Color(0x6a4266),
    low    : new THREE.Color(0xc85c4c),
    horizon: new THREE.Color(0xff8f4a),
    haze   : new THREE.Color(0xffa163),
    sun    : new THREE.Color(0xfff2d4)
  };

  let starMat = null, reflMat = null;

  const skyU = {
    uTime     : { value: 0 },
    uSunDir   : { value: sunDir },
    uZenith   : { value: C.zenith },
    uMid      : { value: C.mid },
    uLow      : { value: C.low },
    uHorizon  : { value: C.horizon },
    uHaze     : { value: C.haze },
    uSunColor : { value: C.sun }
  };

  /* ---------- 共享天空函数 ---------- */
  const SKY_GLSL = /* glsl */`
    uniform vec3 uSunDir;
    uniform vec3 uZenith;
    uniform vec3 uMid;
    uniform vec3 uLow;
    uniform vec3 uHorizon;
    uniform vec3 uHaze;
    uniform vec3 uSunColor;
    uniform float uTime;

    vec3 skyColor(vec3 dir, float discAmt){
      vec3 d = normalize(dir);
      float h  = d.y;
      float hh = max(h, 0.0);

      vec3 col = mix(uHorizon, uLow, smoothstep(0.0, 0.034, hh));
      col = mix(col, uMid,     smoothstep(0.020, 0.115, hh));
      col = mix(col, uZenith,  smoothstep(0.095, 0.40,  hh));

      // 地平线暖辉
      col += uHorizon * exp(-hh*46.0) * 0.10;

      float ang = acos(clamp(dot(d, uSunDir), -1.0, 1.0));
      col += uSunColor * (exp(-ang*3.4) * 0.105);
      col += uSunColor * (exp(-ang*9.5) * 0.240);
      col += uSunColor * (exp(-ang*30.0) * 0.300);
      col += uSunColor * (smoothstep(0.0142, 0.0110, ang) * 3.4 * discAmt);

      col = mix(col, uHaze, exp(-hh*38.0) * 0.22);
      return col;
    }
  `;

  /* ---------- 天空穹顶 ---------- */
  const skyMat = new THREE.ShaderMaterial({
    uniforms: skyU,
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vDir = wp.xyz - cameraPosition;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      ${SKY_GLSL}
      varying vec3 vDir;
      void main(){
        vec3 col = skyColor(vDir, 1.0);
        float d = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
        col += (d - 0.5) * 0.007;
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
    side: THREE.BackSide,
    depthWrite: false,
    depthTest: false
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(6000, 64, 40), skyMat);
  sky.frustumCulled = false;
  sky.renderOrder = -100;
  scene.add(sky);

  /* ---------- 星子 ---------- */
  (function stars(){
    const N = 420;
    const pos = new Float32Array(N*3);
    const size = new Float32Array(N);
    const phase = new Float32Array(N);
    const bright = new Float32Array(N);
    const rnd = mulberry32(20240);
    for (let i=0;i<N;i++){
      const az = rnd()*Math.PI*2;
      const el = (8 + rnd()*78)*DEG;
      const r = 5200;
      pos[i*3]   = Math.sin(az)*Math.cos(el)*r;
      pos[i*3+1] = Math.sin(el)*r;
      pos[i*3+2] = -Math.cos(az)*Math.cos(el)*r;
      size[i] = 1.0 + rnd()*2.0;
      phase[i] = rnd()*Math.PI*2;
      bright[i] = 0.18 + rnd()*0.55;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(size,1));
    geo.setAttribute('aPhase', new THREE.BufferAttribute(phase,1));
    geo.setAttribute('aBright', new THREE.BufferAttribute(bright,1));
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime:{value:0}, uPR:{value:Math.min(window.devicePixelRatio||1,2)} },
      vertexShader: /* glsl */`
        attribute float aSize;
        attribute float aPhase;
        attribute float aBright;
        uniform float uTime;
        uniform float uPR;
        varying float vA;
        void main(){
          vec4 mv = modelViewMatrix * vec4(position,1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = aSize * uPR * 1.15;
          float tw = 0.62 + 0.38 * sin(uTime*1.3 + aPhase);
          vA = aBright * tw * smoothstep(0.02, 0.55, normalize(position).y);
        }
      `,
      fragmentShader: /* glsl */`
        varying float vA;
        void main(){
          vec2 p = gl_PointCoord - 0.5;
          float d = 1.0 - smoothstep(0.10, 0.5, length(p));
          gl_FragColor = vec4(vec3(1.0, 0.96, 0.90) * d, vA * d);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const pts = new THREE.Points(geo, mat);
    pts.renderOrder = -50;
    pts.frustumCulled = false;
    scene.add(pts);
    starMat = mat;
  })();

  /* ---------- 云：落霞 ---------- */
  const cloudTexA = makeCloudTexture(THREE, 320, 11, 1.55);
  const cloudTexB = makeCloudTexture(THREE, 320, 83, 2.15);
  const cloudTexC = makeCloudTexture(THREE, 320, 197, 3.10);

  const cloudMat = (tex, warm, cool, opacity) => new THREE.ShaderMaterial({
    uniforms: {
      uMap:{value:tex},
      uWarm:{value:new THREE.Color(warm)},
      uCool:{value:new THREE.Color(cool)},
      uOpacity:{value:opacity}
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform sampler2D uMap;
      uniform vec3 uWarm;
      uniform vec3 uCool;
      uniform float uOpacity;
      varying vec2 vUv;
      void main(){
        float a = texture2D(uMap, vUv).a;
        if (a < 0.006) discard;
        a = smoothstep(0.04, 0.94, a);
        vec3 col = mix(uWarm, uCool, smoothstep(0.0, 0.86, vUv.y));
        col += uWarm * pow(max(0.0, 1.0 - vUv.y), 4.0) * 0.55;
        col = mix(col, uCool * 0.62, smoothstep(0.45, 1.0, a) * 0.45);
        gl_FragColor = vec4(col, a * uOpacity);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide
  });

  const texPool = [cloudTexA, cloudTexB, cloudTexC];
  const clouds = [];
  const cloudGeoCache = new Map();

  function addCloudMesh({ x, y, z, w, h, rot, op, warm, cool, tex, tilt }){
    const key = w.toFixed(0)+'_'+h.toFixed(0);
    let geo = cloudGeoCache.get(key);
    if (!geo){ geo = new THREE.PlaneGeometry(w, h); cloudGeoCache.set(key, geo); }
    const mesh = new THREE.Mesh(geo, cloudMat(texPool[tex], warm, cool, op));
    mesh.position.set(x, y, z);
    mesh.lookAt(0, 4, 0);
    mesh.rotateZ(rot);
    mesh.renderOrder = 10;
    mesh.userData = { base:new THREE.Vector3(x,y,z), phase:Math.random()*Math.PI*2, tag:'clouds' };
    if (HIDE.has('clouds')) mesh.visible = false;
    scene.add(mesh);
    clouds.push(mesh);
    return mesh;
  }

  // 一个云团 = 若干小云片叠在一起，边缘自然破碎
  function addBank({ az, el, dist, w, h, n, op, warm, cool, tex, seed, spread=1 }){
    const rnd = mulberry32(seed);
    for (let i=0;i<n;i++){
      const da = (rnd()-0.5) * (w/dist) * spread;
      const de = (rnd()-0.5) * (h/dist) * spread;
      const a = az*DEG + da;
      const e = el*DEG + de;
      const d = dist * (0.94 + rnd()*0.12);
      const pw = w * (0.46 + rnd()*0.34);
      const ph = h * (0.50 + rnd()*0.40);
      addCloudMesh({
        x: Math.sin(a)*Math.cos(e)*d,
        y: Math.sin(e)*d,
        z: -Math.cos(a)*Math.cos(e)*d,
        w: pw, h: ph,
        rot: (rnd()-0.5)*0.09,
        op: op * (0.55 + rnd()*0.5),
        warm, cool, tex
      });
    }
  }

  // 高空云团
  addBank({ az:-34, el:21.0, dist:2650, w: 2100, h: 660, n: 7, op: 0.40,
            warm:0xd98d70, cool:0x33203c, tex:0, seed:1301, spread:1.0 });

    w: 3200, h: 240, rot: 0.0, op: 0.24, warm:0xab8290, cool:0x35294a, tex:2

  /* ---------- 远山 ---------- */
  const RIDGE_VS = /* glsl */`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `;
  const RIDGE_FS = /* glsl */`
    precision highp float;
    uniform vec3 uTop;
    uniform vec3 uBot;
    uniform vec3 uHaze;
    uniform vec3 uWarm;
    uniform float uHazeAmt;
    uniform float uRim;
    varying vec2 vUv;
    void main(){
      float t = vUv.y;
      vec3 col = mix(uBot, uTop, smoothstep(0.0, 1.0, t));
      col = mix(col, uHaze, uHazeAmt * (0.55 + 0.45*(1.0-t)));
      col += uWarm * pow(t, 42.0) * uRim;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `;

  function makeRidge({ width, centerX, z, heightFn, top, bot, hazeAmt, rim=0, segs=260, tag }){
    const pos=[], uv=[], idx=[];
    for (let i=0;i<=segs;i++){
      const t=i/segs;
      const x=centerX + (t-0.5)*width;
      const h=heightFn(t);
      pos.push(x,-180,0, x,h,0);
      uv.push(t,0, t,1);
      if (i<segs){ const a=i*2,b=a+1,c=a+2,d=a+3; idx.push(a,c,b, b,c,d); }
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
    geo.setIndex(idx);
    const mat=new THREE.ShaderMaterial({
      uniforms:{
        uTop:{value:new THREE.Color(top)},
        uBot:{value:new THREE.Color(bot)},
        uHaze:{value:C.haze},
        uWarm:{value:new THREE.Color(0xffb782)},
        uHazeAmt:{value:hazeAmt},
        uRim:{value:rim}
      },
      vertexShader:RIDGE_VS,
      fragmentShader:RIDGE_FS
    });
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.z = z;
    mesh.frustumCulled = false;
    mesh.userData.tag = tag;
    if (tag && HIDE.has(tag)) mesh.visible = false;
    scene.add(mesh);
    return mesh;
  }

  const bump = (t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));

  // 近岸（滕王阁所在江岸）
  const BANK = { width: 1450, centerX: -975, z: -905 };
  const bankFn = (t)=> 4.0
    + 34*bump(t,0.875,0.075)
    + 21*bump(t,0.62,0.14)
    + 12*bump(t,0.28,0.12)
    + 1.8*Math.sin(t*43.0+1.3)

  /* ---------- 滕王阁 ---------- */
  function makePavilion(){
    const root = new THREE.Group();

    step2.position.y = 3.1; root.add(step2);

    const levels = [
      { y: 5.2, wBody: 22.0, hBody: 6.4, wRoof: 30.0, hRoof: 7.2 },
      { y:13.2, wBody: 17.5, hBody: 5.4, wRoof: 24.5, hRoof: 6.4 },
      { y:20.4, wBody: 13.5, hBody: 4.8, wRoof: 19.5, hRoof: 5.6 },
      { y:27.2, wBody:  9.5, hBody: 4.2, wRoof: 14.5, hRoof: 4.9 }
    ];

    for (const L of levels){
      const body = new THREE.Mesh(new THREE.BoxGeometry(L.wBody, L.hBody, L.wBody*0.64), wallMat);
      body.position.y = L.y + L.hBody*0.5;
      root.add(body);

      // 窗火
      const cols = 3;
      for (let r=0;r<2;r++){
        for (let c=0;c<cols;c++){
          const w = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 1.7), winMat);
          w.position.set(
            (c-(cols-1)/2) * (L.wBody*0.27),
            L.y + L.hBody*(0.40 + r*0.30),
            L.wBody*0.32 + 0.02
          );
          root.add(w);
        }
      }

      // 檐下栏杆
      const rail = new THREE.Mesh(new THREE.BoxGeometry(L.wBody*1.08, 0.4, L.wBody*0.72), wallMat);
      rail.position.y = L.y + L.hBody*0.96;
      root.add(rail);

      // 屋顶（凹曲面四注顶）
      const pts=[];
      const steps=12;
      for (let i=0;i<=steps;i++){
        const t=i/steps;
        const rad=Math.pow(t,0.94);
        const yy=Math.pow(1-t,1.34);
        pts.push(new THREE.Vector2(rad*1.0, yy));
      }
      pts.push(new THREE.Vector2(1.05, -0.05));
      const roofGeo = new THREE.LatheGeometry(pts, 4);
      const roof = new THREE.Mesh(roofGeo, roofMat);
      const rr = L.wRoof*0.60;
      roof.scale.set(rr, L.hRoof, rr);
      roof.rotation.y = Math.PI/4;
      roof.position.y = L.y + L.hBody;
      root.add(roof);
    }

    // 塔刹
    const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.75,5.0,6), wallMat);
    spire.position.y = 34.6;
    root.add(spire);
    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.8,10,8), roofMat);
    orb.position.y = 37.2;
    root.add(orb);

    return root;
  }

  const pavilion = makePavilion();
  const pavX = -400;
  const pavT = (pavX - (BANK.centerX - BANK.width/2)) / BANK.width;
  const pavY = bankFn2(clamp(pavT,0,1)) - 3.0;
  pavilion.position.set(pavX, pavY, -868);

  if (HIDE.has('pav')) pavilion.visible = false;
  shore.add(pavilion);

  // 岸边树影
  (function bankTrees(){
    const rnd = mulberry32(5521);
    const mat = new THREE.MeshBasicMaterial({ color:0x120e1c });
    const group = new THREE.Group();
    for (let i=0;i<26;i++){
      const t = 0.3 + rnd()*0.66;
      const x = BANK.centerX + (t-0.5)*BANK.width;
      const y = bankFn2(t);
      const h = 3.0 + rnd()*6.5;
      const geo = new THREE.ConeGeometry(h*0.40, h, 5);
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y + h*0.42, -898 + rnd()*10);
      m.rotation.y = rnd()*Math.PI;
      group.add(m);

    shore.add(group);
  })();

  /* ---------- 岸阁倒影 ---------- */
  (function shoreReflection(){
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor:{ value: new THREE.Color(0x0b0714) },
        uOpacity:{ value: 0.88 }
      },
      vertexShader: /* glsl */`
        uniform float uTime;
        varying float vY;
        varying float vUvY;
        void main(){
          vec3 p = position;
          p.x += sin(p.y*0.22 + uTime*1.6) * 0.9
               + sin(p.y*0.07 - uTime*0.7) * 1.8;
          vec4 wp = modelMatrix * vec4(p, 1.0);
          vY = wp.y;
          vUvY = uv.y;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform vec3 uColor;
        uniform float uOpacity;
        varying float vY;
        varying float vUvY;
        void main(){
          float d = clamp(-vY / 55.0, 0.0, 1.0);
          float a = uOpacity * pow(1.0 - d, 1.35) * smoothstep(0.0, 4.0, -vY);
          gl_FragColor = vec4(uColor, a);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `,
      transparent: true,
      depthTest: false,
      depthWrite: false
    });

    const refl = shore.clone(true);
    const drop = [];
    refl.traverse(o=>{
      if (o.isMesh){
        if (o.userData.noRefl) { drop.push(o); return; }
        o.material = mat; o.renderOrder = 4;
      }
    });
    for (const o of drop) o.parent.remove(o);
    refl.scale.y = -1;
    refl.position.y = -0.06;
    refl.renderOrder = 4;
    if (HIDE.has('refl')) refl.visible = false;
    scene.add(refl);
    reflMat = mat;
  })();

  /* ---------- 水面 ---------- */
  const waterU = Object.assign({}, skyU, {
    uDeep:{ value:new THREE.Color(0x113540) },
    uTint:{ value:new THREE.Color(0.94, 0.99, 1.04) }
  });

  const waterMat = new THREE.ShaderMaterial({
    uniforms: waterU,
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      ${SKY_GLSL}
      uniform vec3 uDeep;
      uniform vec3 uTint;
      varying vec3 vWorld;

      void addWave(inout float dx, inout float dz, vec2 p, float t, float warp,
                   vec2 dir, float k, float amp, float sp, float ph0){
        vec2 d = normalize(dir);
        float ph = dot(d,p)*k + t*sp + ph0 + warp*(0.55 + k*0.11);
        float c = cos(ph)*amp*k;
        dx += d.x*c;
        dz += d.y*c;
      }

      vec3 waveNormal(vec2 p, float t, float fade, out vec3 highN){
        float dx = 0.0, dz = 0.0;
        float hx = 0.0, hz = 0.0;
        float warp = sin(p.x*0.0165 + p.y*0.0112 + t*0.09)*1.35
                   + sin(p.x*0.0063 - p.y*0.0091 - t*0.048)*2.10;

        addWave(dx,dz,p,t,warp, vec2( 0.86, 0.51), 0.33, 0.0330,  0.52, 0.0);
        addWave(dx,dz,p,t,warp, vec2(-0.42, 0.91), 0.79, 0.0190, -0.77, 1.7);
        addWave(dx,dz,p,t,warp, vec2( 0.96,-0.28), 1.85, 0.0105,  1.24, 3.1);
        addWave(hx,hz,p,t,warp, vec2( 0.15, 0.99), 4.30, 0.0060, -1.60, 0.6);
        addWave(hx,hz,p,t,warp, vec2(-0.88,-0.47), 9.10, 0.0028,  2.25, 2.4);
        addWave(hx,hz,p,t,warp, vec2( 0.62,-0.78),18.50, 0.0012, -3.05, 4.8);
        dx += hx; dz += hz;

        highN = normalize(vec3(-hx*fade*2.6, 1.0, -hz*fade*2.6));
        return normalize(vec3(-dx*fade, 1.0, -dz*fade));
      }

      void main(){
        vec3 toCam = cameraPosition - vWorld;
        float dist = length(toCam);
        vec3 V = toCam / max(dist, 0.001);
        float fade = 1.0 / (1.0 + dist*0.045);
        vec3 Nhi;
        vec3 Nw = waveNormal(vWorld.xz, uTime, fade, Nhi);
        vec3 N = normalize(mix(vec3(0.0, 1.0, 0.0), Nw, 0.62));

        vec3 R = reflect(-V, N);
        if (R.y < 0.004) R.y = 0.004;
        R = normalize(R);

        vec3 skyRef = skyColor(R, 0.0) * uTint;

        float fres = 0.025 + 0.975 * pow(clamp(1.0 - dot(N, V), 0.0, 1.0), 5.0);
        fres = clamp(fres, 0.0, 1.0);
        vec3 col = mix(uDeep, skyRef, fres);

        // 碎金
        float sd = max(dot(R, uSunDir), 0.0);
        float spec = pow(sd, 300.0)*0.95 + pow(sd, 62.0)*0.18 + pow(sd, 15.0)*0.016;
        float sparkle = 0.58
                      + 0.30*sin(vWorld.x*1.9 + uTime*2.1)
                           *sin(vWorld.z*2.6 - uTime*1.5)
                      + 0.12*sin(vWorld.x*5.7 - uTime*3.3);
        spec *= sparkle;
        // 高频碎光
        vec3 Rs = reflect(-V, normalize(mix(N, Nhi, 0.85)));
        float gd = max(dot(Rs, uSunDir), 0.0);
        float glint = pow(gd, 1100.0) * 5.0 + pow(gd, 260.0) * 0.35;
        glint *= smoothstep(0.0, 0.15, fade);
        spec += glint;
        col += uSunColor * spec;

        // 远处融入水天
        col = mix(col, uHaze, smoothstep(1800.0, 6000.0, dist)*0.20);

        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `
  });

  const water = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000, 1, 1), waterMat);
  water.rotation.x = -Math.PI/2;
  water.position.y = 0;

  /* ---------- 芦苇 ---------- */
  const reedTex = makeReedTexture(THREE);

  const reedReflMat = new THREE.ShaderMaterial({
    uniforms:{
      uMap:{ value: reedTex },
      uColor:{ value: new THREE.Color(0x0a0812) },

    },
    vertexShader:/* glsl */`
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader:/* glsl */`
      precision highp float;
      uniform sampler2D uMap;
      uniform vec3 uColor;
      uniform float uTime;
      varying vec2 vUv;
      void main(){
        vec2 uv2 = vUv;
        uv2.x += sin(vUv.y*34.0 + uTime*1.7)*0.010
               + sin(vUv.y*13.0 - uTime*1.1)*0.006;
        float a = texture2D(uMap, uv2).a;
        float fade = pow(max(0.0, 1.0 - vUv.y), 1.15) * smoothstep(0.0, 0.06, vUv.y);
        a *= fade * 0.34;
        if (a < 0.02) discard;
        gl_FragColor = vec4(uColor, a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    side: THREE.DoubleSide
  });
  (function plantReeds(){
    const rnd = mulberry32(8842);
    const groups = [
      { x:-17, z:-26, n:4, s:0.80 },
      { x:-26, z:-36, n:4, s:0.95 },
      { x:-38, z:-52, n:3, s:1.10 },
      { x:-52, z:-74, n:2, s:1.20 }
    ];
    for (const g of groups){
      for (let i=0;i<g.n;i++){
        const mat = new THREE.ShaderMaterial({
          uniforms:{
            uMap:{value:reedTex},
            uColor:{value:new THREE.Color(0x171221)},
            uTime:{value:0},
            uPhase:{value:rnd()*Math.PI*2},
            uBend:{value:0.35+rnd()*0.4}
          },
          vertexShader:/* glsl */`
            uniform float uTime, uPhase, uBend;
            varying vec2 vUv;
            void main(){
              vUv = uv;
              vec3 p = position;
              float k = uv.y*uv.y;
              p.x += sin(uTime*0.85 + uPhase)*k*uBend;
              p.z += cos(uTime*0.63 + uPhase*1.4)*k*uBend*0.55;
              p.y += sin(uTime*1.4 + uPhase*2.0)*k*0.05;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0);
            }
          `,
          fragmentShader:/* glsl */`
            precision highp float;
            uniform sampler2D uMap;
            uniform vec3 uColor;
            varying vec2 vUv;
            void main(){
              vec4 tx = texture2D(uMap, vUv);
              if (tx.a < 0.16) discard;
              vec3 col = uColor * (0.7 + 0.9*tx.a);
              gl_FragColor = vec4(col, 1.0);
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }
          `,
          side: THREE.DoubleSide
        });
        const h = (6.4 + rnd()*3.2) * g.s;
        const w = h*0.48;
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,h,1,1), mat);
        mesh.position.set(
          g.x + (rnd()-0.5)*7,
          h*0.5 - 0.45,
          g.z + (rnd()-0.5)*7
        );
        mesh.rotation.y = (rnd()-0.5)*0.6;
        if (HIDE.has('reeds')) mesh.visible = false;
        scene.add(mesh);
        reeds.push({ mesh, mat });

        const rmesh = new THREE.Mesh(new THREE.PlaneGeometry(w,h,1,1), reedReflMat);
        rmesh.position.set(mesh.position.x, -0.45 - h*0.5, mesh.position.z);
        rmesh.scale.y = -1;
        rmesh.rotation.y = mesh.rotation.y;
        rmesh.renderOrder = 5;
        if (HIDE.has('reeds')) rmesh.visible = false;
        scene.add(rmesh);
      }
    }
  })();

  /* ---------- 雾霭（极淡，仅用于地平线柔化） ---------- */
  (function mist(){
    const tex = makeSoftTexture(THREE, 128, 1.6);
    const defs = [
      { x:-300, y: 30, z:-2600, w: 4200, h: 120, o: 0.055, c: 0xffcba2 },
      { x: 900, y: 22, z:-2200, w: 3200, h: 90,  o: 0.045, c: 0xffc79c }
    ];
    for (const d of defs){
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(d.w, d.h),
        new THREE.MeshBasicMaterial({
          map: tex, color: d.c, transparent:true, opacity:d.o,
          blending: THREE.AdditiveBlending, depthWrite:false
        })
      );
      m.position.set(d.x, d.y, d.z);
      m.renderOrder = 8;
      if (HIDE.has('mist')) m.visible = false;
      scene.add(m);
    }
  })();

  /* ---------- 日晕 ---------- */
  (function sunGlow(){
    const tex = makeSoftTexture(THREE, 128, 3.2);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, color: 0xffc183, transparent: true, opacity: 0.30,
      blending: THREE.AdditiveBlending, depthWrite:false, depthTest:false
    }));
    s.position.copy(sunDir).multiplyScalar(4600);
    s.scale.set(1250, 1250, 1);
    s.renderOrder = 30;
    if (HIDE.has('glow')) s.visible = false;
    scene.add(s);
  })();

  /* ---------- 日柱与光晕 ---------- */
  (function sunPillar(){
    const tex = makeSoftTexture(THREE, 64, 1.9);
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(260, 900),
      new THREE.ShaderMaterial({
        uniforms:{ uMap:{value:tex}, uTime:{value:0} },
        vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
        fragmentShader:/* glsl */`
          precision highp float;
          uniform sampler2D uMap;
          varying vec2 vUv;
          void main(){
            float a = texture2D(uMap, vUv).a;
            float vert = smoothstep(0.0,0.35,vUv.y) * (1.0 - smoothstep(0.55,1.0,vUv.y));
            float hz = smoothstep(0.0,0.5,vUv.x) * smoothstep(1.0,0.5,vUv.x);
            gl_FragColor = vec4(vec3(1.0,0.72,0.42), a*vert*hz*0.22);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `,
        transparent:true, depthWrite:false, depthTest:false,
        blending:THREE.AdditiveBlending
      })
    );
    const dir = sunDir.clone();
    const d = 4200;
    m.position.set(dir.x*d, dir.y*d + 260, dir.z*d);
    m.lookAt(0, m.position.y, 0);
    m.renderOrder = 25;
    if (HIDE.has('glow')) m.visible = false;
    scene.add(m);
  })();

  /* ---------- 孤鹜 ---------- */
  const birdBodyMat = new THREE.ShaderMaterial({
    uniforms:{
      uDark:{ value: new THREE.Color(0x140f1c) },
      uRim :{ value: new THREE.Color(0xff9a5e) }
    },
    vertexShader:/* glsl */`
      varying vec3 vN; varying vec3 vW;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vW = wp.xyz;
        vN = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader:/* glsl */`
      precision highp float;
      uniform vec3 uDark; uniform vec3 uRim;
      varying vec3 vN; varying vec3 vW;
      void main(){
        vec3 V = normalize(cameraPosition - vW);
        float rim = pow(1.0 - abs(dot(normalize(vN), V)), 5.0);
        vec3 col = uDark + uRim * rim * 0.16;
        gl_FragColor = vec4(col,1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `
  });

  function makeWingGeometry(span, rootChord, tipChord, segs){
    const pos=[], nor=[], spans=[], idx=[];
    for (let i=0;i<=segs;i++){
      const t=i/segs;
      const x=t*span;
      const c=lerp(rootChord,tipChord,Math.pow(t,0.85));
      const sweep=t*t*1.5;
      const y=Math.pow(t,1.5)*0.16;
      pos.push(x,y,-c*0.55+sweep, x,y,c*0.45+sweep);
      nor.push(0,1,0, 0,1,0);
      spans.push(t,t);
      if (i<segs){
        const a=i*2,b=a+1,c2=a+2,d=a+3;
        idx.push(a,b,c2, b,d,c2);
      }
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
    g.setAttribute('aSpan', new THREE.Float32BufferAttribute(spans,1));
    g.setIndex(idx);
    return g;
  }

  const wingGeo = makeWingGeometry(6.0, 2.6, 0.95, 9);

  function makeBird(){
    const g = new THREE.Group();

    const bodyGeo = new THREE.CapsuleGeometry(0.36, 1.5, 4, 10);
    bodyGeo.rotateX(Math.PI/2);
    const body = new THREE.Mesh(bodyGeo, birdBodyMat);
    body.scale.set(1, 0.86, 1);
    g.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.30, 10, 8), birdBodyMat);
    head.position.set(0, 0.16, 1.02);
    g.add(head);

    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.26,0.62,8), birdBodyMat);
    neck.rotation.x = Math.PI/2 - 0.32;
    neck.position.set(0, 0.08, 0.76);
    g.add(neck);

    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.55, 5), birdBodyMat);
    beak.rotation.x = Math.PI/2;
    beak.position.set(0, 0.14, 1.38);
    g.add(beak);

    const tailGeo = new THREE.ConeGeometry(0.45, 1.1, 4);
    tailGeo.rotateX(-Math.PI/2);
    const tail = new THREE.Mesh(tailGeo, birdBodyMat);
    tail.scale.set(1, 0.28, 1);
    tail.position.set(0, 0.04, -1.28);
    g.add(tail);

    const wingMat = new THREE.ShaderMaterial({
      uniforms:{
        uFlap:{ value: 0 },
        uAmp :{ value: 1 },
        uDark:{ value: new THREE.Color(0x140f1c) },
        uRim :{ value: new THREE.Color(0xff9a5e) }
      },
      vertexShader:/* glsl */`
        uniform float uFlap, uAmp;
        attribute float aSpan;
        varying vec3 vN; varying vec3 vW;
        void main(){
          float s = aSpan;
          vec3 p = position;
          float ph = uFlap - s*1.55;
          p.y += sin(ph) * uAmp * pow(s,1.85) * 0.80;
          p.z += (1.0 - cos(ph)) * s * 0.11;
          vec4 wp = modelMatrix * vec4(p,1.0);
          vW = wp.xyz;
          vN = normalize(mat3(modelMatrix) * vec3(0.0,1.0,0.0));
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader:/* glsl */`
        precision highp float;
        uniform vec3 uDark; uniform vec3 uRim;
        varying vec3 vN; varying vec3 vW;
        void main(){
          vec3 V = normalize(cameraPosition - vW);
          float rim = pow(1.0 - abs(dot(normalize(vN), V)), 4.5);
          vec3 col = uDark + uRim * rim * 0.13;
          gl_FragColor = vec4(col,1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `,
      side: THREE.DoubleSide
    });

    const wingR = new THREE.Mesh(wingGeo, wingMat);
    wingR.position.set(0.22, 0.12, 0.05);
    g.add(wingR);

    const wingL = new THREE.Mesh(wingGeo, wingMat);
    wingL.position.set(-0.22, 0.12, 0.05);
    wingL.scale.x = -1;
    g.add(wingL);

    return { group:g, wingMat };
  }

  /* 孤鹜为主，远处三两归鸟作雁阵余响 */
  const lanes = [
    { rx: 260, rz:  80, z: -330, y: 24, yAmp: 3.5, span: 19.0, speed: 1/34, offset: 0.10, phase: 0.35 },
    { rx: 400, rz: 120, z: -560, y: 52, yAmp: 5.5, span: 12.0, speed: 1/46, offset: 0.70, phase: 4.00 },
    { rx: 480, rz: 150, z: -720, y: 68, yAmp: 6.5, span: 10.0, speed: 1/54, offset: 0.28, phase: 5.30 },
    { rx: 560, rz: 180, z: -900, y: 84, yAmp: 7.5, span: 9.0,  speed: 1/62, offset: 0.55, phase: 1.20 }
  ];

  const birds = lanes.map((lane, i) => {
    const b = makeBird();
    b.group.scale.setScalar(lane.span/6);
    scene.add(b.group);
    return { ...b, lane, idx:i };
  });

  function lanePosition(lane, u, out){
    const th = u*Math.PI*2;
    out.set(
      Math.cos(th)*lane.rx,
      lane.y + Math.sin(th*2.0 + lane.phase)*lane.yAmp,
      lane.z + Math.sin(th)*lane.rz
    );
    return out;
  }

  /* ---------- 相机 ---------- */
  const camState = { mx:0, my:0, tmx:0, tmy:0 };
  window.addEventListener('pointermove', (e)=>{
    camState.tmx = (e.clientX/window.innerWidth - 0.5) * 2;
    camState.tmy = (e.clientY/window.innerHeight - 0.5) * 2;
  }, { passive:true });

  const tmpV = new THREE.Vector3();
  const tmpP = new THREE.Vector3();
  const lookTarget = new THREE.Vector3();

  function updateCamera(t){
    camState.mx = lerp(camState.mx, camState.tmx, 0.045);
    camState.my = lerp(camState.my, camState.tmy, 0.045);

    const driftX = Math.sin(t*0.055)*1.6;
    const driftY = Math.sin(t*0.083 + 1.2)*0.22;

    const dolly = Math.sin(t*0.028)*7.5;
    camera.position.set(
      driftX + camState.mx*3.0,
      2.7 + driftY - camState.my*0.6,
      dolly
    );
    /* 竖屏时视线略偏左，阁与落日同框 */
    const narrowX = (window.innerWidth / window.innerHeight < 0.85) ? -15 : 0;
    lookTarget.set(
      driftX*1.4 + camState.mx*5.2 + narrowX,
      5.1 + driftY*1.2 - camState.my*1.6,
      -140
    );
    camera.lookAt(lookTarget);
  }

  /* ---------- 尺寸 ---------- */
  function applyFov(){
    const aspect = window.innerWidth / window.innerHeight;
    const hFov = 2*Math.atan(Math.tan(48*DEG*0.5) * (16/9));
    let fov = 2*Math.atan(Math.tan(hFov*0.5) / aspect) / DEG;
    /* 竖屏放宽纵向视角，保住阁与落日同框 */
    fov = clamp(fov, 40, aspect < 0.85 ? 92 : 72);
    camera.fov = fov;
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
  }
  function onResize(){
    const w = window.innerWidth, h = window.innerHeight;
    applyFov();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2) * qScale);
    renderer.setSize(w,h);
  }
  applyFov();
  window.addEventListener('resize', onResize);

  /* ---------- 动画 ---------- */
  const clock = new THREE.Clock();
  let firstFrame = true;
  let paused = false, simT = 0, qScale = 1, fpsAcc = 0, fpsN = 0;
  const fpsEl = document.getElementById('fps');
  const btnPause = document.getElementById('btnPause');
  const btnQuality = document.getElementById('btnQuality');
  const btnReset = document.getElementById('btnReset');

  btnPause.addEventListener('click', ()=>{
    paused = !paused;
    btnPause.textContent = paused ? '继续' : '暂停';
  });
  btnQuality.addEventListener('click', ()=>{
    qScale = qScale > 1 ? 1 : 1.5;
    btnQuality.textContent = '画质：' + (qScale > 1 ? '高' : '标准');
    onResize();
  });
  btnReset.addEventListener('click', ()=>{
    camState.tmx = camState.tmy = 0; camState.mx = camState.my = 0;
    simT = 0;
  });

  function tick(){
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!paused) simT += dt;
    const t = simT;

    updateCamera(t);

    sky.position.copy(camera.position);
    skyU.uTime.value = t;
    waterU.uTime.value = t;
    if (starMat) starMat.uniforms.uTime.value = t;
    if (reflMat) reflMat.uniforms.uTime.value = t;

    // 云
    for (let i=0;i<clouds.length;i++){
      const m = clouds[i];
      const d = m.userData;
      m.position.x = d.base.x + Math.sin(t*0.028 + d.phase) * 220;
      m.position.y = d.base.y + Math.sin(t*0.021 + d.phase*1.7) * 18;
    }

    // 鸟
    for (const b of birds){
      const L = b.lane;
      const u = ((t*L.speed + L.offset) % 1 + 1) % 1;
      lanePosition(L, u, tmpP);
      b.group.position.copy(tmpP);
      lanePosition(L, (u + 0.004) % 1, tmpV);
      b.group.lookAt(tmpV);

      const bank = Math.sin(t*0.55 + L.phase) * 0.12;
      b.group.rotateZ(bank);

      const amp = 0.30 + 0.70 * (0.5 + 0.5*Math.sin(t*0.38 + L.phase));
      b.wingMat.uniforms.uFlap.value = t*9.5 + L.phase*4.0;
      b.wingMat.uniforms.uAmp.value = amp;
    }

    // 芦苇
    for (const r of reeds){
      r.mat.uniforms.uTime.value = t;
    }
    reedReflMat.uniforms.uTime.value = t;

    renderer.render(scene, camera);

    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5 && fpsEl){
      fpsEl.textContent = Math.round(fpsN/fpsAcc) + ' FPS';
      fpsAcc = 0; fpsN = 0;
    }

    if (firstFrame){
      firstFrame = false;
      veil.classList.add('hide');
      setTimeout(()=>{ veil.style.display='none'; }, 2400);
    }
    requestAnimationFrame(tick);
  }

  tick();
}
</script>
</body>
</html>
