function compileShader(type, src, tag) {
  var sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error(tag + " 着色器编译失败：" + gl.getShaderInfoLog(sh));
  }
  return sh;
}

function makeProgram(vsSrc, fsSrc, tag) {
  var p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc, tag + "/vs"));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc, tag + "/fs"));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error(tag + " 程序链接失败：" + gl.getProgramInfoLog(p));
  }
  var u = {},
    a = {},
    i,
    info;
  var nu = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (i = 0; i < nu; i++) {
    info = gl.getActiveUniform(p, i);
    u[info.name.replace(/\[0\]$/, "")] = gl.getUniformLocation(p, info.name);
  }
  var na = gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES);
  for (i = 0; i < na; i++) {
    info = gl.getActiveAttrib(p, i);
    a[info.name] = gl.getAttribLocation(p, info.name);
  }
  return { prog: p, u: u, a: a, tag: tag };
}

function bind(prog) {
  gl.useProgram(prog.prog);
}

function setU(prog, obj) {
  for (var k in obj) {
    var loc = prog.u[k];
    if (!loc) continue;
    var v = obj[k];
    if (typeof v === "number") gl.uniform1f(loc, v);
    else if (v.length === 2) gl.uniform2fv(loc, v);
    else if (v.length === 3) gl.uniform3fv(loc, v);
    else if (v.length === 4) gl.uniform4fv(loc, v);
    else if (v.length === 16) gl.uniformMatrix4fv(loc, false, v);
  }
}

/* ---------------------------------------------------------- 共享 GLSL */
var GLSL_NOISE = [
  "float hash21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }",
  "float vnoise(vec2 p){",
  "  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);",
  "  float a=hash21(i), b=hash21(i+vec2(1.0,0.0)), c=hash21(i+vec2(0.0,1.0)), d=hash21(i+vec2(1.0,1.0));",
  "  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);",
  "}",
  "float fbm2(vec2 p){ float s=0.0,a=0.56; for(int i=0;i<2;i++){ s+=a*vnoise(p); p*=2.07; a*=0.5; } return s; }",
  "float fbm3(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }",
  "float fbm4(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.05; a*=0.5; } return s; }",
].join("\n");

var GLSL_TONE = [
  "float lum(vec3 c){ return dot(c, vec3(0.2126,0.7152,0.0722)); }",
  "vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }",
  "vec3 grade(vec3 c){",
  "  c = aces(c);",
  "  c = pow(c, vec3(0.4545));",
  "  c = mix(c, c*vec3(0.92,1.00,1.12), 0.32*(1.0-lum(c)));",
  "  return c;",
  "}",
].join("\n");

/* ---------------------------------------------------------- 天空程序 */
var progSky = makeProgram(
  "precision highp float;\n" +
    "attribute vec3 aPos;\n" +
    "varying vec2 vUv;\n" +
    "void main(){ vUv = aPos.xy*0.5+0.5; gl_Position = vec4(aPos.xy, 0.0, 1.0); }",

  "precision highp float;\n" +
    "varying vec2 vUv;\n" +
    "uniform vec3 uRight;\n" +
    "uniform vec3 uUp;\n" +
    "uniform vec3 uFwd;\n" +
    "uniform vec2 uTan;\n" +
    "uniform float uTime;\n" +
    "uniform vec3 uZenith;\n" +
    "uniform vec3 uHorizon;\n" +
    "uniform vec3 uHaze;\n" +
    "uniform vec3 uMoonDir;\n" +
    "uniform vec3 uMoonCol;\n" +
    GLSL_NOISE +
    "\n" +
    GLSL_TONE +
    "\n" +
    "void main(){\n" +
    "  vec2 s = vUv*2.0-1.0;\n" +
    "  vec3 d = normalize(uFwd + uRight*(s.x*uTan.x) + uUp*(s.y*uTan.y));\n" +
    "  float h = d.y;\n" +
    "  vec3 col = mix(uHorizon, uZenith, pow(clamp(h,0.0,1.0),0.62));\n" +
    "  float az = max(dot(normalize(vec3(d.x,0.001,d.z)), vec3(0.0,0.0,-1.0)), 0.0);\n" +
    "  col += uHaze*pow(1.0-clamp(h,0.0,1.0),7.0)*(0.30+0.70*az);\n" +
    "  vec2 sp = vec2(atan(d.z,d.x)*57.2958, asin(clamp(h,-1.0,1.0))*57.2958);\n" +
    "  vec2 g = sp*1.62;\n" +
    "  vec2 gi = floor(g), gf = fract(g);\n" +
    "  float r = hash21(gi);\n" +
    "  float star = 0.0;\n" +
    "  if (r > 0.978 && h > 0.015){\n" +
    "    vec2 c = vec2(hash21(gi+1.73), hash21(gi+9.17))*0.72+0.14;\n" +
    "    float dd = length(gf-c);\n" +
    "    float tw = 0.55+0.45*sin(uTime*(0.7+r*2.4)+r*41.0);\n" +
    "    star = smoothstep(0.085,0.0,dd)*tw*(0.35+0.65*hash21(gi+3.31));\n" +
    "    star *= smoothstep(0.015,0.16,h);\n" +
    "  }\n" +
    "  float band = smoothstep(0.46,0.0,abs(d.y*0.9 - d.x*0.5 - 0.28));\n" +
    "  float mw = band*band*0.055*fbm3(d.xz*7.0+4.0);\n" +
    "  col += (star*1.35+mw)*vec3(0.80,0.86,1.0);\n" +
    "  float ang = acos(clamp(dot(d,uMoonDir),-1.0,1.0));\n" +
    "  float R = 0.0265;\n" +
    "  float disc = smoothstep(R, R*0.90, ang);\n" +
    "  float maria = fbm3(d.xy*210.0+13.0);\n" +
    "  float limb = smoothstep(R, R*0.55, ang);\n" +
    "  vec3 mc = uMoonCol*(0.62+0.46*maria)*(0.72+0.32*limb);\n" +
    "  col = mix(col, mc, disc);\n" +
    "  col += uMoonCol*smoothstep(0.24,0.0,ang)*0.075;\n" +
    "  float cy = max(h,0.022);\n" +
    "  vec2 cp = d.xz/cy*0.62 + vec2(uTime*0.0035, uTime*0.0016);\n" +
    "  float c1 = fbm4(cp*1.25);\n" +
    "  float c2 = fbm3(cp*4.1+7.0);\n" +
    "  float dens = smoothstep(0.50,0.84,c1*0.80+c2*0.30)*smoothstep(0.005,0.20,h);\n" +
    "  vec3 cloudCol = mix(vec3(0.030,0.038,0.055), uMoonCol*0.34, 0.30+0.55*smoothstep(0.15,0.9,dens));\n" +
    "  cloudCol += uHaze*0.16*smoothstep(0.25,0.0,h);\n" +
    "  col = mix(col, cloudCol, dens*0.62);\n" +
    "  gl_FragColor = vec4(grade(col), 1.0);\n" +
    "}",
  "sky",
);

/* ------------------------------------------------------ 实体着色程序 */
var progSolid = makeProgram(
  "precision highp float;\n" +
    "attribute vec3 aPos;\n" +
    "attribute vec3 aNrm;\n" +
    "attribute vec3 aCol;\n" +
    "attribute vec2 aUv;\n" +
    "uniform mat4 uViewProj;\n" +
    "uniform mat4 uModel;\n" +
    "varying vec3 vWorld;\n" +
    "varying vec3 vNrm;\n" +
    "varying vec3 vCol;\n" +
    "varying vec2 vUv;\n" +
    "void main(){\n" +
    "  vec4 wp = uModel*vec4(aPos,1.0);\n" +
    "  vWorld = wp.xyz;\n" +
    "  vNrm = normalize(mat3(uModel)*aNrm);\n" +
    "  vCol = aCol;\n" +
    "  vUv = aUv;\n" +
    "  gl_Position = uViewProj*wp;\n" +
    "}",

  "precision highp float;\n" +
    "varying vec3 vWorld;\n" +
    "varying vec3 vNrm;\n" +
    "varying vec3 vCol;\n" +
    "varying vec2 vUv;\n" +
    "uniform vec3 uCamPos;\n" +
    "uniform vec3 uMoonDir;\n" +
    "uniform vec3 uMoonCol;\n" +
    "uniform vec3 uAmbSky;\n" +
    "uniform vec3 uAmbGround;\n" +
    "uniform vec3 uFogColor;\n" +
    "uniform float uFogK;\n" +
    "uniform float uExposure;\n" +
    "uniform float uSpec;\n" +
    "uniform float uShine;\n" +
    "uniform float uEmissive;\n" +
    "uniform float uGrain;\n" +
    "uniform float uTime;\n" +
    "uniform vec4 uLPos[4];\n" +
    "uniform vec3 uLCol[4];\n" +
    "uniform float uLInt[4];\n" +
    GLSL_NOISE +
    "\n" +
    GLSL_TONE +
    "\n" +
    "void main(){\n" +
    "  vec3 N = normalize(vNrm);\n" +
    "  vec3 V = normalize(uCamPos - vWorld);\n" +
    "  vec3 albedo = vCol;\n" +
    "  if (uEmissive > 0.5){\n" +
    "    float g = 0.55+0.45*vUv.y;\n" +
    "    gl_FragColor = vec4(albedo*g*1.5, 1.0);\n" +
    "    return;\n" +
    "  }\n" +
    "  float ndlMoon = max(dot(N, uMoonDir), 0.0);\n" +
    "  vec3 amb = mix(uAmbGround, uAmbSky, 0.5+0.5*N.y);\n" +
    "  vec3 diff = amb + uMoonCol*ndlMoon;\n" +
    "  vec3 specC = vec3(0.0);\n" +
    "  for (int i=0;i<4;i++){\n" +
    "    vec3 L = uLPos[i].xyz - vWorld;\n" +
    "    float d2 = dot(L,L);\n" +
    "    float rad = max(uLPos[i].w, 0.001);\n" +
    "    float att = 1.0/(1.0 + d2/(rad*rad));\n" +
    "    vec3 ldir = L*inversesqrt(d2+1e-4);\n" +
    "    float ndl = max(dot(N,ldir), 0.0);\n" +
    "    diff += uLCol[i]*uLInt[i]*att*(ndl*0.82+0.18);\n" +
    "    vec3 H = normalize(ldir+V);\n" +
    "    specC += uLCol[i]*uLInt[i]*att*pow(max(dot(N,H),0.0), uShine);\n" +
    "  }\n" +
    "  vec3 col = albedo*diff + specC*uSpec;\n" +
    "  if (uSpec > 0.3){\n" +
    "    vec3 R = reflect(-V,N);\n" +
    "    vec3 env = mix(uAmbGround*2.2, uAmbSky*2.6, smoothstep(-0.5,0.8,R.y));\n" +
    "    float fres = pow(1.0-max(dot(N,V),0.0),3.0);\n" +
    "    col += env*(0.18+0.82*fres)*uSpec*1.1;\n" +
    "    col += uMoonCol*pow(max(dot(R,uMoonDir),0.0), 220.0)*2.6*uSpec;\n" +
    "  }\n" +
    "  float d = length(vWorld-uCamPos);\n" +
    "  float low = exp(-max(vWorld.y,0.0)*0.35);\n" +
    "  float fog = 1.0-exp(-d*uFogK*(0.55+0.65*low));\n" +
    "  col = mix(col, uFogColor, clamp(fog,0.0,1.0));\n" +
    "  gl_FragColor = vec4(grade(col*uExposure), 1.0);\n" +
    "}",
  "solid",
);

/* ------------------------------------------------------ 旌旗程序 */
var progCloth = makeProgram(
  "precision highp float;\n" +
    "attribute vec3 aPos;\n" +
    "attribute vec3 aNrm;\n" +
    "attribute vec3 aCol;\n" +
    "attribute vec2 aUv;\n" +
    "attribute vec3 aInfo;\n" +
    "uniform mat4 uViewProj;\n" +
    "uniform mat4 uModel;\n" +
    "uniform float uTime;\n" +
    "varying vec3 vWorld;\n" +
    "varying vec3 vNrm;\n" +
    "varying vec3 vCol;\n" +
    "varying vec2 vUv;\n" +
    "void main(){\n" +
    "  vec3 p = aPos;\n" +
    "  float att = aInfo.z;\n" +
    "  float ph = aInfo.y;\n" +
    "  float amp = aInfo.x;\n" +
    "  float gust = 0.72+0.28*sin(uTime*0.55+ph*0.7);\n" +
    "  p.z += sin(p.y*2.15 - uTime*2.35 + ph)*amp*att*gust;\n" +
    "  p.x += cos(p.y*1.55 - uTime*1.75 + ph*1.3)*amp*0.42*att*gust;\n" +
    "  vec4 wp = uModel*vec4(p,1.0);\n" +
    "  vWorld = wp.xyz;\n" +
    "  vNrm = normalize(mat3(uModel)*aNrm);\n" +
    "  vCol = aCol;\n" +
    "  vUv = aUv;\n" +
    "  gl_Position = uViewProj*wp;\n" +
    "}",

  "precision highp float;\n" +
    "varying vec3 vWorld;\n" +
    "varying vec3 vNrm;\n" +
    "varying vec3 vCol;\n" +
    "varying vec2 vUv;\n" +
    "uniform vec3 uCamPos;\n" +
    "uniform vec3 uMoonDir;\n" +
    "uniform vec3 uMoonCol;\n" +
    "uniform vec3 uAmbSky;\n" +
    "uniform vec3 uAmbGround;\n" +
    "uniform vec3 uFogColor;\n" +
    "uniform float uFogK;\n" +
    "uniform float uExposure;\n" +
    "uniform vec4 uLPos[4];\n" +
    "uniform vec3 uLCol[4];\n" +
    "uniform float uLInt[4];\n" +
    GLSL_NOISE +
    "\n" +
    GLSL_TONE +
    "\n" +
    "void main(){\n" +
    "  vec3 N = normalize(vNrm);\n" +
    "  if (!gl_FrontFacing) N = -N;\n" +
    "  vec3 V = normalize(uCamPos - vWorld);\n" +
    "  float ndl = max(dot(N,uMoonDir),0.0);\n" +
    "  vec3 diff = mix(uAmbGround,uAmbSky,0.5+0.5*N.y)*1.15 + uMoonCol*ndl;\n" +
    "  for (int i=0;i<4;i++){\n" +
    "    vec3 L = uLPos[i].xyz - vWorld;\n" +
    "    float d2 = dot(L,L);\n" +
    "    float rad = max(uLPos[i].w,0.001);\n" +
    "    float att = 1.0/(1.0+d2/(rad*rad));\n" +
    "    float nl = max(dot(N, L*inversesqrt(d2+1e-4)), 0.0);\n" +
    "    diff += uLCol[i]*uLInt[i]*att*(nl*0.75+0.25)*1.15;\n" +
    "  }\n" +
    "  vec3 col = vCol*diff;\n" +
    "  float weave = vnoise(vUv*vec2(120.0,90.0))*0.12+0.94;\n" +
    "  col *= weave;\n" +
    "  col *= 0.86+0.14*smoothstep(0.0,0.35,vUv.x);\n" +
    "  float d = length(vWorld-uCamPos);\n" +
    "  float fog = 1.0-exp(-d*uFogK*1.05);\n" +
    "  col = mix(col, uFogColor, clamp(fog,0.0,1.0));\n" +
    "  gl_FragColor = vec4(grade(col*uExposure), 1.0);\n" +
    "}",
  "cloth",
);

/* ------------------------------------------------------ 草叶程序 */
var progGrass = makeProgram(
  "precision highp float;\n" +
    "attribute vec3 aPos;\n" +
    "attribute vec2 aLocal;\n" +
    "attribute vec3 aSeed;\n" +
    "uniform mat4 uViewProj;\n" +
    "uniform float uTime;\n" +
    "varying vec2 vLocal;\n" +
    "varying vec3 vWorld;\n" +
    "varying vec3 vCol;\n" +
    "void main(){\n" +
    "  float ang = aSeed.z;\n" +
    "  vec3 right = vec3(cos(ang),0.0,sin(ang));\n" +
    "  float h = aSeed.x;\n" +
    "  vec3 p = aPos + right*(aLocal.x*0.060*(1.0-0.55*aLocal.y)) + vec3(0.0,aLocal.y*h,0.0);\n" +
    "  float sway = sin(uTime*1.55 + aSeed.y*6.283 + aPos.x*0.42)*0.085*(aLocal.y*aLocal.y);\n" +
    "  p.x += sway; p.z += sway*0.55;\n" +
    "  vLocal = aLocal;\n" +
    "  vWorld = p;\n" +
    "  vCol = vec3(0.062,0.070,0.040)*(0.65+0.55*aLocal.y);\n" +
    "  gl_Position = uViewProj*vec4(p,1.0);\n" +
    "}",

  "precision highp float;\n" +
    "varying vec2 vLocal;\n" +
    "varying vec3 vWorld;\n" +
    "varying vec3 vCol;\n" +
    "uniform vec3 uCamPos;\n" +
    "uniform vec3 uLampPos;\n" +
    "uniform vec3 uLampCol;\n" +
    "uniform vec3 uAmbSky;\n" +
    "uniform vec3 uFogColor;\n" +
    "uniform float uFogK;\n" +
    "uniform float uExposure;\n" +
    GLSL_TONE +
    "\n" +
    "void main(){\n" +
    "  float w = mix(1.0, 0.06, clamp(vLocal.y,0.0,1.0));\n" +
    "  float a = smoothstep(w, w*0.55, abs(vLocal.x));\n" +
    "  a *= smoothstep(0.0,0.10,vLocal.y);\n" +
    "  if (a < 0.02) discard;\n" +
    "  vec3 L = uLampPos - vWorld;\n" +
    "  float d2 = dot(L,L);\n" +
    "  float att = 1.0/(1.0+d2/20.0);\n" +
    "  float nl = max(dot(normalize(vec3(vLocal.x,0.55,0.0)), L*inversesqrt(d2+1e-4)), 0.0);\n" +
    "  vec3 col = vCol*(uAmbSky*1.6 + uLampCol*att*(nl*1.3+0.25));\n" +
    "  float d = length(vWorld-uCamPos);\n" +
    "  col = mix(col, uFogColor, clamp(1.0-exp(-d*uFogK*1.2),0.0,1.0));\n" +
    "  gl_FragColor = vec4(grade(col*uExposure), a*0.92);\n" +
    "}",
  "grass",
);

/* ------------------------------------------------------ 精灵程序 */
var progSprite = makeProgram(
  "precision highp float;\n" +
    "attribute vec3 aCenter;\n" +
    "attribute vec2 aLocal;\n" +
    "attribute vec3 aCol;\n" +
    "attribute vec4 aInfo;\n" +
    "uniform mat4 uViewProj;\n" +
    "uniform vec3 uCamRight;\n" +
    "uniform vec3 uCamUp;\n" +
    "uniform float uFlat;\n" +
    "uniform float uTime;\n" +
    "varying vec2 vUv;\n" +
    "varying vec3 vCol;\n" +
    "varying vec4 vInfo;\n" +
    "varying vec3 vWorld;\n" +
    "void main(){\n" +
    "  vec3 c = aCenter;\n" +
    "  float sz = aInfo.x;\n" +
    "  if (aInfo.w > 1.5 && aInfo.w < 3.5){\n" +
    "    float life = fract(uTime*0.26 + aInfo.z);\n" +
    "    if (aInfo.w < 2.5){\n" +
    "      life = fract(aInfo.z*7.3 + uTime*0.045);\n" +
    "      c.y += life*5.2; c.x += life*0.55; sz *= 0.70+life*1.9;\n" +
    "    } else {\n" +
    "      c.y += life*3.6; c.x += sin(uTime*0.9+aInfo.z*21.0)*0.30*life;\n" +
    "      sz *= 1.0-0.55*life;\n" +
    "    }\n" +
    "  }\n" +
    "  vec3 right = uCamRight;\n" +
    "  vec3 up = uCamUp;\n" +
    "  if (uFlat > 0.5){ right = vec3(1.0,0.0,0.0); up = vec3(0.0,0.0,1.0); c.y += 0.015; }\n" +
    "  vec2 l = aLocal;\n" +
    "  float s = sin(aInfo.y), co = cos(aInfo.y);\n" +
    "  l = vec2(l.x*co-l.y*s, l.x*s+l.y*co);\n" +
    "  vec3 wp = c + right*(l.x*sz) + up*(l.y*sz);\n" +
    "  vUv = aLocal;\n" +
    "  vCol = aCol;\n" +
    "  vInfo = aInfo;\n" +
    "  vWorld = wp;\n" +
    "  gl_Position = uViewProj*vec4(wp,1.0);\n" +
    "}",

  "precision highp float;\n" +
    "varying vec2 vUv;\n" +
    "varying vec3 vCol;\n" +
    "varying vec4 vInfo;\n" +
    "varying vec3 vWorld;\n" +
    "uniform float uKind;\n" +
    "uniform float uTime;\n" +
    "uniform float uAlpha;\n" +
    "uniform vec3 uFogColor;\n" +
    "uniform vec3 uCamPos;\n" +
    "uniform float uFogK;\n" +
    GLSL_NOISE +
    "\n" +
    "void main(){\n" +
    "  float a = 0.0;\n" +
    "  vec3 col = vCol;\n" +
    "  float d = length(vUv);\n" +
    "  if (uKind < 0.5){\n" +
    "    a = pow(max(0.0,1.0-d), 2.6);\n" +
    "    a *= 0.85+0.15*sin(uTime*9.0+vInfo.z*7.0);\n" +
    "  } else if (uKind < 1.5){\n" +
    "    float y = vUv.y*0.5+0.5;\n" +
    "    float n = fbm3(vec2(vUv.x*3.6, vUv.y*2.4-uTime*1.9+vInfo.z*9.0));\n" +
    "    float wdt = (1.0-y)*0.86+0.10;\n" +
    "    float body = smoothstep(wdt, wdt*0.28, abs(vUv.x+(n-0.5)*0.34*(1.0-y)));\n" +
    "    body *= smoothstep(0.0,0.14,y)*smoothstep(1.0,0.52,y);\n" +
    "    col = mix(vec3(1.0,0.34,0.07), vec3(1.0,0.78,0.38), pow(1.0-y,1.5));\n" +
    "    col = mix(col, vec3(1.0,0.96,0.82), pow(1.0-y,7.0)*0.85);\n" +
    "    a = body*(0.55+0.55*n);\n" +
    "  } else if (uKind < 2.5){\n" +
    "    float n = fbm3(vUv*1.7+vec2(vInfo.z*3.0, -uTime*0.16));\n" +
    "    float lifeS = fract(vInfo.z*7.3 + uTime*0.045);\n" +
    "    a = smoothstep(1.0,0.05,d)*(0.28+0.62*n)*smoothstep(1.0,0.35,d);\n" +
    "    a *= (1.0-lifeS*0.85)*smoothstep(0.0,0.12,lifeS);\n" +
    "    col = mix(vec3(0.10,0.11,0.125), vec3(0.30,0.27,0.24), n*0.7);\n" +
    "  } else if (uKind < 3.5){\n" +
    "    float lifeE = fract(uTime*0.26 + vInfo.z);\n" +
    "    a = smoothstep(0.62,0.0,d);\n" +
    "    a *= (0.55+0.45*sin(uTime*6.0+vInfo.z*20.0))*(1.0-lifeE*0.75);\n" +
    "  } else if (uKind < 4.5){\n" +
    "    a = pow(max(0.0,1.0-d), 1.7)*0.55;\n" +
    "    col = vec3(0.012,0.012,0.014);\n" +
    "  } else {\n" +
    "    col = vCol*(exp(-d*11.0)*1.5+exp(-d*2.6)*0.22);\n" +
    "    a = 1.0;\n" +
    "  }\n" +
    "  if (uKind > 2.5 && uKind < 4.5){\n" +
    "    float fog = 1.0-exp(-length(vWorld-uCamPos)*uFogK);\n" +
    "    col = mix(col, uFogColor, fog*0.5);\n" +
    "  }\n" +
    "  if (a <= 0.004) discard;\n" +
    "  gl_FragColor = vec4(col, a*uAlpha);\n" +
    "}",

/* ------------------------------------------------------- 网格工具 */
var ATTR_SIZE = {
  aPos: 3,
  aNrm: 3,
  aCol: 3,
  aUv: 2,
  aInfo: 3,
  aLocal: 2,
  aSeed: 3,
  aCenter: 3,
};

function uploadMesh(attrs, indices) {
  var m = {
    buf: {},
    count: indices.length,
    type: canU32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT,
  };
  for (var k in attrs) {
    var arr =
      attrs[k] instanceof Float32Array ? attrs[k] : new Float32Array(attrs[k]);
    var b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
    m.buf[k] = b;
  }
  var ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(
    gl.ELEMENT_ARRAY_BUFFER,
    canU32 ? new Uint32Array(indices) : new Uint16Array(indices),
    gl.STATIC_DRAW,
  );
  m.ibo = ib;
  return m;
}

function drawMesh(prog, mesh) {
  var k, loc, b;
  for (k in mesh.buf) {
    loc = prog.a[k];
    if (loc === undefined || loc < 0) continue;
    b = mesh.buf[k];
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, ATTR_SIZE[k], gl.FLOAT, false, 0, 0);
  }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.ibo);
  gl.drawElements(gl.TRIANGLES, mesh.count, mesh.type, 0);
  drawCallCount++;
}

function Mesh() {
  return { p: [], n: [], c: [], u: [], i: [] };
}
function vtx(m, x, y, z, nx, ny, nz, col, uv) {
  m.p.push(x, y, z);
  m.n.push(nx, ny, nz);
  m.c.push(col[0], col[1], col[2]);
  m.u.push(uv ? uv[0] : 0, uv ? uv[1] : 0);
  return m.p.length / 3 - 1;
}
function tri(m, a, b, c) {
  m.i.push(a, b, c);
}
function quadIdx(m, a, b, c, d) {
  m.i.push(a, b, c, a, c, d);
}

function flatTri(m, p0, p1, p2, col) {
  var ax = p1[0] - p0[0],
    ay = p1[1] - p0[1],
    az = p1[2] - p0[2];
  var bx = p2[0] - p0[0],
    by = p2[1] - p0[1],
    bz = p2[2] - p0[2];
  var nx = ay * bz - az * by,
    ny = az * bx - ax * bz,
    nz = ax * by - ay * bx;
  var nl = Math.hypot(nx, ny, nz) || 1;
  nx /= nl;
  ny /= nl;
  nz /= nl;
  var i0 = vtx(m, p0[0], p0[1], p0[2], nx, ny, nz, col, [0, 0]);
  var i1 = vtx(m, p1[0], p1[1], p1[2], nx, ny, nz, col, [1, 0]);
  var i2 = vtx(m, p2[0], p2[1], p2[2], nx, ny, nz, col, [0.5, 1]);
  tri(m, i0, i1, i2);
}

/* 平面四边面（同法线，硬边），用于帐篷、木器、旗面 */
function flatQuad(m, p0, p1, p2, p3, col, uv) {
  var ax = p1[0] - p0[0],
    ay = p1[1] - p0[1],
    az = p1[2] - p0[2];
  var bx = p3[0] - p0[0],
    by = p3[1] - p0[1],
    bz = p3[2] - p0[2];
  var nx = ay * bz - az * by,
    ny = az * bx - ax * bz,
    nz = ax * by - ay * bx;
  var nl = Math.hypot(nx, ny, nz) || 1;
  nx /= nl;
  ny /= nl;
  nz /= nl;
  var i0 = vtx(m, p0[0], p0[1], p0[2], nx, ny, nz, col, uv ? uv[0] : [0, 0]);
  var i1 = vtx(m, p1[0], p1[1], p1[2], nx, ny, nz, col, uv ? uv[1] : [1, 0]);
  var i2 = vtx(m, p2[0], p2[1], p2[2], nx, ny, nz, col, uv ? uv[2] : [1, 1]);
  var i3 = vtx(m, p3[0], p3[1], p3[2], nx, ny, nz, col, uv ? uv[3] : [0, 1]);
  quadIdx(m, i0, i1, i2, i3);
}

/* 带旋转的方盒，盒心 (cx,cy,cz)，尺寸 (sx,sy,sz) */
function addBox(m, cx, cy, cz, sx, sy, sz, ry, col, shade) {
  var c = Math.cos(ry || 0),
    s = Math.sin(ry || 0);
  function P(x, y, z) {
    return [cx + x * c + z * s, cy + y, cz - x * s + z * c];
  }
  var hx = sx / 2,
    hy = sy / 2,
    hz = sz / 2;
  var f = [col[0], col[1], col[2]];
  function sh(k) {
    return [f[0] * k, f[1] * k, f[2] * k];
  }
  flatQuad(
    m,
    P(-hx, hy, -hz),
    P(hx, hy, -hz),
    P(hx, hy, hz),
    P(-hx, hy, hz),
    sh(1.0),
  ); /* 顶 */
  flatQuad(
    m,
    P(-hx, -hy, hz),
    P(hx, -hy, hz),
    P(hx, hy, hz),
    P(-hx, hy, hz),
    sh(shade ? 0.95 : 0.9),
  );
  flatQuad(
    m,
    P(hx, -hy, -hz),
    P(-hx, -hy, -hz),
    P(-hx, hy, -hz),
    P(hx, hy, -hz),
    sh(0.62),
  );
  flatQuad(
    m,
    P(-hx, -hy, -hz),
    P(-hx, -hy, hz),
    P(-hx, hy, hz),
    P(-hx, hy, -hz),
    sh(0.78),
  );
  flatQuad(
    m,
    P(hx, -hy, hz),
    P(hx, -hy, -hz),
    P(hx, hy, -hz),
    P(hx, hy, hz),
    sh(0.86),
  );
}

/* 沿曲线的管（旗杆、矛杆、号角） */
function addTube(m, pts, radii, sides, col, capEnds) {
  var n = pts.length,
    i,
    j;
  var rings = [];
  for (i = 0; i < n; i++) {
    var a = pts[Math.max(0, i - 1)],
      b = pts[Math.min(n - 1, i + 1)];
    var tx = b[0] - a[0],
      ty = b[1] - a[1],
      tz = b[2] - a[2];
    var tl = Math.hypot(tx, ty, tz) || 1;
    tx /= tl;
    ty /= tl;
    tz /= tl;
    var ux = 0,
      uy = 1,
      uz = 0;
    if (Math.abs(ty) > 0.92) {
      ux = 1;
      uy = 0;
      uz = 0;
    }
    var rx = uy * tz - uz * ty,
      ry = uz * tx - ux * tz,
      rz = ux * ty - uy * tx;
    var rl = Math.hypot(rx, ry, rz) || 1;
    rx /= rl;
    ry /= rl;
    rz /= rl;
    var sx = ty * rz - tz * ry,
      sy = tz * rx - tx * rz,
      sz = tx * ry - ty * rx;
    var ring = [];
    for (j = 0; j < sides; j++) {
      var ang = (j / sides) * Math.PI * 2;
      var ca = Math.cos(ang),
        sa = Math.sin(ang);
      var nx = rx * ca + sx * sa,
        ny = ry * ca + sy * sa,
        nz = rz * ca + sz * sa;
      var r = radii[i];
      ring.push(
        vtx(
          m,
          pts[i][0] + nx * r,
          pts[i][1] + ny * r,
          pts[i][2] + nz * r,
          nx,
          ny,
          nz,
          col,
          [j / sides, i / (n - 1)],
        ),
      );
    }
    rings.push(ring);
  }
  for (i = 0; i < n - 1; i++) {
    for (j = 0; j < sides; j++) {
      var j2 = (j + 1) % sides;
      quadIdx(m, rings[i][j], rings[i][j2], rings[i + 1][j2], rings[i + 1][j]);
    }
  }
  if (capEnds) {
    var last = rings[n - 1],
      first = rings[0];
    for (j = 1; j < sides - 1; j++) {
      tri(m, last[0], last[j], last[j + 1]);
      tri(m, first[0], first[j + 1], first[j]);
    }
  }
}

/* 旋转体（灯、酒瓮、杯） */
function addLathe(m, profile, sides, col, cx, cy, cz, scale) {
  var rings = [],
    i,
    j;
  var s = scale || 1;
  for (i = 0; i < profile.length; i++) {
    var r = profile[i][0] * s,
      y = profile[i][1] * s;
    var pr = profile[Math.max(0, i - 1)],
      nx = profile[Math.min(profile.length - 1, i + 1)];
    var dr = nx[0] - pr[0],
      dy = nx[1] - pr[1];
    var dl = Math.hypot(dr, dy) || 1;
    dr /= dl;
    dy /= dl;
    var ring = [];
    for (j = 0; j < sides; j++) {
      var ang = (j / sides) * Math.PI * 2,
        ca = Math.cos(ang),
        sa = Math.sin(ang);
      var n = [dy * ca, -dr, dy * sa];
      var nl = Math.hypot(n[0], n[1], n[2]) || 1;
      ring.push(
        vtx(
          m,
          cx + r * ca,
          cy + y,
          cz + r * sa,
          n[0] / nl,
          n[1] / nl,
          n[2] / nl,
          col,
          [j / sides, i / (profile.length - 1)],
        ),
      );
    }
    rings.push(ring);
  }
  for (i = 0; i < rings.length - 1; i++) {
    for (j = 0; j < sides; j++) {
      var j2 = (j + 1) % sides;
      quadIdx(m, rings[i][j], rings[i][j2], rings[i + 1][j2], rings[i + 1][j]);
    }
  }
}

/* ------------------------------------------------------- 地形高度 */
function groundH(x, z) {
  var camp = smoothstep(5, 25, Math.hypot(x * 0.9, z + 2));
  var n =
    (N1.fbm(x * 0.03 + 3.1, z * 0.03 + 7.4, 4) - 0.5) * 2.6 +
    (N2.fbm(x * 0.1, z * 0.1, 3) - 0.5) * 0.55;
  n *= 0.28 + 0.72 * camp;
  var rise =
    smoothstep(34, 110, Math.hypot(x, z + 6)) *
    3.4 *
    (0.45 + N2.fbm(x * 0.012, z * 0.012, 3));
  return n * 0.55 + rise - 0.05;
}

/* ------------------------------------------------------- 地形网格 */
function buildTerrain() {
  var NX = isSmall ? 104 : 152,
    NZ = NX,
    X0 = -115,
    X1 = 115,
    Z0 = -135,
    Z1 = 45;
  var nv = (NX + 1) * (NZ + 1);
  var pos = new Float32Array(nv * 3),
    nrm = new Float32Array(nv * 3),
    col = new Float32Array(nv * 3),
    uv = new Float32Array(nv * 2);
  var idx = new Uint32Array(NX * NZ * 6);
  var i,
    j,
    k = 0,
    vi = 0;
  var earth = [0.07, 0.058, 0.045],
    grass = [0.052, 0.06, 0.036],
    dirt = [0.115, 0.098, 0.076],
    stone = [0.105, 0.1, 0.092];
  for (j = 0; j <= NZ; j++) {
    var z = Z0 + ((Z1 - Z0) * j) / NZ;
    for (i = 0; i <= NX; i++) {
      var x = X0 + ((X1 - X0) * i) / NX;
      var y = groundH(x, z);
      var e = 0.45;
      var hx = groundH(x + e, z) - groundH(x - e, z);
      var hz = groundH(x, z + e) - groundH(x, z - e);
      var nx = -hx / (2 * e),
        ny = 1,
        nz = -hz / (2 * e);
      var nl = Math.hypot(nx, ny, nz) || 1;
      nx /= nl;
      ny /= nl;
      nz /= nl;
      var n1 = N1.fbm(x * 0.14, z * 0.14, 3),
        n2 = N2.fbm(x * 0.55, z * 0.55, 3);
      var slope = 1.0 - ny;
      var path =
        Math.exp(-Math.pow((x - 0.55 * Math.sin(z * 0.055) - 0.4) / 1.55, 2)) *
        smoothstep(18, 2, z) *
        0.85;
      var c = [0, 0, 0];
      for (var q = 0; q < 3; q++) {
        var base = lerp(earth[q], grass[q], smoothstep(0.42, 0.72, n1));
        base = lerp(base, stone[q], smoothstep(0.28, 0.62, slope) * 0.8);
        base = lerp(base, dirt[q], path);
        c[q] = base * (0.78 + 0.44 * n2);
      }
      pos[vi * 3] = x;
      pos[vi * 3 + 1] = y;
      pos[vi * 3 + 2] = z;
      nrm[vi * 3] = nx;
      nrm[vi * 3 + 1] = ny;
      nrm[vi * 3 + 2] = nz;
      col[vi * 3] = c[0];
      col[vi * 3 + 1] = c[1];
      col[vi * 3 + 2] = c[2];
      uv[vi * 2] = i / NX;
      uv[vi * 2 + 1] = j / NZ;
      vi++;
    }
  }
  for (j = 0; j < NZ; j++) {
    for (i = 0; i < NX; i++) {
      var a = j * (NX + 1) + i,
        b = a + 1,
        c2 = a + NX + 1,
        d = c2 + 1;
      idx[k++] = a;
      idx[k++] = c2;
      idx[k++] = b;
      idx[k++] = b;
      idx[k++] = c2;
      idx[k++] = d;
    }
  }
  return uploadMesh({ aPos: pos, aNrm: nrm, aCol: col, aUv: uv }, idx);
}

/* ------------------------------------------------------- 远山 */
function buildMountains() {
  var m = Mesh();
  function ridge(z, hMin, hMax, col, seedOff) {
    var seg = 64,
      x0 = -230,
      x1 = 230,
      top = [],
      base = [];
    for (var i = 0; i <= seg; i++) {
      var x = x0 + ((x1 - x0) * i) / seg;
      var n = N2.fbm(x * 0.01 + seedOff, 3.7, 4);
      var n2 = N1.fbm(x * 0.035 + seedOff * 2.0, 8.2, 3);
      var h = hMin + (hMax - hMin) * (n * 0.85 + n2 * 0.45);
      top.push([x, h, z]);
      base.push([x, -2, z]);
    }
    for (var j = 0; j < seg; j++) {
      var shade = 0.72 + 0.28 * Math.sin(j * 0.7 + seedOff);
      flatQuad(m, base[j], base[j + 1], top[j + 1], top[j], [
        col[0] * shade,
        col[1] * shade,
        col[2] * shade,
      ]);
    }
  }
  ridge(-118, 5, 21, [0.045, 0.052, 0.062], 1.3);
  ridge(-172, 12, 34, [0.038, 0.045, 0.058], 4.7);
  ridge(-235, 20, 52, [0.033, 0.04, 0.052], 9.1);
  return uploadMesh({ aPos: m.p, aNrm: m.n, aCol: m.c, aUv: m.u }, m.i);
}

/* ------------------------------------------------------- 帐篷 */
var tentMouth = Mesh();
var TENTS = [];
function addTent(m, x, z, w, d, h, yaw, shade, glow) {
  TENTS.push({ x: x, z: z, w: w, d: d });
  var c = Math.cos(yaw),
    s = Math.sin(yaw);
  function P(lx, ly, lz) {
    return [
      x + lx * c + lz * s,
      groundH(x + lx * c + lz * s, z - lx * s + lz * c) + ly - 0.05,
      z - lx * s + lz * c,
    ];
  }
  var fabric = [0.175 * shade, 0.17 * shade, 0.148 * shade];
  var seg = 4,
    i,
    j;
  /* 两坡屋面：脊线到檐口，带轻微下垂 */
  for (var side = -1; side <= 1; side += 2) {
    var prev = null;
    for (i = 0; i <= seg; i++) {
      var t = i / seg,
        lz = -d / 2 + d * t;
      var row = [];
      for (j = 0; j <= 2; j++) {
        var u = j / 2;
        var lx = side * (w / 2) * u;
        var ly =
          lerp(h, h * 0.34, u) -
          Math.sin(Math.PI * u) * 0.1 * Math.sin(t * Math.PI) * 0.9;
        row.push(P(lx, ly, lz));
      }
      if (prev) {
        var cc = [
          fabric[0] * (0.92 + 0.16 * Math.sin(i * 1.7 + side)),
          fabric[1] * (0.92 + 0.16 * Math.sin(i * 1.7 + side)),
          fabric[2] * (0.92 + 0.16 * Math.sin(i * 1.7 + side)),
        ];
        if (side < 0) flatQuad(m, prev[0], prev[1], row[1], row[0], cc);
        else flatQuad(m, row[0], row[1], prev[1], prev[0], cc);
      }
      prev = row;
    }
  }
  /* 两山墙 */
  var apexF = P(0, h, d / 2),
    apexB = P(0, h, -d / 2);
  var fbl = P((-w / 2) * 0.99, 0, d / 2),
    fbr = P((w / 2) * 0.99, 0, d / 2);
  var bbl = P((-w / 2) * 0.99, 0, -d / 2),
    bbr = P((w / 2) * 0.99, 0, -d / 2);
  var eyF_L = P(-w / 2, h * 0.34, d / 2),
    eyF_R = P(w / 2, h * 0.34, d / 2);
  var eyB_L = P(-w / 2, h * 0.34, -d / 2),
    eyB_R = P(w / 2, h * 0.34, -d / 2);
  flatQuad(m, bbl, bbr, eyB_R, eyB_L, [
    fabric[0] * 0.86,
    fabric[1] * 0.86,
    fabric[2] * 0.86,
  ]);
  flatTri(m, eyB_L, eyB_R, apexB, [
    fabric[0] * 0.86,
    fabric[1] * 0.86,
    fabric[2] * 0.86,
  ]);
  /* 前墙留门洞 */
  if (glow) {
    var wall = [fabric[0] * 0.94, fabric[1] * 0.94, fabric[2] * 0.94];
    flatQuad(
      m,
      fbl,
      P(-0.34, 0, d / 2),
      P(-0.34, h * 0.34, d / 2),
      eyF_L,
      wall,
    );
    flatQuad(m, P(0.34, 0, d / 2), fbr, eyF_R, P(0.34, h * 0.34, d / 2), wall);
    flatQuad(
      m,
      P(-0.34, h * 0.3, d / 2),
      P(0.34, h * 0.3, d / 2),
      P(0.34, h * 0.34, d / 2),
      P(-0.34, h * 0.34, d / 2),
      wall,
    );
    flatTri(m, eyF_L, eyF_R, apexF, wall);
    /* 帐内透出的暖光 */
    var mc = [0.62, 0.27, 0.085];
    var g0 = P(-0.3, 0.02, d / 2 - 0.02),
      g1 = P(0.3, 0.02, d / 2 - 0.02);
    var g2 = P(0.3, h * 0.29, d / 2 - 0.02),
      g3 = P(-0.3, h * 0.29, d / 2 - 0.02);
    flatQuad(tentMouth, g0, g1, g2, g3, mc, [
      [0, 0],
      [1, 0],
      [1, 1],
      [0, 1],
    ]);
  } else {
    flatQuad(m, fbl, fbr, eyF_R, eyF_L, [
      fabric[0] * 0.94,
      fabric[1] * 0.94,
      fabric[2] * 0.94,
    ]);
    flatTri(m, eyF_L, eyF_R, apexF, [
      fabric[0] * 0.94,
      fabric[1] * 0.94,
      fabric[2] * 0.94,
    ]);
  }
  /* 脊杆 */
  addTube(
    m,
    [P(0, h, -d / 2 - 0.32), P(0, h, d / 2 + 0.32)],
    [0.035, 0.035],
    5,
    [0.12, 0.09, 0.06],
    true,
  );
  /* 四根拉绳 */
  var ropes = [

/* 在局部坐标系中放置方盒（用于剑格） */
function addLocalBox(m, M, cx, cy, cz, sx, sy, sz, col) {
  var hx = sx / 2,
    hy = sy / 2,
    hz = sz / 2,
    i;
  var pts = [];
  for (i = 0; i < 8; i++) {
    var lx = i & 1 ? hx : -hx,
      ly = i & 2 ? hy : -hy,
      lz = i & 4 ? hz : -hz;
    pts.push(xf(M, [cx + lx, cy + ly, cz + lz]));
  }
  /* 顶点索引：0(-,-,-) 1(+,-,-) 2(-,+,-) 3(+,+,-) 4(-,-,+) 5(+,-,+) 6(-,+,+) 7(+,+,+) */
  flatQuad(m, pts[4], pts[5], pts[7], pts[6], col);
  flatQuad(m, pts[1], pts[0], pts[2], pts[3], [
    col[0] * 0.8,
    col[1] * 0.8,
    col[2] * 0.8,
  ]);
  flatQuad(m, pts[0], pts[4], pts[6], pts[2], [
    col[0] * 0.9,
    col[1] * 0.9,
    col[2] * 0.9,
  ]);
  flatQuad(m, pts[5], pts[1], pts[3], pts[7], [
    col[0] * 0.95,
    col[1] * 0.95,
    col[2] * 0.95,
  ]);
  flatQuad(m, pts[3], pts[2], pts[6], pts[7], col);
  flatQuad(m, pts[0], pts[1], pts[5], pts[4], [
    col[0] * 0.7,

}

function addSword(m, M) {
  var i;
  var stations = [
    [0.0, 0.052, 0.0125],
    [0.1, 0.051, 0.0118],
    [0.46, 0.047, 0.0102],
    [0.74, 0.04, 0.0086],
    [0.88, 0.03, 0.0066],
    [0.965, 0.008, 0.003],
  ];
  var rings = [];
  for (i = 0; i < stations.length; i++) {
    var y = stations[i][0],
      w = stations[i][1],
      t = stations[i][2];
    var pts = [
      [0, y, t],
      [w, y, 0],
      [0, y, -t],
      [-w, y, 0],
    ];
    var ring = [];
    for (var k = 0; k < 4; k++) {
      var p = xf(M, pts[k]);
      ring.push(
        vtx(m, p[0], p[1], p[2], 0, 0, 0, [0.46, 0.48, 0.5], [k / 4, y]),
      );
    }
    rings.push(ring);
  }
  /* 重新以面法线着色，保持棱线 */
  m.p.length -= 0;
  for (i = 0; i < rings.length - 1; i++) {
    for (var k = 0; k < 4; k++) {
      var k2 = (k + 1) % 4;
      var a = rings[i][k],
        b = rings[i][k2],
        c = rings[i + 1][k2],
        d = rings[i + 1][k];
      var pa = [m.p[a * 3], m.p[a * 3 + 1], m.p[a * 3 + 2]];
      var pb = [m.p[b * 3], m.p[b * 3 + 1], m.p[b * 3 + 2]];
      var pc = [m.p[c * 3], m.p[c * 3 + 1], m.p[c * 3 + 2]];
      var e1 = [pb[0] - pa[0], pb[1] - pa[1], pb[2] - pa[2]],
        e2 = [pc[0] - pa[0], pc[1] - pa[1], pc[2] - pa[2]];
      var nx = e1[1] * e2[2] - e1[2] * e2[1],
        ny = e1[2] * e2[0] - e1[0] * e2[2],
        nz = e1[0] * e2[1] - e1[1] * e2[0];
      var nl = Math.hypot(nx, ny, nz) || 1;
      var face = 0.42 + 0.3 * Math.abs(ny / nl);
      m.c[a * 3] = face * 1.05;
      m.c[a * 3 + 1] = face * 1.05;
      m.c[a * 3 + 2] = face * 1.1;
      m.c[b * 3] = face * 1.05;
      m.c[b * 3 + 1] = face * 1.05;
      m.c[b * 3 + 2] = face * 1.1;
      m.c[c * 3] = face * 1.05;
      m.c[c * 3 + 1] = face * 1.05;
      m.c[c * 3 + 2] = face * 1.1;
      m.c[d * 3] = face * 1.05;
      m.c[d * 3 + 1] = face * 1.05;
      m.c[d * 3 + 2] = face * 1.1;
      (function (mm, a, b, c, d, nx, ny, nz) {
        mm.i.push(a, b, c, a, c, d);
        var ids = [a, b, c, d];
        for (var q = 0; q < 4; q++) {
          mm.n[ids[q] * 3] = nx;
          mm.n[ids[q] * 3 + 1] = ny;
          mm.n[ids[q] * 3 + 2] = nz;
        }
      })(m, a, b, c, d, nx / nl, ny / nl, nz / nl);
    }
  }
  /* 护手 */
  addLocalBox(m, M, 0, -0.012, 0, 0.19, 0.03, 0.05, [0.3, 0.24, 0.13]);
  addLocalBox(m, M, 0, -0.036, 0, 0.12, 0.024, 0.042, [0.26, 0.21, 0.12]);
  /* 握柄与柄头 */
  var h0 = xf(M, [0, -0.045, 0]),
    h1 = xf(M, [0, -0.205, 0]);
  addTube(m, [h0, h1], [0.023, 0.021], 8, [0.095, 0.07, 0.048], false);
  for (i = 0; i < 6; i++) {
    var t0 = -0.055 - i * 0.024,
      t1 = t0 - 0.009;
    var r0 = xf(M, [0, t0, 0]),
      r1 = xf(M, [0, t1, 0]);
    addTube(m, [r0, r1], [0.026, 0.026], 8, [0.07, 0.052, 0.036], false);
  }
  var pom = xf(M, [0, -0.225, 0]);
  addLathe(
    m,
    [
      [0, 0.0],
      [0.02, 0.004],
      [0.028, 0.018],
      [0.022, 0.034],
      [0.0, 0.042],
    ],
    8,
    [0.32, 0.25, 0.13],
    pom[0],
    pom[1],
    pom[2],
    1,
  );
}

/* ------------------------------------------------------- 草 */
function buildGrass() {
  var m = { p: [], local: [], seed: [], i: [] };
  var rnd = mulberry32(20260815);
  var clumps = isSmall ? 520 : 1100;
  var vi = 0;
  for (var i = 0; i < clumps; i++) {
    var x = (rnd() - 0.5) * 30;
    var z = 1.0 + rnd() * 13.5;
    if (x > -2.6 && x < -0.1 && z > 3.2 && z < 4.9) continue;
    var y = groundH(x, z);
    var h = 0.16 + rnd() * 0.3;
    var ang = rnd() * 6.283;
    var seed = [h, rnd(), ang];
    var quad = [
      [-1, 0],
      [1, 0],
      [1, 1],
      [-1, 1],
    ];
    for (var k = 0; k < 4; k++) {
      m.p.push(x, y, z);
      m.local.push(quad[k][0], quad[k][1]);
      m.seed.push(seed[0], seed[1], seed[2]);
      vi++;
    }
    m.i.push(vi - 4, vi - 3, vi - 2, vi - 4, vi - 2, vi - 1);
  }
  return uploadMesh({ aPos: m.p, aLocal: m.local, aSeed: m.seed }, m.i);
}

var QUAD_L = [-1, -1, 1, -1, 1, 1, -1, 1];
function pushSprite(b, x, y, z, size, rot, seed, kind, col) {
  if (b.n >= b.cap) return;

  // 非实例绘制时，同一粒子的四个顶点各自需要一份中心坐标。
  for (var vertex = 0; vertex < 4; vertex++) {
    b.c[n * 12 + vertex * 3] = x;
    b.c[n * 12 + vertex * 3 + 1] = y;
    b.c[n * 12 + vertex * 3 + 2] = z;
  }
  for (var k = 0; k < 4; k++) {
    b.l[n * 8 + k * 2] = QUAD_L[k * 2];
    b.l[n * 8 + k * 2 + 1] = QUAD_L[k * 2 + 1];
  }
  for (k = 0; k < 4; k++) {
    b.col[n * 12 + k * 3] = col[0];
    b.col[n * 12 + k * 3 + 1] = col[1];
    b.col[n * 12 + k * 3 + 2] = col[2];
  }
  for (k = 0; k < 4; k++) {
    b.inf[n * 16 + k * 4] = size;
    b.inf[n * 16 + k * 4 + 1] = rot;
    b.inf[n * 16 + k * 4 + 2] = seed;
    b.inf[n * 16 + k * 4 + 3] = kind;
  }
}
function initSprites(b) {
  b.buf = {
    aCenter: gl.createBuffer(),
    aLocal: gl.createBuffer(),
    aCol: gl.createBuffer(),
    aInfo: gl.createBuffer(),
  };
  var idx = new Uint32Array(b.cap * 6);
  for (var i = 0; i < b.cap; i++) {
    var v = i * 4;
    idx[i * 6] = v;
    idx[i * 6 + 1] = v + 1;
    idx[i * 6 + 2] = v + 2;
    idx[i * 6 + 3] = v;
    idx[i * 6 + 4] = v + 2;
    idx[i * 6 + 5] = v + 3;
  }
  b.ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, b.ibo);
  gl.bufferData(
    gl.ELEMENT_ARRAY_BUFFER,
    canU32 ? idx : new Uint16Array(idx),
    gl.STATIC_DRAW,
  );

  uploadSprites(b);
}
function uploadSprites(b) {
  if (b.n === 0) return;
  gl.bindBuffer(gl.ARRAY_BUFFER, b.buf.aCenter);
  gl.bufferData(gl.ARRAY_BUFFER, b.c.subarray(0, b.n * 12), gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, b.buf.aLocal);
  gl.bufferData(gl.ARRAY_BUFFER, b.l.subarray(0, b.n * 8), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, b.buf.aCol);
  gl.bufferData(gl.ARRAY_BUFFER, b.col.subarray(0, b.n * 12), gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, b.buf.aInfo);
  gl.bufferData(gl.ARRAY_BUFFER, b.inf.subarray(0, b.n * 16), gl.DYNAMIC_DRAW);
  b.mesh.count = b.n * 6;
}
function drawSprites(prog, b) {
  if (b.n === 0) return;
  var k, loc;
  var names = { aCenter: 3, aLocal: 2, aCol: 3, aInfo: 4 };

    loc = prog.a[k];
    if (loc === undefined || loc < 0) continue;
    gl.bindBuffer(gl.ARRAY_BUFFER, b.buf[k]);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, names[k], gl.FLOAT, false, 0, 0);
  }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, b.ibo);
  gl.drawElements(gl.TRIANGLES, b.mesh.count, b.mesh.type, 0);
  drawCallCount++;
}

    0.05 * Math.sin(t * 27.1 + 1.3) +

  LINT[0] = 3.1 * flick;
  for (var i = 0; i < 3; i++) {
    var f = FIRES[i];

      0.82 +

      0.06 * Math.sin(t * 19.3 + i * 5.0);

var qLevels = [
  // 桌面低档允许低于原生分辨率，避免 DPR=1 时自动降档没有实际效果。
  { dp: isSmall ? 1.0 : 0.8, n: "流畅" },
  { dp: 1.35, n: "标准" },
  { dp: 1.9, n: "精细" },
];

  timeS = 0,
  pointerX = 0,
  pointerY = 0,

  dreamBlend = 0,
  visible = true,
  needsRender = true;
var reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)",
).matches;
if (reducedMotion) running = false;

function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, qLevels[qIndex].dp);
  var w = Math.max(1, Math.floor(window.innerWidth * dpr));
  var h = Math.max(1, Math.floor(window.innerHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    needsRender = true;
  }
}
resize();
window.addEventListener("resize", resize, false);

window.addEventListener(
  "pointermove",
  function (e) {
    var r = canvas.getBoundingClientRect();
    tgtX = clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1, 1);
    tgtY = clamp(((e.clientY - r.top) / r.height) * 2 - 1, -1, 1);
    needsRender = true;
  },
  { passive: true },
);
window.addEventListener("pointerleave", function () {
  tgtX = 0;
  tgtY = 0;
});

/* ------------------------------------------------------- 渲染 */
var vp = new Float32Array(16),
  viewM = new Float32Array(16),
  projM = new Float32Array(16);
var eye = [0, 1.42, 8.4],
  target = [-0.4, 1.18, -16];

function drawSolid(prog, mesh, model, opt) {
  gl.uniformMatrix4fv(prog.u.uModel, false, model);
  if (opt) {
    if (opt.spec !== undefined) gl.uniform1f(prog.u.uSpec, opt.spec);
    if (opt.shine !== undefined) gl.uniform1f(prog.u.uShine, opt.shine);
    if (opt.emissive !== undefined)
      gl.uniform1f(prog.u.uEmissive, opt.emissive);
  }
  drawMesh(prog, mesh);
}

function render(t) {
  drawCallCount = 0;
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.02, 0.028, 0.045, 1);
  gl.depthMask(true);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  pointerX = lerp(pointerX, tgtX, 0.045);
  pointerY = lerp(pointerY, tgtY, 0.045);
  var drift = Math.sin(t * 0.075) * 0.55;
  var driftY = Math.sin(t * 0.061 + 1.2) * 0.1;

  dreamBlend = reducedMotion
    ? Number(dreaming)
    : lerp(dreamBlend, Number(dreaming), 0.045);
  var portrait = canvas.width / canvas.height < 1;
  eye[0] = lerp(portrait ? -1.42 : 0.02, 0.4, dreamBlend) + pointerX * 0.65;
  eye[1] = lerp(1.42, 2.6, dreamBlend) - pointerY * 0.22 + driftY * 0.4;
  eye[2] = lerp(portrait ? 9.5 : 8.4, 1.5, dreamBlend);
  target[0] =
    lerp(portrait ? -1.42 : -0.45, 0.4, dreamBlend) + pointerX * 2.4 + drift;
  target[1] = lerp(1.18, 1.7, dreamBlend) - pointerY * 0.9 + driftY;
  target[2] = -16;

  var b = basisFrom(eye, target);
  viewM.set(m4lookAt(eye, target, [0, 1, 0]));
  var aspect = canvas.width / canvas.height;
  var fov = portrait ? 65 : 44;
  projM.set(m4perspective(fov * DEG, aspect, 0.06, 620));

  var tanY = Math.tan(fov * 0.5 * DEG);

  var camFwd = [-viewM[2], -viewM[6], -viewM[10]];

  gl.disable(gl.BLEND);

  setU(progSky, {
    uRight: camRight,
    uUp: camUp,
    uFwd: camFwd,
    uTan: [tanY * aspect, tanY],
    uTime: t,
  });

  /* 山与地 */

  });

    shine: 26,
    emissive: 0,
  });

    shine: 74,
    emissive: 0,
  });

  setU(progCloth, BASE);
  setU(progCloth, {
    uViewProj: vp,
    uModel: m4model(0, 0, 0, 0, 1),
    uCamPos: eye,
    uTime: t,
  });
  setLights(progCloth);
  drawMesh(progCloth, clothMesh);
  bind(progSolid);
  setU(progSolid, { uViewProj: vp, uCamPos: eye, uTime: t });
  setLights(progSolid);
  drawSolid(progSolid, poleMesh, m4model(0, 0, 0, 0, 1), {
    spec: 0.2,
    shine: 18,
    emissive: 0,
  });

  /* 草 */
  gl.enable(gl.BLEND);
  bind(progGrass);
  setU(progGrass, BASE);
  setU(progGrass, { uViewProj: vp, uCamPos: eye, uTime: t });

  /* 烟雾 */
  gl.depthMask(false);
  bind(progSprite);
  setU(progSprite, {
    uViewProj: vp,
    uCamRight: camRight,
    uCamUp: camUp,
    uTime: t,
    uKind: 2,
    uAlpha: 0.3,
    uFlat: 0,
    uFogColor: BASE.uFogColor,
    uCamPos: eye,
    uFogK: BASE.uFogK,
  });

  /* 火焰与光晕 */
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  setU(progSprite, { uKind: 0, uAlpha: 0.85 });
  drawSprites(progSprite, glowB);
  setU(progSprite, { uKind: 1, uAlpha: 0.95 });
  drawSprites(progSprite, flameB);

  /* 火星 */
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  setU(progSprite, { uKind: 3, uAlpha: 0.95 });
  drawSprites(progSprite, emberB);

  /* 远处连营灯火 */
  setU(progSprite, { uKind: 5, uAlpha: 0.75 });
  drawSprites(progSprite, farB);

  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
}


/* 源码：src/controls.js */
/* 渲染调度与读者交互；隐藏或滚出视口时停止绘制。 */
var fpsEl = document.getElementById("fps");
var lastT = 0,
  frames = 0,
  fpsClock = 0,
  fpsVal = 0,
  firstDone = false,
  frameDt = 0;
var frameRequest = 0;
var btnQ = document.getElementById("btnQuality");
var btnP = document.getElementById("btnPause");
var btnR = document.getElementById("btnReset");
var btnV = document.getElementById("btnView");
var qualityPinned = false;

function requestFrame() {
  if (!frameRequest && visible && !document.hidden)
    frameRequest = requestAnimationFrame(tick);
}

function tick(now) {
  frameRequest = 0;
  if (document.hidden || !visible) {
    lastT = 0;
    return;
  }
  var dt = lastT ? (now - lastT) / 1000 : 0.016;
  lastT = now;
  frameDt = dt;
  if (running) timeS += Math.min(dt, 0.06);
  if (
    running ||
    needsRender ||
    !firstDone ||
    Math.abs(dreamBlend - Number(dreaming)) > 0.002
  ) {
    try {
      render(timeS);
    } catch (err) {
      running = false;
      fail("渲染中断：" + err.message);
      return;
    }
    needsRender = false;
    frames++;
    if (!fpsClock) fpsClock = now;
    if (now - fpsClock >= 1000) {
      fpsVal = (frames * 1000) / (now - fpsClock);
      frames = 0;
      fpsClock = now;
      fpsEl.textContent = Math.round(fpsVal) + " FPS";
      if (
        running &&
        !qualityPinned &&
        fpsVal < 34 &&
        qIndex > 0 &&
        timeS > 2.5
      ) {
        qIndex--;
        btnQ.textContent = "画质：" + qLevels[qIndex].n;
        resize();
      }
    }
    if (!firstDone) {
      firstDone = true;
      veil.classList.add("hide");
      document.documentElement.dataset.ready = "true";
    }
  }
  if (running || Math.abs(dreamBlend - Number(dreaming)) > 0.002)
    requestFrame();
}

btnQ.textContent = "画质：" + qLevels[qIndex].n;
btnQ.addEventListener("click", function () {
  qualityPinned = true;
  qIndex = (qIndex + 1) % qLevels.length;
  btnQ.textContent = "画质：" + qLevels[qIndex].n;
  resize();
  needsRender = true;
  requestFrame();
});
function updatePause() {
  btnP.textContent = running ? "暂停" : "继续";
  btnP.setAttribute("aria-pressed", String(!running));
}
updatePause();
btnP.addEventListener("click", function () {
  running = !running;
  updatePause();
  lastT = 0;
  fpsClock = 0;
  frames = 0;
  requestFrame();
});
btnV.addEventListener("click", function () {
  dreaming = !dreaming;
  btnV.textContent = dreaming ? "灯下看剑 ↙" : "梦回连营 ↗";
  btnV.setAttribute("aria-pressed", String(dreaming));
  needsRender = true;
  requestFrame();
});
btnR.addEventListener("click", function () {
  tgtX = 0;
  tgtY = 0;
  pointerX = 0;
  pointerY = 0;
  dreaming = false;
  dreamBlend = 0;
  btnV.textContent = "梦回连营 ↗";
  btnV.setAttribute("aria-pressed", "false");
  needsRender = true;
  requestFrame();
});
window.addEventListener("pointermove", requestFrame, { passive: true });
window.addEventListener("resize", function () {
  needsRender = true;
  requestFrame();
});
document.addEventListener("visibilitychange", function () {
  lastT = 0;
  fpsClock = 0;
  frames = 0;
  if (document.hidden) {
    cancelAnimationFrame(frameRequest);
    frameRequest = 0;
  } else {
    needsRender = true;
    requestFrame();
  }
});
function setVisible(next) {
  visible = next;
  lastT = 0;
  cancelAnimationFrame(frameRequest);
  frameRequest = 0;
  if (visible) {
    needsRender = true;
    requestFrame();
  }
}
// 展厅知道 iframe 是否滚出父页面；独立文件不依赖站点脚本。
window.addEventListener(
  "message",
  function (
    /** @type {MessageEvent<import('../../../assets/types').SceneVisibilityMessage>} */ event,
  ) {
    if (event.source !== window.parent || event.origin !== location.origin)
      return;
    if (
      event.data?.type === "poetic-realms-visibility" &&
      typeof event.data.visible === "boolean"
    ) {
      setVisible(event.data.visible);
    }
  },
);
window.addEventListener("keydown", function (event) {
  if (/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName)) return;
  if (event.key === " ") {
    event.preventDefault();
    btnP.click();
  }
  if (event.key.toLowerCase() === "q") btnQ.click();
});

// 只读运行信息供实际验收采样；绘制次数由真实 drawElements 调用计数。
window.__poeticScene = {
  title: "破阵子 · 醉里挑灯看剑",
  fps: function () {
    return fpsVal;
  },
  gl: gl,
  quality: function () {
    return qLevels[qIndex].n;
  },
  drawCalls: function () {
    return drawCallCount;
  },
  frameMs: function () {
    return frameDt * 1000;
  },
  time: function () {
    return timeS;
  },
  paused: function () {
    return !running;
  },
};
requestFrame();

})();
