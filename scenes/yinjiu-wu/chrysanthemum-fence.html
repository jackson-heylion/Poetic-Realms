<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d4a070">
<meta name="description" content="《饮酒·其五》采菊东篱下，悠然见南山。陶渊明。实时三维诗境。">
<title>饮酒·其五 · 采菊东篱下 | Poetic Realms</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#c8956a;color:#2a1e14;font-family:"Songti SC","STSong","Noto Serif SC",serif;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#hud{position:fixed;top:30px;left:36px;max-width:min(380px,calc(100vw - 72px));pointer-events:none;animation:rise 2.6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.brand{font:10px/1 system-ui,sans-serif;letter-spacing:.32em;color:#5a3e28;text-shadow:0 1px 18px #ffe8c8cc}
h1{margin:18px 0 12px;font-size:52px;font-weight:400;letter-spacing:.30em;color:#2a1808;text-shadow:0 1px 30px #ffe0b8d9,0 0 3px #ffe8cce6}
blockquote{margin:0;font-size:16px;line-height:2.1;letter-spacing:.14em;color:#3a2210;text-shadow:0 1px 22px #ffe0b8d9,0 0 3px #ffe8cccc}
#hud p{margin:16px 0 0;font:11px/1.95 system-ui,sans-serif;letter-spacing:.05em;color:#5a3a22;max-width:250px;text-shadow:0 1px 16px #ffe0c0d0}
#fps{position:fixed;right:28px;top:26px;text-align:right;font:10px/1.9 system-ui,sans-serif;letter-spacing:.14em;color:#5a3e28;text-shadow:0 1px 14px #ffe0c0d0}
#bar{position:fixed;right:24px;bottom:24px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 40px)}
#bar .btn{font:11px/1 system-ui,sans-serif;letter-spacing:.05em;padding:9px 12px;color:#2a1e14;text-decoration:none;cursor:pointer;background:#f8ecd8d0;border:1px solid #6a4a2aa0;border-radius:2px;backdrop-filter:blur(8px);transition:background .18s}
#bar .btn:hover{background:#fff4e4}
#bar .btn:focus-visible{outline:2px solid #2a1808;outline-offset:2px}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 40%,#2a180814 82%,#2a180828 100%)}
#notice{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);max-width:80vw;padding:18px 20px;background:#faf0e0f2;border:1px solid #8a6a4a;color:#2a1e14;font:12px/1.7 system-ui,sans-serif;display:none;z-index:9}
#notice.show{display:block}
#veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 58%,#e8c8a0,#c8956a 62%,#a07048);transition:opacity 1.8s ease}
#veil.hide{opacity:0;pointer-events:none}
#veil .t{writing-mode:vertical-rl;text-orientation:upright;font-size:12px;letter-spacing:.6em;color:#5a3a22;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.95}}
.embed #bar,.embed #fps{display:none}
@media(max-width:680px){#hud{top:40px;left:20px}h1{font-size:34px;letter-spacing:.22em;margin:12px 0 9px}blockquote{font-size:12.5px;line-height:2}#hud p{font-size:10px;max-width:210px;line-height:1.85}#fps{top:12px;right:14px;font-size:9px}#bar{right:11px;bottom:11px;gap:5px}#bar .btn{padding:8px 10px;font-size:10px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="hud"><div class="brand">POETIC REALMS / 一诗一境</div><h1>饮酒·其五</h1>
<blockquote>采菊东篱下，<br>悠然见南山。</blockquote>
<p>魏晋 · 陶渊明<br>轻移视点环视田园，滚轮或双指推近；飞鸟归林，山气日夕佳。</p></div>
<div id="fps">— FPS</div>
<div id="bar">
  <a class="btn" href="../../catalog.html?poem=yinjiu-wu" target="_top">← 返回诗境</a>
  <button class="btn" id="btnReset" type="button">重置视角</button>
  <button class="btn" id="btnQuality" type="button">画质：标准</button>
  <button class="btn" id="btnPause" type="button">暂停</button>
</div>
<div id="notice" role="alert"></div>
<div id="veil"><div class="t">悠然见南山</div></div>
<script>if(window.self!==window.top)document.documentElement.classList.add("embed");</script>
<script type="module">
const CDN = [
  'https://lib.baomitu.com/three.js/0.160.0/three.module.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
];
const veil = document.getElementById('veil');
const errEl = document.getElementById('notice');
function fail(msg){ errEl.className='show'; errEl.textContent = msg; veil.classList.add('hide'); }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
(async () => {
  let THREE = null;
  for (const url of CDN){
    try { THREE = await withTimeout(import(url), 10000); break; } catch (e) { /* 换下一个镜像 */ }
  }
  if (!THREE){ fail('未能载入三维引擎（baomitu / bootcdn / jsdelivr 均不可用），请检查网络后刷新。'); return; }
  try { boot(THREE); } catch (e){ console.error(e); fail('场景初始化失败：' + (e && e.message ? e.message : '未知错误')); }
})();

const DEG = Math.PI/180;
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp = (a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

function boot(THREE){
  const rnd = mulberry32(4207);
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 680;

  /* ========== 渲染器 ========== */
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isMobile ? 1.5 : 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = !isMobile;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('stage').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const FOG_COLOR = new THREE.Color(0xd4a878);
  scene.fog = new THREE.FogExp2(FOG_COLOR.getHex(), 0.0032);
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 800);
  camera.position.set(2, 5.5, 16);
  const camTarget = new THREE.Vector3(0, 3.5, -12);

  /* ========== 天空渐变 ========== */
  function makeSkyTexture(){
    const c = document.createElement('canvas'); c.width = 32; c.height = 512;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#2a5580');
    grad.addColorStop(0.3, '#6888aa');
    grad.addColorStop(0.55, '#c8a078');
    grad.addColorStop(0.72, '#e8b878');
    grad.addColorStop(0.85, '#f0c888');
    grad.addColorStop(1, '#e0a868');
    g.fillStyle = grad; g.fillRect(0, 0, 32, 512);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  scene.background = makeSkyTexture();

  /* ========== 光照 ========== */
  const hemi = new THREE.HemisphereLight(0xc8b8a0, 0x6a5838, 1.2);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffd8a0, 1.6);
  sun.position.set(-30, 25, 15);
  if (!isMobile) {
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 120;
    sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
    sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -10;
    sun.shadow.bias = -0.001;
  }
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0xb89870, 0.35));

  /* ========== 山体层 ========== */
  function makeMountainProfile(width, height, segments, seedOffset, peakX, peakW){
    const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
    const g = c.getContext('2d');
    g.clearRect(0, 0, 1024, 256);
    g.beginPath();
    g.moveTo(0, 256);
    for (let i = 0; i <= segments; i++){
      const x = (i / segments) * 1024;
      const nx = x / 1024;
      let h = 0.15;
      h += 0.35 * Math.exp(-Math.pow((nx - peakX) / peakW, 2));
      h += 0.12 * Math.sin(nx * 8.5 + seedOffset);
      h += 0.06 * Math.sin(nx * 18 + seedOffset * 2.1);
      h += 0.03 * Math.sin(nx * 35 + seedOffset * 0.7);
      h = Math.max(0.06, Math.min(0.95, h));
      g.lineTo(x, 256 - h * 256);
    }
    g.lineTo(1024, 256);
    g.closePath();
    return { canvas: c, ctx: g };
  }

  function makeMountainLayer(zPos, width, height, color, opacity, seedOffset, peakX, peakW, blur){
    const { canvas: cv, ctx: g } = makeMountainProfile(width, height, 120, seedOffset, peakX, peakW);
    const grad = g.createLinearGradient(0, 256, 0, 0);
    grad.addColorStop(0, color);
    grad.addColorStop(1, color);
    g.fillStyle = grad; g.fill();
    if (blur > 0) { g.filter = `blur(${blur}px)`; g.drawImage(cv, 0, 0); g.filter = 'none'; }
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity, depthWrite: false, fog: true });
    const geo = new THREE.PlaneGeometry(width, height);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, height * 0.28, zPos);
    return mesh;
  }

  scene.add(makeMountainLayer(-180, 350, 60, '#7a9ab0', 0.45, 1.2, 0.5, 0.25, 3));
  scene.add(makeMountainLayer(-140, 300, 52, '#5a8878', 0.65, 2.8, 0.42, 0.18, 1.5));
  scene.add(makeMountainLayer(-110, 260, 42, '#4a7860', 0.82, 4.1, 0.38, 0.22, 0.5));

  /* ========== 地面 ========== */
  function simpleNoise(x, z){
    return Math.sin(x * 0.08) * Math.cos(z * 0.06) * 1.2
      + Math.sin(x * 0.15 + 1.3) * Math.sin(z * 0.12 + 0.7) * 0.6
      + Math.sin(x * 0.3 + 2.1) * Math.cos(z * 0.25) * 0.25;
  }
  const groundGeo = new THREE.PlaneGeometry(240, 240, isMobile ? 48 : 80, isMobile ? 48 : 80);
  groundGeo.rotateX(-Math.PI / 2);
  const gPos = groundGeo.attributes.position;
  const gColors = new Float32Array(gPos.count * 3);
  const col1 = new THREE.Color(0x6a8848);
  const col2 = new THREE.Color(0x8a7838);
  const col3 = new THREE.Color(0x5a7838);
  for (let i = 0; i < gPos.count; i++){
    const x = gPos.getX(i), z = gPos.getZ(i);
    const dist = Math.sqrt(x * x + z * z);
    const y = simpleNoise(x, z) * clamp(1 - dist / 150, 0.2, 1);
    gPos.setY(i, y);
    const t = (simpleNoise(x * 2, z * 2) + 1.2) / 2.4;
    const c = new THREE.Color().lerpColors(col1, col2, clamp(t, 0, 1));
    c.lerp(col3, clamp(dist / 120, 0, 0.4));
    gColors[i * 3] = c.r; gColors[i * 3 + 1] = c.g; gColors[i * 3 + 2] = c.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(gColors, 3));
  groundGeo.computeVertexNormals();
  const groundMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.receiveShadow = !isMobile;
  scene.add(ground);

  /* ========== 东篱（竹篱笆） ========== */
  const fenceGroup = new THREE.Group();
  const woodMat = new THREE.MeshLambertMaterial({ color: 0x8a6a42 });
  const woodDark = new THREE.MeshLambertMaterial({ color: 0x6a5030 });
  const fenceZ = 4;
  const fenceStartX = -14, fenceEndX = 14;
  const postCount = 16;
  for (let i = 0; i <= postCount; i++){
    const x = lerp(fenceStartX, fenceEndX, i / postCount);
    const postGeo = new THREE.CylinderGeometry(0.06, 0.08, 1.6, 6);
    const post = new THREE.Mesh(postGeo, i % 3 === 0 ? woodDark : woodMat);
    post.position.set(x, 0.8 + simpleNoise(x, fenceZ) * 0.3, fenceZ + (rnd() - 0.5) * 0.15);
    post.rotation.z = (rnd() - 0.5) * 0.06;
    if (!isMobile) post.castShadow = true;
    fenceGroup.add(post);
    if (i < postCount){
      const nx = lerp(fenceStartX, fenceEndX, (i + 1) / postCount);
      const mx = (x + nx) / 2;
      const railGeo = new THREE.CylinderGeometry(0.035, 0.035, nx - x + 0.12, 5);
      const rail1 = new THREE.Mesh(railGeo, woodMat);
      rail1.position.set(mx, 1.22 + simpleNoise(mx, fenceZ) * 0.3, fenceZ + (rnd() - 0.5) * 0.1);
      rail1.rotation.z = Math.PI / 2 + (rnd() - 0.5) * 0.04;
      fenceGroup.add(rail1);
      const rail2 = new THREE.Mesh(railGeo, woodMat);
      rail2.position.set(mx, 0.72 + simpleNoise(mx, fenceZ) * 0.3, fenceZ + (rnd() - 0.5) * 0.1);
      rail2.rotation.z = Math.PI / 2 + (rnd() - 0.5) * 0.04;
      fenceGroup.add(rail2);
    }
  }
  scene.add(fenceGroup);

  /* ========== 菊花 ========== */
  const flowerColors = [0xf0c040, 0xe8b830, 0xf8e878, 0xf0d868, 0xfaf0c0, 0xe8d088];
  const petalGeo = new THREE.PlaneGeometry(0.12, 0.32);
  const centerGeo = new THREE.SphereGeometry(0.07, 6, 5);
  const stemGeo = new THREE.CylinderGeometry(0.018, 0.025, 0.45, 5);
  const stemMat = new THREE.MeshLambertMaterial({ color: 0x4a7828 });

  function makeFlower(colorHex, scale){
    const grp = new THREE.Group();
    const petalMat = new THREE.MeshLambertMaterial({ color: colorHex, side: THREE.DoubleSide });
    const centerMat = new THREE.MeshLambertMaterial({ color: 0xc89030 });
    const stem = new THREE.Mesh(stemGeo, stemMat);
    stem.position.y = 0.22;
    grp.add(stem);
    for (let layer = 0; layer < 3; layer++){
      const petalCount = 7 + layer * 3;
      const layerScale = 1 - layer * 0.18;
      const tilt = (0.55 + layer * 0.18) * Math.PI;
      for (let j = 0; j < petalCount; j++){
        const angle = (j / petalCount) * Math.PI * 2 + layer * 0.35;
        const petal = new THREE.Mesh(petalGeo, petalMat);
        const r = 0.1 * layerScale;
        petal.position.set(Math.cos(angle) * r, 0.45 + layer * 0.02, Math.sin(angle) * r);
        petal.rotation.order = 'YXZ';
        petal.rotation.y = -angle + Math.PI / 2;
        petal.rotation.x = tilt * 0.35;
        petal.scale.set(layerScale, layerScale, 1);
        grp.add(petal);
      }
    }
    const center = new THREE.Mesh(centerGeo, centerMat);
    center.position.y = 0.47;
    grp.add(center);
    grp.scale.setScalar(scale);
    return grp;
  }

  const flowerCount = isMobile ? 35 : 60;
  for (let i = 0; i < flowerCount; i++){
    const t = rnd();
    const fx = lerp(fenceStartX + 1, fenceEndX - 1, t);
    const fz = fenceZ + 0.6 + rnd() * 3.2;
    const col = flowerColors[Math.floor(rnd() * flowerColors.length)];
    const flower = makeFlower(col, 0.7 + rnd() * 0.6);
    flower.position.set(fx, simpleNoise(fx, fz) * 0.3, fz);
    flower.rotation.y = rnd() * Math.PI * 2;
    scene.add(flower);
  }

  /* ========== 草丛 ========== */
  const grassCount = isMobile ? 80 : 160;
  const grassGeo = new THREE.PlaneGeometry(0.08, 0.45);
  const grassMat = new THREE.MeshLambertMaterial({ color: 0x5a8030, side: THREE.DoubleSide });
  for (let i = 0; i < grassCount; i++){
    const gx = (rnd() - 0.5) * 60;
    const gz = (rnd() - 0.3) * 50;
    const blade = new THREE.Mesh(grassGeo, grassMat);
    blade.position.set(gx, simpleNoise(gx, gz) * 0.3 + 0.2, gz);
    blade.rotation.set((rnd() - 0.5) * 0.3, rnd() * Math.PI, (rnd() - 0.5) * 0.2);
    scene.add(blade);
  }

  /* ========== 茅屋（结庐） ========== */
  const hutGroup = new THREE.Group();
  const wallMat = new THREE.MeshLambertMaterial({ color: 0xa89070 });
  const roofMat = new THREE.MeshLambertMaterial({ color: 0xb89858 });
  const wall = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.0, 2.4), wallMat);
  wall.position.y = 1.0;
  if (!isMobile) wall.castShadow = true;
  hutGroup.add(wall);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.6, 1.4, 4), roofMat);
  roof.position.y = 2.7;
  roof.rotation.y = Math.PI / 4;
  if (!isMobile) roof.castShadow = true;
  hutGroup.add(roof);
  const door = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.2), new THREE.MeshLambertMaterial({ color: 0x4a3020 }));
  door.position.set(0, 0.6, 1.21);
  hutGroup.add(door);
  hutGroup.position.set(16, 0, -10);
  hutGroup.rotation.y = -0.35;
  scene.add(hutGroup);

  /* ========== 树木 ========== */
  function makeTree(x, z, scale){
    const grp = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 2.2, 6), new THREE.MeshLambertMaterial({ color: 0x6a4a28 }));
    trunk.position.y = 1.1;
    if (!isMobile) trunk.castShadow = true;
    grp.add(trunk);
    const foliageMat = new THREE.MeshLambertMaterial({ color: 0x4a7828 });
    const foliageMat2 = new THREE.MeshLambertMaterial({ color: 0x5a8830 });
    for (let i = 0; i < 4; i++){
      const r = 0.9 + rnd() * 0.5;
      const sphere = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 6), i % 2 ? foliageMat : foliageMat2);
      sphere.position.set((rnd() - 0.5) * 1.2, 2.2 + i * 0.5 + rnd() * 0.4, (rnd() - 0.5) * 1.2);
      if (!isMobile) sphere.castShadow = true;
      grp.add(sphere);
    }
    grp.position.set(x, simpleNoise(x, z) * 0.3, z);
    grp.scale.setScalar(scale);
    scene.add(grp);
    return grp;
  }
  const trees = [];
  trees.push(makeTree(-20, -8, 1.3));
  trees.push(makeTree(-24, -18, 1.6));
  trees.push(makeTree(22, -20, 1.1));
  trees.push(makeTree(-16, -28, 1.8));
  trees.push(makeTree(28, -30, 1.4));

  /* ========== 飞鸟 ========== */
  const birdMat = new THREE.MeshLambertMaterial({ color: 0x2a2a2a, side: THREE.DoubleSide });
  function makeBird(){
    const grp = new THREE.Group();
    const wingGeo = new THREE.PlaneGeometry(0.6, 0.18);
    const leftWing = new THREE.Mesh(wingGeo, birdMat);
    leftWing.position.x = -0.3;
    leftWing.rotation.z = 0.15;
    grp.add(leftWing);
    const rightWing = new THREE.Mesh(wingGeo, birdMat);
    rightWing.position.x = 0.3;
    rightWing.rotation.z = -0.15;
    grp.add(rightWing);
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), birdMat);
    body.scale.set(1, 0.7, 2.2);
    grp.add(body);
    return { group: grp, leftWing, rightWing, phase: rnd() * Math.PI * 2, speed: 0.3 + rnd() * 0.4, radius: 20 + rnd() * 30, height: 12 + rnd() * 12, xOff: (rnd() - 0.5) * 40 };
  }
  const birds = [];
  const birdCount = isMobile ? 5 : 9;
  for (let i = 0; i < birdCount; i++){
    const b = makeBird();
    scene.add(b.group);
    birds.push(b);
  }

  /* ========== 山间薄雾 ========== */
  const mistCount = isMobile ? 30 : 60;
  const mistGeo = new THREE.PlaneGeometry(6, 2.5);
  const mistMat = new THREE.MeshBasicMaterial({ color: 0xe8d0b0, transparent: true, opacity: 0.12, depthWrite: false, side: THREE.DoubleSide });
  const mistPlanes = [];
  for (let i = 0; i < mistCount; i++){
    const m = new THREE.Mesh(mistGeo, mistMat.clone());
    m.position.set((rnd() - 0.5) * 120, 2 + rnd() * 14, -30 - rnd() * 80);
    m.rotation.set((rnd() - 0.5) * 0.15, rnd() * Math.PI, (rnd() - 0.5) * 0.08);
    m.material.opacity = 0.06 + rnd() * 0.12;
    m.userData.speed = 0.08 + rnd() * 0.15;
    scene.add(m);
    mistPlanes.push(m);
  }

  /* ========== 飘落花瓣 ========== */
  const petalFallCount = isMobile ? 20 : 45;
  const fallGeo = new THREE.PlaneGeometry(0.08, 0.12);
  const fallMat = new THREE.MeshBasicMaterial({ color: 0xf0d878, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false });
  const fallPetals = [];
  for (let i = 0; i < petalFallCount; i++){
    const p = new THREE.Mesh(fallGeo, fallMat.clone());
    p.position.set((rnd() - 0.5) * 30, 1 + rnd() * 12, fenceZ + (rnd() - 0.5) * 10);
    p.userData = { vy: -(0.12 + rnd() * 0.22), vx: (rnd() - 0.5) * 0.1, rotSpeed: (rnd() - 0.5) * 2, phase: rnd() * Math.PI * 2 };
    scene.add(p);
    fallPetals.push(p);
  }

  /* ========== 相机控制 ========== */
  let autoRotate = true, userInteracting = false;
  let spherical = { theta: 0.08, phi: 1.32, radius: 20 };
  let targetSpherical = { ...spherical };
  const camCenter = new THREE.Vector3(0, 3, -8);

  function applyCamera(){
    const sp = targetSpherical;
    camera.position.set(
      camCenter.x + sp.radius * Math.sin(sp.phi) * Math.sin(sp.theta),
      camCenter.y + sp.radius * Math.cos(sp.phi),
      camCenter.z + sp.radius * Math.sin(sp.phi) * Math.cos(sp.theta)
    );
    camera.lookAt(camCenter);
  }
  applyCamera();

  let lastX = 0, lastY = 0, lastDist = 0;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', (e) => { userInteracting = true; autoRotate = false; lastX = e.clientX; lastY = e.clientY; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', (e) => {
    if (!userInteracting) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    targetSpherical.theta -= dx * 0.005;
    targetSpherical.phi = clamp(targetSpherical.phi + dy * 0.004, 0.5, 1.52);
  });
  el.addEventListener('pointerup', (e) => { userInteracting = false; el.releasePointerCapture(e.pointerId); });
  el.addEventListener('pointercancel', () => { userInteracting = false; });
  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetSpherical.radius = clamp(targetSpherical.radius + e.deltaY * 0.02, 8, 50);
  }, { passive: false });

  el.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastDist = Math.sqrt(dx * dx + dy * dy);
    }
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && lastDist > 0){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      targetSpherical.radius = clamp(targetSpherical.radius * (lastDist / dist), 8, 50);
      lastDist = dist;
    }
  }, { passive: true });
  el.addEventListener('touchend', () => { lastDist = 0; });

  /* ========== UI 按钮 ========== */
  let quality = isMobile ? 0 : 1;
  const qualityLabels = ['流畅', '标准', '精细'];
  const btnQuality = document.getElementById('btnQuality');
  function updateQuality(){
    btnQuality.textContent = '画质：' + qualityLabels[quality];
    const pr = [1, 1.5, 2][quality];
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, pr));
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  btnQuality.addEventListener('click', () => { quality = (quality + 1) % 3; updateQuality(); });
  updateQuality();

  let paused = false;
  const btnPause = document.getElementById('btnPause');
  btnPause.addEventListener('click', () => { paused = !paused; btnPause.textContent = paused ? '继续' : '暂停'; });

  document.getElementById('btnReset').addEventListener('click', () => {
    targetSpherical = { theta: 0.08, phi: 1.32, radius: 20 };
    autoRotate = true;
  });

  /* ========== FPS ========== */
  const fpsEl = document.getElementById('fps');
  let frameCount = 0, fpsTime = 0, currentFps = 0;

  /* ========== 动画主循环 ========== */
  const clock = new THREE.Clock();
  let animTime = 0;

  function animate(){
    requestAnimationFrame(animate);
    if (paused) { renderer.render(scene, camera); return; }
    if (document.hidden) return;

    const dt = Math.min(clock.getDelta(), 0.05);
    animTime += dt;

    // FPS
    frameCount++;
    fpsTime += dt;
    if (fpsTime >= 0.5){
      currentFps = Math.round(frameCount / fpsTime);
      fpsEl.textContent = currentFps + ' FPS';
      frameCount = 0; fpsTime = 0;
    }

    // 相机自动旋转
    if (autoRotate && !userInteracting){
      targetSpherical.theta += dt * 0.04;
    }
    spherical.theta = lerp(spherical.theta, targetSpherical.theta, 0.06);
    spherical.phi = lerp(spherical.phi, targetSpherical.phi, 0.06);
    spherical.radius = lerp(spherical.radius, targetSpherical.radius, 0.06);
    applyCamera();

    // 树轻摆
    for (const tree of trees){
      tree.rotation.z = Math.sin(animTime * 0.4 + tree.position.x) * 0.012;
    }

    // 飞鸟
    for (const b of birds){
      const t = animTime * b.speed + b.phase;
      const x = b.xOff + Math.cos(t * 0.3) * b.radius;
      const z = -35 + Math.sin(t * 0.23) * b.radius * 0.5;
      const y = b.height + Math.sin(t * 0.5) * 2.5;
      b.group.position.set(x, y, z);
      const dx = -Math.sin(t * 0.3) * b.radius * 0.3;
      const dz = Math.cos(t * 0.23) * b.radius * 0.5 * 0.23;
      b.group.rotation.y = Math.atan2(dx, dz);
      const flap = Math.sin(t * 5.5) * 0.55;
      b.leftWing.rotation.z = 0.15 + flap;
      b.rightWing.rotation.z = -0.15 - flap;
    }

    // 薄雾飘动
    for (const m of mistPlanes){
      m.position.x += m.userData.speed * dt * 3;
      if (m.position.x > 80) m.position.x = -80;
    }

    // 花瓣飘落
    for (const p of fallPetals){
      const ud = p.userData;
      p.position.y += ud.vy * dt;
      p.position.x += (ud.vx + Math.sin(animTime * 1.2 + ud.phase) * 0.15) * dt;
      p.rotation.x += ud.rotSpeed * dt;
      p.rotation.y += ud.rotSpeed * 0.7 * dt;
      if (p.position.y < 0.1){
        p.position.y = 8 + Math.random() * 6;
        p.position.x = (Math.random() - 0.5) * 30;
      }
    }

    renderer.render(scene, camera);
  }
  animate();

  /* ========== 响应式 ========== */
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ========== 页面可见性 ========== */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) clock.getDelta();
  });

  /* ========== WebGL context lost ========== */
  renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    fail('WebGL 上下文丢失，请刷新页面重新加载场景。');
  }, false);

  /* ========== 移除加载遮罩 ========== */
  setTimeout(() => veil.classList.add('hide'), 600);
}
</script>
</body>
</html>
