<style>

<script type="module">
const CDN = [
  'https://lib.baomitu.com/three.js/0.160.0/three.module.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
];
const veil = document.getElementById('veil');
const errEl = document.getElementById('notice');
function fail(msg){ errEl.className = 'show'; errEl.textContent = msg; veil.classList.add('hide'); }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
(async () => {
  let THREE = null;
  for (const url of CDN){
    try { THREE = await withTimeout(import(url), 10000); break; } catch (e) { /* 换下一个镜像 */ }
  }
  if (!THREE){ fail('未能载入三维引擎（baomitu / bootcdn / jsdelivr 均不可用），请检查网络后刷新。'); return; }
  try { boot(THREE); } catch (e){ console.error(e); fail('场景初始化失败：' + (e && e.message ? e.message : '未知错误')); }
})();

function boot(THREE){
  const DEG = Math.PI/180;
  const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
  const lerp = (a,b,t)=>a+(b-a)*t;
  const smooth = (e0,e1,x)=>{ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
  const hash1 = n => { const s = Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); };
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  const rnd = mulberry32(20251031);
  const uTime = { value: 0 };

  /* ================= 渲染器 ================= */
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  } catch (e) {
    fail('此浏览器未提供可用的 WebGL 上下文，无法运行本场景。'); return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.03;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = true;
  renderer.debug.onShaderError = function(gl, program, vs, fs){
    console.error('Shader error', gl.getProgramInfoLog(program), gl.getShaderInfoLog(vs), gl.getShaderInfoLog(fs));
    fail('着色器编译失败，可能是显卡驱动不支持该效果。');
  };
  document.getElementById('stage').appendChild(renderer.domElement);
  renderer.domElement.addEventListener('webglcontextlost', (e)=>{ e.preventDefault(); fail('WebGL 上下文丢失，请刷新页面。'); });

  const scene = new THREE.Scene();
  const FOG = new THREE.Color(0xe0cbA4);
  scene.fog = new THREE.FogExp2(FOG.getHex(), 0.0022);
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 6000);

  /* ================= 光 ================= */
  const SUN = new THREE.Vector3(-0.80, 0.19, 0.57).normalize();   /* 西南方向低斜的傍晚阳光 */
  scene.add(new THREE.HemisphereLight(0xbcd2e2, 0x73624a, 1.20));
  const sun = new THREE.DirectionalLight(0xffd9a2, 2.8);
  sun.position.copy(SUN).multiplyScalar(90);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -26; sun.shadow.camera.right = 26;
  sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
  sun.shadow.camera.near = 20; sun.shadow.camera.far = 190;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.035;
  sun.shadow.camera.updateProjectionMatrix();
  sun.target.position.set(0.5, 0, -3);
  scene.add(sun); scene.add(sun.target);
  scene.add(new THREE.AmbientLight(0xd9c8a8, 0.22));

  /* ================= 天空 ================= */
  const skyU = {
    uSun:{value:SUN}, uTime,
    uZenith:{value:new THREE.Color(0x5d7ea8)},
    uMid:{value:new THREE.Color(0x9db3c3)},
    uLow:{value:new THREE.Color(0xdccfb6)},
    uHorizon:{value:new THREE.Color(0xf2dcb8)},
    uGlow:{value:new THREE.Color(0xffc98d)}
  };
  const skyMat = new THREE.ShaderMaterial({
    uniforms: skyU,
    vertexShader:`varying vec3 vDir;
      void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vDir = wp.xyz - cameraPosition; gl_Position = projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`precision highp float;
      uniform vec3 uSun, uZenith, uMid, uLow, uHorizon, uGlow;
      uniform float uTime;
      varying vec3 vDir;
      float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
      float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
        return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
      float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<2;i++){ s+=a*vn(p); p*=2.07; a*=0.5; } return s; }
      void main(){
        vec3 d = normalize(vDir);
        float h = max(d.y, 0.0);
        vec3 c = mix(uHorizon, uLow, smoothstep(0.0, 0.055, h));
        c = mix(c, uMid, smoothstep(0.045, 0.24, h));
        c = mix(c, uZenith, smoothstep(0.20, 0.70, h));
        float sd = max(dot(d, uSun), 0.0);
        c += uGlow * pow(sd, 6.0) * 0.34 * exp(-h*2.6);
        c += uGlow * pow(sd, 2600.0) * 1.8;
        float n = fbm(d.xz/(h+0.55)*0.85 + vec2(uTime*0.0042, uTime*0.0015));
        float cl = smoothstep(0.50, 0.86, n) * smoothstep(0.03, 0.34, h);
        c = mix(c, mix(vec3(0.90,0.85,0.79), uGlow*1.02, pow(sd,3.0)), cl*0.34);
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    side: THREE.BackSide, depthWrite:false, depthTest:true
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 40, 24), skyMat);
  sky.frustumCulled = false; sky.renderOrder = 999; sky.name='sky';
  scene.add(sky);

  /* ================= 地形 ================= */
  function terrainH(x, z){
    let h = 0;
    h += Math.sin(x*0.0135 + 1.7)*1.25;
    h += Math.sin(z*0.0112 - 0.6)*1.45;
    h += Math.sin((x*0.62 + z*0.78)*0.0215)*0.80;
    h += Math.sin((x*0.31 - z*0.95)*0.0470)*0.24;
    h += 26*smooth(140, 640, z);
    h -= 1.6*smooth(24, -34, z);
    return h;
  }
  const GW = 1200, GS = 170;
  const gGeo = new THREE.PlaneGeometry(GW, GW, GS, GS);
  gGeo.rotateX(-Math.PI/2);
  {
    const p = gGeo.attributes.position, n = p.count;
    const col = new Float32Array(n*3);
    const cGrass = new THREE.Color(0x8f9a5c), cDry = new THREE.Color(0xc9b583), cEarth = new THREE.Color(0x8a7150);
    for (let i=0;i<n;i++){
      const x = p.getX(i), z = p.getZ(i);
      p.setY(i, terrainH(x, z));
      const v = 0.5 + 0.5*Math.sin(x*0.043 + Math.cos(z*0.037)*2.3) * Math.sin(z*0.051 + 0.8);
      const v2 = 0.5 + 0.5*Math.sin(x*0.118 + 1.7) * Math.sin(z*0.096 - 0.4);
      const c = cGrass.clone().lerp(cDry, clamp(v*0.72 + v2*0.52, 0, 1));
      const dh = Math.hypot(x + 1.4, z - 0.5);
      const near = 1 - smooth(3.0, 11.0, dh);
      c.lerp(cEarth, near*0.55);
      col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    }
    gGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    gGeo.computeVertexNormals();
  }

  /* ================= 程序化纹理 ================= */
  function cvTex(w, h, draw, repeat){
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  }
  const groundTex = cvTex(512, 512, (g,W,H)=>{
    g.fillStyle = '#c3bea1'; g.fillRect(0,0,W,H);
    for (let i=0;i<2400;i++){
      const x=rnd()*W, y=rnd()*H, r=1+rnd()*8, v=rnd();
      g.fillStyle = v<0.55 ? `rgba(118,128,80,${0.09+rnd()*0.24})` : `rgba(160,140,96,${0.08+rnd()*0.22})`;
      g.beginPath(); g.ellipse(x,y,r*1.7,r*0.85,rnd()*3.14,0,6.2832); g.fill();
    }
    for (let i=0;i<1500;i++){
      const x=rnd()*W, y=rnd()*H;
      g.strokeStyle = `rgba(${(178+rnd()*44)|0},${(160+rnd()*38)|0},${(98+rnd()*34)|0},${0.10+rnd()*0.26})`;
      g.lineWidth = 0.6+rnd()*1.1;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+(rnd()-0.5)*7, y-(2+rnd()*7)); g.stroke();
    }
  }, true);
  groundTex.repeat.set(34, 34);

  const pathTex = cvTex(256, 256, (g,W,H)=>{
    g.fillStyle = '#9b8465'; g.fillRect(0,0,W,H);
    for (let i=0;i<1400;i++){
      const x=rnd()*W, y=rnd()*H, r=0.7+rnd()*3.4, v=118+rnd()*84;
      g.fillStyle = `rgba(${v|0},${(v*0.87)|0},${(v*0.67)|0},${0.12+rnd()*0.34})`;
      g.beginPath(); g.ellipse(x,y,r*1.5,r,rnd()*3.14,0,6.2832); g.fill();
    }
  }, true);

  const thatchTex = cvTex(256, 256, (g,W,H)=>{
    g.fillStyle = '#87703f'; g.fillRect(0,0,W,H);
    for (let i=0;i<2200;i++){
      const x=rnd()*W, y=rnd()*H, l=6+rnd()*22, v=0.55+rnd()*0.8;
      g.strokeStyle = `rgba(${(188*v)|0},${(158*v)|0},${(94*v)|0},${0.16+rnd()*0.42})`;
      g.lineWidth = 0.6+rnd()*1.5;
      g.beginPath(); g.moveTo(x,y); g.lineTo(x+(rnd()-0.5)*4, y+l); g.stroke();
    }
    for (let i=0;i<34;i++){
      const y=rnd()*H;
      g.strokeStyle = `rgba(88,68,40,${0.14+rnd()*0.20})`; g.lineWidth = 1.3+rnd()*1.4;
      g.beginPath(); g.moveTo(0,y); g.bezierCurveTo(W*0.3,y+3, W*0.7,y-3, W,y+1); g.stroke();
    }
  }, true);

  const wallTex = cvTex(256, 256, (g,W,H)=>{
    g.fillStyle = '#b7aa8b'; g.fillRect(0,0,W,H);
    for (let i=0;i<900;i++){
      const x=rnd()*W, y=rnd()*H, r=2+rnd()*9;
      g.fillStyle = `rgba(${(158+rnd()*52)|0},${(146+rnd()*44)|0},${(116+rnd()*40)|0},${0.05+rnd()*0.15})`;
      g.beginPath(); g.ellipse(x,y,r*1.4,r,0,0,6.2832); g.fill();
    }
    const grd = g.createLinearGradient(0,H,0,H*0.60);
    grd.addColorStop(0,'rgba(84,72,52,0.45)'); grd.addColorStop(1,'rgba(84,72,52,0)');
    g.fillStyle = grd; g.fillRect(0, H*0.60, W, H*0.40);
  }, true);

  const mistTex = cvTex(512, 256, (g,W,H)=>{
    g.clearRect(0,0,W,H);
    for (let i=0;i<140;i++){
      const x=rnd()*W, y=H*0.5+(rnd()-0.5)*H*0.95, r=20+rnd()*76;
      const grd = g.createRadialGradient(x,y,0,x,y,r);
      grd.addColorStop(0, `rgba(255,250,238,${0.05+rnd()*0.13})`);
      grd.addColorStop(1, 'rgba(255,250,238,0)');
      g.fillStyle = grd; g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill();
    }
    g.globalCompositeOperation = 'destination-in';
    const gy = g.createLinearGradient(0,0,0,H);
    gy.addColorStop(0,'rgba(0,0,0,0)'); gy.addColorStop(0.24,'rgba(0,0,0,0.9)');
    gy.addColorStop(0.76,'rgba(0,0,0,0.9)'); gy.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = gy; g.fillRect(0,0,W,H);
    const gx = g.createLinearGradient(0,0,W,0);
    gx.addColorStop(0,'rgba(0,0,0,0)'); gx.addColorStop(0.17,'rgba(0,0,0,0.92)');
    gx.addColorStop(0.83,'rgba(0,0,0,0.92)'); gx.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = gx; g.fillRect(0,0,W,H);
    g.globalCompositeOperation = 'source-over';
  }, true);

  /* ================= 合并几何工具 ================= */
  function tint(geo, color){
    const c = new THREE.Color(color), n = geo.attributes.position.count;
    const arr = new Float32Array(n*3);
    for (let i=0;i<n;i++){ arr[i*3]=c.r; arr[i*3+1]=c.g; arr[i*3+2]=c.b; }
    geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    return geo;
  }
  /* 把已有顶点色向目标色插值，用来做不同花色的菊 */
  function tintTo(geo, color, amt){
    const c = new THREE.Color(color), arr = geo.attributes.color.array;
    for (let i=0;i<arr.length;i+=3){
      arr[i]   = lerp(arr[i],   c.r, amt);
      arr[i+1] = lerp(arr[i+1], c.g, amt);
      arr[i+2] = lerp(arr[i+2], c.b, amt);
    }
    geo.attributes.color.needsUpdate = true;
    return geo;
  }
  function mergeGeoms(geoms, extras){
    extras = extras || [];
    const names = ['position','normal','color','aSway'].concat(extras);
    const prep = geoms.map(g=>{
      const ng = g.index ? g.toNonIndexed() : g;
      if (!ng.attributes.normal) ng.computeVertexNormals();

  /* 程序化枝叶贴图：递归枝干 + 散点叶片，避免低模树的棒棒糖感 */
  function treeTexture(seed, palette){
    const S = 256;
    const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
    const g = cv.getContext('2d');
    const r2 = mulberry32(seed);
    g.clearRect(0,0,S,S);
    const tips = [];
    (function branch(x, y, ang, len, w, depth){
      const x2 = x + Math.cos(ang)*len, y2 = y - Math.sin(ang)*len;
      g.strokeStyle = `rgb(${(78+depth*7)|0},${(60+depth*6)|0},${(43+depth*4)|0})`;
      g.lineWidth = w; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x,y); g.lineTo(x2,y2); g.stroke();
      if (depth <= 0 || len < 6){ tips.push([x2,y2]); return; }
      const n = depth > 2 ? 2 : (r2() < 0.55 ? 3 : 2);
      for (let i=0;i<n;i++){
        const a = ang + (r2()-0.5)*0.95 + (i - (n-1)/2)*0.46;
        branch(x2, y2, a, len*(0.64+r2()*0.20), Math.max(0.8, w*0.60), depth-1);
      }
    })(S/2 + (r2()-0.5)*8, S-3, Math.PI/2 + (r2()-0.5)*0.14, S*0.29, 8, 4);
    for (const [tx,ty] of tips){
      const c = palette[Math.floor(r2()*palette.length)];
      const n = 20 + Math.floor(r2()*22);
      for (let k=0;k<n;k++){
        const a = r2()*6.283, rad = 2 + r2()*17;
        const x = tx + Math.cos(a)*rad, y = ty + Math.sin(a)*rad;
        if (x < 3 || x > S-3 || y < 3 || y > S-3) continue;
        const v = 0.70 + r2()*0.5;
        g.fillStyle = `rgba(${(c[0]*v)|0},${(c[1]*v)|0},${(c[2]*v)|0},${0.70+r2()*0.30})`;
        g.beginPath(); g.ellipse(x, y, 2.4+r2()*3.2, 1.9+r2()*2.4, r2()*3.14, 0, 6.283); g.fill();
      }
    }
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  }

  function ridgeMesh(z, amp, base, color, seed, span, cols, rough){
    const pos = [], col = [], idx = [];
    const c = new THREE.Color(color);
    const cTop = c.clone().lerp(new THREE.Color(0xf0d7ac), 0.34);
    const cBot = c.clone().lerp(new THREE.Color(0xa9b7c3), 0.58);
    let prevY = 0;
    for (let i=0;i<=cols;i++){
      const t = i/cols;
      const x = -span + span*2*t;
      let h = 0.50*Math.abs(Math.sin(x*0.00165 + seed))
            + 0.27*Math.abs(Math.sin(x*0.00395 + seed*2.1))
            + 0.15*Math.abs(Math.sin(x*0.00910 + seed*3.3))
            + 0.09*Math.abs(Math.sin(x*0.01980 + seed*4.7))
            + 0.05*Math.abs(Math.sin(x*0.04210 + seed*5.9))
            + 0.03*Math.abs(Math.sin(x*0.08130 + seed*7.1));
      h = Math.pow(h, 1.26);
      h += 0.62*Math.exp(-Math.pow((x + 42)/280, 2));
      h += 0.24*Math.exp(-Math.pow((x - 260)/190, 2));
      let y = base + amp*h;
      y += hash1(i*3.7 + seed)*rough;
      const lit = clamp(-(y - prevY)/(amp*0.055), 0, 1);
      const cc = c.clone().lerp(cTop, 0.22 + lit*0.78);
      pos.push(x, y, z);        col.push(cc.r, cc.g, cc.b);
      pos.push(x, base-260, z); col.push(cBot.r, cBot.g, cBot.b);
      prevY = y;
    }
    for (let i=0;i<cols;i++){
      const a = i*2, b = (i+1)*2;
      idx.push(a, a+1, b, b, b+1, a+1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
    g.setIndex(idx);
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.DoubleSide }));
    m.renderOrder = -50;
    return m;
  }

    if (tween){
      const k = clamp((performance.now() - tween.t0)/tween.dur, 0, 1);
      const e = k<0.5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2;
      cam.pos.lerpVectors(tween.p0, tween.p1, e);
      cam.look.lerpVectors(tween.l0, tween.l1, e);
      if (k >= 1) tween = null;
    }
    cam.yaw = lerp(cam.yaw, cam.tYaw, 0.06);
    cam.pitch = lerp(cam.pitch, cam.tPitch, 0.06);
    cam.dolly = lerp(cam.dolly, cam.tDolly, 0.08);
    cam.px = lerp(cam.px, cam.tpx, 0.05);
    cam.py = lerp(cam.py, cam.tpy, 0.05);
    const dir = new THREE.Vector3().subVectors(cam.look, cam.pos);
    const dist = dir.length();
    dir.normalize();
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(cam.pitch + Math.sin(t*0.055)*0.006, cam.yaw, 0, 'YXZ'));
    dir.applyQuaternion(q);
    const pos = cam.pos.clone().addScaledVector(dir, cam.dolly);
    pos.x += cam.px; pos.y += cam.py;
    camera.position.copy(pos);
    camera.lookAt(pos.clone().addScaledVector(dir, dist));
  }
  window.addEventListener('pointermove', (e)=>{
    cam.tpx = (e.clientX/window.innerWidth - 0.5)*0.30;
    cam.tpy = -(e.clientY/window.innerHeight - 0.5)*0.18;
  }, { passive:true });

  /* ================= 尺寸与画质 ================= */
  const QUALITY = [
    { name:'高', dpr:1.75, shadow:2048, grass:1.0, petal:1.0, mist:6 },
    { name:'标准', dpr:1.35, shadow:1024, grass:0.62, petal:0.65, mist:4 },
    { name:'省电', dpr:1.0, shadow:512, grass:0.32, petal:0.35, mist:2 }
  ];
  const isSmall = Math.min(window.innerWidth, window.innerHeight) < 700 || (navigator.maxTouchPoints||0) > 1;
  let qi = isSmall ? 1 : 0;
  const btnQuality = document.getElementById('btnQuality');
  const btnPause = document.getElementById('btnPause');
  let paused = false;

  function applyFov(){
    const aspect = window.innerWidth/window.innerHeight;
    const hFov = 2*Math.atan(Math.tan(42*DEG*0.5)*(16/9));
    let fov = 2*Math.atan(Math.tan(hFov*0.5)/aspect)/DEG;
    fov = clamp(fov, 40, aspect < 0.85 ? 72 : 64);
    camera.fov = fov; camera.aspect = aspect; camera.updateProjectionMatrix();
  }
  function applyQuality(){
    const q = QUALITY[qi];
    btnQuality.textContent = '画质：' + q.name;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, q.dpr));
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (sun.shadow.mapSize.x !== q.shadow){
      sun.shadow.mapSize.set(q.shadow, q.shadow);
      if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
      renderer.shadowMap.needsUpdate = true;
    }
    const gv = grassMesh.geometry.attributes.position.count;
    grassMesh.geometry.setDrawRange(0, Math.floor(gv*q.grass));
    petalGeo2.setDrawRange(0, Math.floor(PETAL_N*q.petal));
    for (let i=0;i<mistPlanes.length;i++) mistPlanes[i].visible = i < q.mist;
    petalMat.uniforms.uPR.value = renderer.getPixelRatio();
  }
  function onResize(){
    applyFov();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, QUALITY[qi].dpr));
    renderer.setSize(window.innerWidth, window.innerHeight);
    petalMat.uniforms.uPR.value = renderer.getPixelRatio();
  }
  window.addEventListener('resize', onResize);
  btnQuality.addEventListener('click', ()=>{ qi = (qi+1) % QUALITY.length; applyQuality(); });
  btnPause.addEventListener('click', ()=>{ paused = !paused; btnPause.textContent = paused ? '继续' : '暂停'; });

  /* ================= 主循环 ================= */
  const clock = new THREE.Clock();
  const fpsEl = document.getElementById('fps');
  let firstFrame = true, fpsAcc = 0, fpsN = 0, simT = 0, hidden = false;
  document.addEventListener('visibilitychange', ()=>{ hidden = document.hidden; if (!hidden) clock.getDelta(); });

  function tick(){
    requestAnimationFrame(tick);
    if (hidden) return;
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!paused) simT += dt;
    const t = simT;
    uTime.value = t;

    updateCamera(t);
    sky.position.copy(camera.position);
    skyU.uTime.value = t;

    for (const m of mistPlanes){
      m.position.x += m.userData.speed*dt*10;
      if (m.position.x > 60) m.position.x = -60;
      const tex = m.material.map;
      tex.offset.x += m.userData.speed*dt*6;
      tex.offset.y += m.userData.speed*dt*1.4;
    }

    for (const b of birds){
      const u = (t*b.sp + b.off) % 1;
      const x = 78 - u*250 + b.lat;
      const y = 46 - u*17 + Math.sin(t*0.55 + b.bob)*2.6 + b.alt*0.5;
      const z = 62 + Math.sin(u*2.6 + b.off*6.283)*30 + b.lat*0.8;
      b.mesh.position.set(x, y, z);
      b.mesh.rotation.set(Math.sin(t*0.5+b.bob)*0.10, Math.PI - 0.22, Math.sin(t*0.42+b.bob)*0.14);
    }

    renderer.render(scene, camera);

    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5){ fpsEl.textContent = Math.round(fpsN/fpsAcc) + ' FPS'; fpsAcc = 0; fpsN = 0; }

    if (firstFrame){ firstFrame = false; veil.classList.add('hide'); setTimeout(()=>{ veil.style.display = 'none'; }, 2200); }
  }

  applyFov();
  applyQuality();
  tick();
}
</script>
