<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#04060d;color:#e8e3d5;font-family:"Songti SC","STSong","Noto Serif SC",serif;-webkit-tap-highlight-color:transparent}

}
@media(max-width:520px){ h1{font-size:25px} blockquote{font-size:12.5px} #btnReset{display:none} #bar .btn{padding:7px 9px;font-size:9.5px;letter-spacing:.02em} }
@media(prefers-reduced-motion:reduce){ #hud{animation:none} #veil .t{animation:none} }

<script>if(window.self!==window.top)document.documentElement.classList.add("embed");
if (matchMedia("(pointer: coarse)").matches){
  var nt = document.querySelector(".note");
  if (nt) nt.innerHTML = "拖动环视　双指缩放　<b>点星辰，可摘一颗</b>";

</script>
<script type="module">
const CDN = [
  'https://lib.baomitu.com/three.js/0.160.0/three.module.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
];
const veil = document.getElementById('veil');
const errEl = document.getElementById('notice');
function fail(msg){ errEl.className = 'show'; errEl.textContent = msg; veil.classList.add('hide'); }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
(async () => {
  let THREE = null;
  for (const url of CDN){
    try { THREE = await withTimeout(import(url), 10000); break; } catch (e) { /* 首个镜像不通就换下一个 */ }
  }
  if (!THREE){ fail('未能载入三维引擎（baomitu / bootcdn / jsdelivr 均不可用），请检查网络后刷新。'); return; }
  try { boot(THREE); }
  catch (e){ console.error(e); fail('场景初始化失败：' + (e && e.message ? e.message : '未知错误')); }
})();

const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* 周期值噪声，保证贴图平铺无缝 */
function makeNoise(seed, period){
  const rnd = mulberry32(seed);
  const tab = new Float32Array(period * period);
  for (let i = 0; i < tab.length; i++) tab[i] = rnd();
  const at = (x, y) => tab[((y % period) + period) % period * period + (((x % period) + period) % period)];
  const sm = t => t * t * (3 - 2 * t);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = sm(x - xi), yf = sm(y - yi);
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return lerp(lerp(a, b, xf), lerp(c, d, xf), yf);
  };
}
function fbm(nf, x, y, oct, gain){
  let amp = 1, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++){ sum += amp * nf(x * f, y * f); norm += amp; amp *= gain; f *= 2; }
  return sum / norm;
}

function boot(THREE){
  const rnd = mulberry32(20261102);
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const state = {
    quality: isMobile ? 1 : 2,   // 0 低 / 1 标准 / 2 高
    paused: false, t: 0, picked: 0
  };

  // canvas 预置在 DOM 里：展厅 iframe 会检查它的存在；被移走时自建并补回，别让渲染器拿到 null
  let canvas = document.getElementById('gl');
  if (!canvas){
    canvas = document.createElement('canvas');
    canvas.id = 'gl';
    document.getElementById('stage')?.appendChild(canvas);
  }
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', stencil: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.18;
  renderer.shadowMap.enabled = !isMobile;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.setAttribute('aria-label', '夜宿山寺三维诗境：山巅楼阁与星空');

  canvas.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    state.paused = true;
    fail('图形上下文丢失（显卡或内存受限）。请刷新页面重试。');
  });
  canvas.addEventListener('webglcontextrestored', () => { errEl.className = ''; location.reload(); });

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 40000);

  /* ══════════ 天空：渐变 + 银河带 ══════════ */
  const SKY_R = 18000;
  const starRoot = new THREE.Group();          // 绕极轴转动的天球
  const starSpin = new THREE.Group();
  scene.add(starRoot);
  starRoot.add(starSpin);
  starRoot.rotation.x = -60 * DEG;             // 北极星仰角约 30°

  const GALACTIC = new THREE.Vector3(0.42, 0.5, -0.76).normalize();

  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, depthTest: false,
    uniforms: {
      uZenith:  { value: new THREE.Color('#050b18') },
      uHorizon: { value: new THREE.Color('#1b3049') },
      uGround:  { value: new THREE.Color('#080d16') },
      uGalactic:{ value: GALACTIC.clone() },
      uGlow:    { value: 1.0 }
    },
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 uZenith, uHorizon, uGround, uGalactic;
      uniform float uGlow;
      void main(){
        vec3 d = normalize(vDir);
        float up = d.y;
        vec3 col = mix(uHorizon, uZenith, pow(clamp(up, 0.0, 1.0), 0.55));
        col = mix(col, uGround, smoothstep(0.0, -0.22, up));
        // 银河：沿大圆的辉光带，低频起伏让它不呆板
        float g = dot(d, uGalactic);
        float band = exp(-g * g * 46.0);
        float lumps = 0.55 + 0.45 * sin(d.x * 5.7 + 1.9) * sin(d.z * 4.3 - 0.7) * sin(d.y * 6.1 + 2.6);
        band *= 0.18 + 0.82 * abs(lumps) * abs(lumps);
        // 带内暗尘
        float dust = exp(-pow(g * 5.6 + 0.055 * sin(d.x * 13.0 + d.z * 7.0), 2.0) * 4.2);
        band *= 1.0 - dust * 0.62;
        col += vec3(0.10, 0.125, 0.195) * band * uGlow * 1.85;
        // 地平线附近的云海反照
        col += vec3(0.055, 0.082, 0.115) * smoothstep(0.30, -0.06, up) * 0.72;
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(SKY_R, 48, 32), skyMat);
  sky.renderOrder = -10;
  starSpin.add(sky);

  /* ══════════ 星点 ══════════ */
  const starVS = `
    attribute float aSize;
    attribute vec3 aColor;
    attribute float aPhase;
    uniform float uTime, uPixelRatio, uScale, uTwinkle;
    varying vec3 vColor;
    varying float vTw;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      float tw = 1.0 - uTwinkle * 0.5 + uTwinkle * 0.5 * sin(uTime * 1.6 + aPhase * 6.2831);
      tw *= 0.94 + 0.06 * sin(uTime * 4.7 + aPhase * 17.0);
      vTw = tw;
      vColor = aColor;
      gl_PointSize = max(1.0, aSize * uPixelRatio * uScale);
    }`;
  const starFS = `
    varying vec3 vColor;
    varying float vTw;
    uniform float uOpacity;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float r = length(c);
      if (r > 0.5) discard;
      float a = smoothstep(0.5, 0.02, r);
      a = pow(a, 1.7);
      gl_FragColor = vec4(vColor * vTw, a * uOpacity);
    }`;

  function makeStarLayer(count, opt){
    const pos = new Float32Array(count * 3), col = new Float32Array(count * 3),
          siz = new Float32Array(count), pha = new Float32Array(count);
    const v = new THREE.Vector3(), c = new THREE.Color();
    for (let i = 0; i < count; i++){
      if (opt.band){
        // 在银河大圆附近高斯散布
        const n1 = new THREE.Vector3(0, 1, 0).cross(GALACTIC).normalize();
        const n2 = new THREE.Vector3().crossVectors(GALACTIC, n1).normalize();
        const a = rnd() * Math.PI * 2;
        const spread = (rnd() + rnd() + rnd() - 1.5) * 0.30;
        v.copy(n1).multiplyScalar(Math.cos(a)).addScaledVector(n2, Math.sin(a));
        v.addScaledVector(GALACTIC, spread).normalize();
        v.y = Math.abs(v.y) > 0.985 ? Math.sign(v.y) * 0.985 : v.y;
      } else {
        const u = rnd() * 2 - 1, a = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
        v.set(Math.cos(a) * s, u, Math.sin(a) * s);
        if (v.y < -0.16) v.y = -v.y * 0.55;   // 地平线以下少一些
        v.normalize();
      }
      pos[i * 3] = v.x * SKY_R * 0.985;
      pos[i * 3 + 1] = v.y * SKY_R * 0.985;
      pos[i * 3 + 2] = v.z * SKY_R * 0.985;
      const warm = Math.pow(rnd(), 3.2);
      c.setRGB(lerp(0.72, 1.0, rnd() * 0.5), lerp(0.80, 0.96, rnd() * 0.4), lerp(1.0, 0.78, warm));
      const b = opt.bright * (0.45 + 0.55 * Math.pow(rnd(), 1.6));
      col[i * 3] = c.r * b; col[i * 3 + 1] = c.g * b; col[i * 3 + 2] = c.b * b;
      siz[i] = opt.size[0] + rnd() * (opt.size[1] - opt.size[0]);
      pha[i] = rnd();
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
    g.setAttribute('aPhase', new THREE.BufferAttribute(pha, 1));
    const m = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() },
        uScale: { value: 1 }, uOpacity: { value: opt.opacity }, uTwinkle: { value: opt.twinkle }
      },
      vertexShader: starVS, fragmentShader: starFS,
      transparent: true, depthWrite: false, depthTest: true,
      blending: THREE.AdditiveBlending
    });
    const p = new THREE.Points(g, m);
    p.frustumCulled = false;
    p.renderOrder = -8;
    starSpin.add(p);
    return p;
  }

  const starLayers = [];
  starLayers.push(makeStarLayer(22000, { band: false, size: [1.1, 2.1], bright: 2.15, opacity: 0.95, twinkle: 0.32 }));
  starLayers.push(makeStarLayer(32000, { band: true,  size: [0.85, 1.5], bright: 1.05, opacity: 0.82, twinkle: 0.22 }));
  starLayers.push(makeStarLayer(320,   { band: false, size: [2.6, 6.4], bright: 2.7, opacity: 1.0, twinkle: 0.16 }));

  /* ══════════ 月光与环境光 ══════════ */
  const moonKey = new THREE.DirectionalLight(new THREE.Color('#c3cfe3'), 2.35);
  moonKey.position.set(34, 58, 62);
  moonKey.castShadow = true;
  moonKey.shadow.mapSize.set(1024, 1024);
  moonKey.shadow.camera.left = -20;
  moonKey.shadow.camera.right = 20;
  moonKey.shadow.camera.top = 24;
  moonKey.shadow.camera.bottom = -14;
  moonKey.shadow.camera.near = 20;
  moonKey.shadow.camera.far = 170;
  moonKey.shadow.bias = -0.0018;
  moonKey.shadow.normalBias = 0.03;
  moonKey.shadow.autoUpdate = false;   // 场景静止，阴影只需烘一次
  moonKey.shadow.needsUpdate = true;
  moonKey.target.position.set(0, 6, 0);
  scene.add(moonKey.target);
  scene.add(moonKey);

  // 背面轮廓光：勾出檐口与柱身
  const rim = new THREE.DirectionalLight(new THREE.Color('#6685c4'), 0.95);
  rim.position.set(-48, 34, -62);
  scene.add(rim);

  scene.add(new THREE.HemisphereLight(new THREE.Color('#1e3050'), new THREE.Color('#050810'), 1.15));
  const ambient = new THREE.AmbientLight(new THREE.Color('#1a2942'), 1.05);
  scene.add(ambient);

  /* ══════════ 几何合并工具 ══════════ */
  function mergeGeoms(list){
    const geos = list.map(g => (g.index ? g.toNonIndexed() : g));
    let count = 0;
    for (const g of geos) count += g.attributes.position.count;
    const pos = new Float32Array(count * 3), nor = new Float32Array(count * 3), uv = new Float32Array(count * 2);
    let o = 0;
    for (const g of geos){
      pos.set(g.attributes.position.array, o * 3);
      if (g.attributes.normal) nor.set(g.attributes.normal.array, o * 3);
      if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
      o += g.attributes.position.count;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    return out;
  }
  const box = (w, h, d, x, y, z, ry) => {
    const g = new THREE.BoxGeometry(w, h, d);
    if (ry) g.rotateY(ry);
    g.translate(x, y, z);
    return g;
  };
  const cyl = (rt, rb, h, seg, x, y, z) => {
    const g = new THREE.CylinderGeometry(rt, rb, h, seg);
    g.translate(x, y, z);
    return g;
  };

  /* ══════════ 材质 ══════════ */
  function makeTileTexture(){
    const w = 1024, h = 96, c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#43474b'; ctx.fillRect(0, 0, w, h);
    const n = 128, step = w / n;
    for (let i = 0; i < n; i++){
      const x = i * step;
      const g = ctx.createLinearGradient(x, 0, x + step, 0);
      g.addColorStop(0.00, '#24282c');
      g.addColorStop(0.16, '#33383d');
      g.addColorStop(0.42, '#40464c');
      g.addColorStop(0.70, '#2d3237');
      g.addColorStop(1.00, '#1d2125');
      ctx.fillStyle = g; ctx.fillRect(x, 0, step + 0.6, h);
    }
    const r2 = mulberry32(77);
    for (let i = 0; i < 260; i++){
      const x = r2() * w, y = r2() * h;
      ctx.fillStyle = 'rgba(20,26,34,' + (0.10 + r2() * 0.22) + ')';
      ctx.fillRect(x, y, 2 + r2() * 5, 10 + r2() * 40);
    }
    for (let i = 0; i < 40; i++){
      const x = r2() * w;
      ctx.fillStyle = 'rgba(96,108,96,' + (0.05 + r2() * 0.09) + ')';
      ctx.fillRect(x, 0, 3 + r2() * 8, h);
    }
    const t = new THREE.CanvasTexture(c);

    t.colorSpace = THREE.SRGBColorSpace;

  }
  function makeWoodTexture(){

    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#5c2318'; ctx.fillRect(0, 0, w, h);
    const r2 = mulberry32(9182);
    for (let i = 0; i < 320; i++){
      const x = r2() * w;
      ctx.strokeStyle = 'rgba(' + (26 + r2() * 34 | 0) + ',' + (12 + r2() * 18 | 0) + ',' + (10 + r2() * 16 | 0) + ',' + (0.10 + r2() * 0.30) + ')';
      ctx.lineWidth = 0.5 + r2() * 2.4;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      for (let y = 0; y <= h; y += 32) ctx.lineTo(x + Math.sin(y * 0.02 + i) * 3, y);
      ctx.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

      const i = (y * s + x) * 4;
      img.data[i] = g * 1.02; img.data[i + 1] = g * 1.0; img.data[i + 2] = g * 0.94; img.data[i + 3] = 255;
    }

  /* ══════════ 屋顶：带举折与起翘的四阿顶 ══════════ */
  // 四条边分别归一化参数：角对角、边对边，内外环才不会扭麻花
  function perim(hw, hd, t, out){
    const tt = ((t % 1) + 1) % 1;
    const seg = Math.floor(tt * 4);
    const u = tt * 4 - seg;
    if (seg === 0){ out.set(-hw + 2 * hw * u, 0, -hd); out.nx = 0; out.nz = -1; }
    else if (seg === 1){ out.set(hw, 0, -hd + 2 * hd * u); out.nx = 1; out.nz = 0; }
    else if (seg === 2){ out.set(hw - 2 * hw * u, 0, hd); out.nx = 0; out.nz = 1; }
    else { out.set(-hw, 0, hd - 2 * hd * u); out.nx = -1; out.nz = 0; }
    return out;
  }
  // 檐口抬升与外扩量：整条缓翘 + 角部急翘
  function eaveLift(t, lift){
    const cw = Math.min((t * 4) % 1, 1 - (t * 4) % 1) * 2;
    const soft = Math.pow(1 - cw, 1.5) * 0.34 + Math.pow(1 - cw, 4.2) * 0.66;
    return { y: lift * soft, grow: lift * 0.85 * Math.pow(1 - cw, 4.2) };
  }
  // 檐口厚度：一圈垂直裙边，让屋顶不再是纸片
  function eaveSkirt(w, d, lift, depth, segs){
    const N = segs * 4, hw = w / 2, hd = d / 2;
    const pos = [], uv = [], idx = [];
    const tmp = new THREE.Vector3();
    for (let c = 0; c <= N; c++){
      const t = c / N;
      perim(hw, hd, t, tmp);
      const L = eaveLift(t, lift);
      const x = tmp.x + tmp.nx * L.grow, z = tmp.z + tmp.nz * L.grow;
      pos.push(x, L.y + 0.02, z, x, L.y - depth, z);
      uv.push(t * 1.15, 1, t * 1.15, 0);
    }
    for (let c = 0; c < N; c++){
      const a = c * 2, b = a + 1, c2 = a + 2, d2 = a + 3;
      idx.push(a, b, c2, b, d2, c2);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  function hipRoof(outerW, outerD, innerW, innerD, height, lift, segs, rings){
    const half = [outerW / 2, outerD / 2];
    const iHalf = [innerW / 2, innerD / 2];

    // 到最近角点的归一化距离（0 在角，1 在边中）
    function cornerWeight(t){
      const k = (t * 4) % 1;
      return Math.min(k, 1 - k) * 2;
    }

    const N = segs * 4;
    const cols = N + 1, rows = rings + 1;
    const pos = new Float32Array(cols * rows * 3);
    const uv = new Float32Array(cols * rows * 2);
    const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();

    for (let r = 0; r < rows; r++){
      const v = r / (rings);
      const y = height * Math.pow(v, 1.30);
      const hv = Math.pow(v, 0.94);          // 水平收进略滞后，形成凹曲
      for (let c = 0; c < cols; c++){
        const t = c / N;

        let x = lerp(tmp.x, tmp2.x, hv);
        let z = lerp(tmp.z, tmp2.z, hv);
        let yy = y;
        if (r === 0){
          const L = eaveLift(t, lift);
          yy += L.y;
          x += tmp.nx * L.grow;
          z += tmp.nz * L.grow;
        }
        const i = (r * cols + c) * 3;
        pos[i] = x; pos[i + 1] = yy; pos[i + 2] = z;
        const j = (r * cols + c) * 2;
        uv[j] = t * 1.15; uv[j + 1] = v;

      idx.push(a, d, b, b, d, e);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

        const n = fbm(nf, Math.cos(a) * 3.4, Math.sin(a) * 3.4 + v * 9, 5, 0.6);
        const n2 = fbm(nf, Math.cos(a) * 11 + 5, Math.sin(a) * 11 + v * 22, 3, 0.55);
        const rr = base * (0.80 + n * 0.34 + n2 * 0.13);
        pos.push(Math.cos(a) * rr, y + (n - 0.5) * 9 + (n2 - 0.5) * 3.5, Math.sin(a) * rr);
      }
    }
    for (let r = 0; r < rows; r++) for (let c = 0; c < segs; c++){
      const a = r * segs + c, b = r * segs + (c + 1) % segs;
      const d = (r + 1) * segs + c, e = (r + 1) * segs + (c + 1) % segs;
      idx.push(a, d, b, b, d, e);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    const rock = new THREE.Mesh(g, matRock);
    rock.position.y = 0.4;
    rock.receiveShadow = true;
    scene.add(rock);

    const lpos = [], luv = [], lidx = [];
    const nf2 = makeNoise(8811, 16);
    lpos.push(0, 0.6, 0); luv.push(0.5, 0.5);
    for (let c = 0; c <= lsegs; c++){
      const a = (c % lsegs) / lsegs * Math.PI * 2;
      const n = fbm(nf2, Math.cos(a) * 3, Math.sin(a) * 3, 3, 0.55);
      const rr = lr * (0.94 + n * 0.16);
      lpos.push(Math.cos(a) * rr, 0.55 + (n - 0.5) * 0.5, Math.sin(a) * rr);
      luv.push(0.5 + Math.cos(a) * 0.5, 0.5 + Math.sin(a) * 0.5);
      if (c < lsegs) lidx.push(0, c + 2, c + 1);
    }
    // 台沿垂面：逐段独立四点，首尾各复制一段以保证闭合
    for (let c = 0; c <= lsegs; c++){
      const a = (c % lsegs) / lsegs * Math.PI * 2;
      const n = fbm(nf2, Math.cos(a) * 3, Math.sin(a) * 3, 3, 0.55);
      const rr = lr * (0.94 + n * 0.16);
      const x = Math.cos(a) * rr, z = Math.sin(a) * rr;
      lpos.push(x, 0.55 + (n - 0.5) * 0.5, z, x, -2.6, z);
      luv.push(0.5 + Math.cos(a) * 0.5, 1, 0.5 + Math.cos(a) * 0.5, 0);

    const lstart = lsegs + 2;
    for (let c = 0; c < lsegs; c++){

      lidx.push(a, d, b, b, d, e);
    }
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.Float32BufferAttribute(lpos, 3));
    lg.setAttribute('uv', new THREE.Float32BufferAttribute(luv, 2));

  /* ══════════ 云海 ══════════ */
  function makeCloudTexture(seed, scale, oct){
    const s = 512, c = document.createElement('canvas');
    c.width = c.height = s;
    const ctx = c.getContext('2d');
    const nf = makeNoise(seed, 32);
    const img = ctx.createImageData(s, s);
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++){
      const u = x / s * scale, v = y / s * scale;
      // 域扭曲，让云团不那么规则
      const wx = fbm(nf, u + 3.1, v + 1.7, 3, 0.5) * 1.4;
      const wy = fbm(nf, u + 8.3, v + 5.2, 3, 0.5) * 1.4;
      let n = fbm(nf, u + wx, v + wy, oct, 0.56);
      n = Math.pow(clamp((n - 0.32) / 0.40, 0, 1), 1.0);
      const i = (y * s + x) * 4;
      img.data[i] = n * 255; img.data[i + 1] = n * 255; img.data[i + 2] = n * 255; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }

  function buildCloudSea(){
    const count = state.quality === 0 ? 3 : 6;
    for (let i = 0; i < count; i++){
      const isThin = i % 2 === 0;
      const y = -120 + i * 9;
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        uniforms: {
          uTex: { value: cloudTextures[i % 2] },
          uTime: { value: 0 },
          uSpeed: { value: new THREE.Vector2(0.0016 + i * 0.0007, 0.0009 - i * 0.0003) },
          uScale: { value: 30.0 + i * 7.5 },
          uColorTop: { value: new THREE.Color(isThin ? '#7d93b3' : '#61789c') },
          uColorBot: { value: new THREE.Color(isThin ? '#243a56' : '#16263e') },
          uOpacity: { value: isThin ? 0.40 : 0.66 },
          uFade: { value: 3600.0 }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vWorld;
          void main(){
            vUv = uv;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorld = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }`,
        fragmentShader: `
          varying vec2 vUv;
          varying vec3 vWorld;
          uniform sampler2D uTex;
          uniform float uTime, uScale, uOpacity, uFade;
          uniform vec2 uSpeed;
          uniform vec3 uColorTop, uColorBot;
          void main(){
            float vDist = length(vWorld.xz - cameraPosition.xz);
            vec2 uv1 = vUv * uScale + uSpeed * uTime;
            vec2 uv2 = vUv * uScale * 1.63 - uSpeed * uTime * 0.78 + vec2(0.37, 0.61);
            float a1 = texture2D(uTex, uv1).r;
            float a2 = texture2D(uTex, uv2).r;
            float a = a1 * 0.68 + a2 * 0.52;
            a = smoothstep(0.16, 0.64, a);
            // 远处淡出，避免看到平面边缘
            float far = 1.0 - smoothstep(uFade * 0.55, uFade, vDist);
            float near = smoothstep(300.0, 900.0, vDist);
            a *= far * near * uOpacity;
            if (a < 0.004) discard;
            // 近处暗、远处被月光照亮的银白
            float lit = smoothstep(260.0, 1700.0, vDist);
            vec3 col = mix(uColorBot, uColorTop, clamp(a * 0.55 + lit * 0.72, 0.0, 1.0));
            col *= 0.34 + 0.86 * a1;
            gl_FragColor = vec4(col, a);
          }`
      });

  function makeRidgeTexture(seed, sharp){
    const n = 512;
    const nf = makeNoise(seed, 64);
    const raw = new Float32Array(n);
    let mx = 0.0001;
    for (let i = 0; i < n; i++){
      const x = i / n;
      const h = Math.pow(clamp(fbm(nf, x * 5.4, 0.5, 4, 0.52), 0, 1), sharp);
      raw[i] = h;
      if (h > mx) mx = h;
    }
    const data = new Uint8Array(n * 4);
    for (let i = 0; i < n; i++){
      const h = 0.30 + (raw[i] / mx) * 0.62;
      data[i * 4] = h * 255; data[i * 4 + 1] = h * 255; data[i * 4 + 2] = h * 255; data[i * 4 + 3] = 255;
    }
    const t = new THREE.DataTexture(data, n, 1, THREE.RGBAFormat);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestFilter;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    t.needsUpdate = true;
    return t;
  }
  function ridgeMaterial(color, seed, sharp, alpha){
    return new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: {
        uColor: { value: new THREE.Color(color) },
        uAlpha: { value: alpha },
        uHeights: { value: makeRidgeTexture(seed, sharp) }
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        varying vec2 vUv;
        uniform vec3 uColor; uniform float uAlpha; uniform sampler2D uHeights;
        void main(){
          float h = texture2D(uHeights, vec2(clamp(vUv.x, 0.0015, 0.9985), 0.5)).r;
          float y = vUv.y;
          if (y > h) discard;
          float depth = smoothstep(h, h - 0.38, y);
          float haze = mix(0.42, 1.0, smoothstep(0.0, 0.9, y / max(h, 0.001)));
          gl_FragColor = vec4(uColor * haze, uAlpha * depth);
        }`
    });
  }
  function addRidge(dist, width, height, y, color, seed, sharp, alpha){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(width, height, 1, 1), ridgeMaterial(color, seed, sharp, alpha));
    m.position.set(0, y + height / 2, -dist);
    m.renderOrder = 3;
    scene.add(m);
    return m;
  }

  const starSpriteTex = (() => {
    const s = 256, c = document.createElement('canvas');
    c.width = c.height = s;
    const ctx = c.getContext('2d');
    ctx.translate(s / 2, s / 2);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.06, 'rgba(255,252,244,0.94)');
    g.addColorStop(0.18, 'rgba(206,224,255,0.34)');
    g.addColorStop(0.42, 'rgba(150,180,255,0.10)');
    g.addColorStop(1, 'rgba(120,150,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, s / 2, 0, 6.2832); ctx.fill();
    // 十字星芒
    ctx.globalCompositeOperation = 'lighter';
    for (const [len, wid, op] of [[0.98, 0.016, 0.55], [0.62, 0.010, 0.75]]){
      const grd = ctx.createLinearGradient(0, 0, s * len / 2, 0);
      grd.addColorStop(0, 'rgba(190,215,255,' + op + ')');
      grd.addColorStop(1, 'rgba(190,215,255,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, -s * wid / 2, s * len / 2, s * wid);
      ctx.save(); ctx.rotate(Math.PI); ctx.fillRect(0, -s * wid / 2, s * len / 2, s * wid); ctx.restore();
      ctx.save(); ctx.rotate(Math.PI / 2);
      ctx.fillStyle = grd; ctx.fillRect(0, -s * wid / 2, s * len / 2 * 0.78, s * wid);
      ctx.rotate(Math.PI); ctx.fillRect(0, -s * wid / 2, s * len / 2 * 0.78, s * wid);
      ctx.restore();
    }
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();

  const VIEWS = {
    stars: { target: new THREE.Vector3(-5.2, 9.0, 0), radius: 30.5, theta: 0.52, phi: 0.085 },
    sea:   { target: new THREE.Vector3(0, 2.0, 0), radius: 112, theta: 0.72, phi: 0.20 },

  };
  const VIEW_ORDER = ['stars', 'sea', 'tower'];
  const VIEW_NAME = { stars: '临星', sea: '望海', tower: '望楼' };
  const cam = {
    target: VIEWS.stars.target.clone(),
    radius: VIEWS.stars.radius * portraitFit(),
    theta: VIEWS.stars.theta,
    phi: VIEWS.stars.phi,
    tTarget: VIEWS.stars.target.clone(),
    tRadius: VIEWS.stars.radius * portraitFit(),
    tTheta: VIEWS.stars.theta,
    tPhi: VIEWS.stars.phi,
    view: 'stars'
  };
  const LIM = { phiMin: -0.42, phiMax: 0.72, radiusMin: 13, radiusMax: 78 };

  function applyCamera(){
    const cp = Math.cos(cam.phi), sp = Math.sin(cam.phi);
    camera.position.set(
      cam.target.x + cam.radius * Math.sin(cam.theta) * cp,
      cam.target.y + cam.radius * sp,
      cam.target.z + cam.radius * Math.cos(cam.theta) * cp
    );
    if (camera.position.y < 2.2) camera.position.y = 2.2;
    camera.lookAt(cam.target);
  }
  applyCamera();

  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, t: cam.theta, p: cam.phi, moved: 0 };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
    cam.tTheta = drag.t - dx * 0.0042;
    cam.tPhi = clamp(drag.p - dy * 0.0032, LIM.phiMin, LIM.phiMax);
  });
  const endDrag = e => {
    if (drag && drag.moved < 6) tryPick(e);
    drag = null;
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', () => { drag = null; });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    cam.tRadius = clamp(cam.tRadius * (1 + Math.sign(e.deltaY) * 0.075), LIM.radiusMin, LIM.radiusMax);
  }, { passive: false });

  let pinch = null;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 2){
      pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinch){
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      cam.tRadius = clamp(cam.tRadius * (pinch / Math.max(d, 1)), LIM.radiusMin, LIM.radiusMax);
      pinch = d;
    }
  }, { passive: true });
  canvas.addEventListener('touchend', () => { pinch = null; }, { passive: true });

  /* 点击摘星 */
  const ray = new THREE.Raycaster();
  const pickEl = document.getElementById('pick');
  function tryPick(e){
    const r = canvas.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((e.clientX - r.left) / r.width) * 2 - 1,
      -((e.clientY - r.top) / r.height) * 2 + 1
    );
    ray.setFromCamera(ndc, camera);
    let hit = null, best = Infinity;
    for (const s of nearStars){
      if (!s.alive) continue;
      const d = ray.ray.distanceToPoint(s.sp.position);
      const rWorld = s.sp.scale.x * 0.34;
      if (d < rWorld){
        const along = ray.ray.direction.dot(s.sp.position.clone().sub(camera.position));
        if (along > 0 && along < best){ best = along; hit = s; }
      }
    }
    if (!hit) return;
    hit.alive = false;
    hit.timer = 0;
    hit.sp.material.opacity = 0;
    state.picked++;
    pickEl.textContent = '摘得 一 星';
    pickEl.classList.add('on');
    clearTimeout(pickEl._t);
    pickEl._t = setTimeout(() => pickEl.classList.remove('on'), 1600);

      map: starSpriteTex, color: new THREE.Color('#eaf1ff'), transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, opacity: 1
    }));
    flash.position.copy(hit.sp.position);
    flash.scale.setScalar(hit.sp.scale.x * 2);
    flash.renderOrder = -3;

  }

  // 竖屏时拉远；嵌进展厅 iframe 时再多留一圈余量
  function portraitFit(){
    const a = window.innerWidth / window.innerHeight;
    const base = a < 0.70 ? 1.62 : a < 0.88 ? 1.38 : a < 1.15 ? 1.12 : 1.0;
    return base * (window.self !== window.top ? 1.2 : 1.0);

  const DPR_CAP = [1.0, 1.55, 1.95];
  let autoScale = 1, lastDprAdjust = 0;

  function syncPixelRatio(){
    const want = Math.min(window.devicePixelRatio || 1, DPR_CAP[state.quality]) * autoScale;
    if (Math.abs(want - renderer.getPixelRatio()) < 0.02) return;
    renderer.setPixelRatio(want);
    for (const p of starLayers) p.material.uniforms.uPixelRatio.value = want;
  }
  function applyQuality(){
    const q = state.quality;
    btnQuality.textContent = '画质：' + QUALITY_NAME[q];
    autoScale = 1;
    lastDprAdjust = 0;
    syncPixelRatio();
    for (const p of starLayers) p.material.uniforms.uPixelRatio.value = renderer.getPixelRatio();
    const scale = q === 0 ? 0.8 : q === 1 ? 1.0 : 1.15;
    for (const p of starLayers) p.material.uniforms.uScale.value = scale;
    // 云层显隐
    cloudLayers.forEach((c, i) => { c.m.visible = q === 0 ? i < 3 : true; });
    moonKey.castShadow = q > 0 && !isMobile;
    const total = q === 0 ? 0.42 : q === 1 ? 0.72 : 1;
    starLayers[0].geometry.setDrawRange(0, Math.floor(22000 * total));
    starLayers[1].geometry.setDrawRange(0, Math.floor(32000 * total));
    starLayers[2].geometry.setDrawRange(0, Math.floor(320 * total));
    applyCamera();
  }
  applyQuality();

  /* ══════════ 尺寸 ══════════ */
  function onResize(){
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    // 竖屏时拉大视角，保证楼阁完整
    camera.fov = w / h < 0.85 ? 66 : w / h < 1.3 ? 58 : 52;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    // 横竖屏切换时重新适配距离
    const fit = portraitFit();
    if (Math.abs(fit - lastFit) > 0.05){
      lastFit = fit;
      cam.tRadius = VIEWS[cam.view].radius * fit;
    }
  }
  let lastFit = portraitFit();
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 260));
  onResize();

  /* ══════════ 主循环 ══════════ */
  const fpsEl = document.getElementById('fps');
  let last = performance.now(), acc = 0, frames = 0, fpsShown = 0;
  let raf = 0, running = true;

  function frame(now){
    raf = requestAnimationFrame(frame);
    if (!running) { last = now; return; }
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    if (!state.paused) state.t += dt;
    const t = state.t;

    // 相机缓动
    const ease = 1 - Math.pow(0.0015, Math.min(dt, 0.05));
    cam.theta += (cam.tTheta - cam.theta) * ease;
    cam.phi += (cam.tPhi - cam.phi) * ease;
    cam.radius += (cam.tRadius - cam.radius) * ease;
    cam.target.lerp(cam.tTarget, ease);
    applyCamera();

    if (!state.paused){
      // 天球缓慢西转
      starSpin.rotation.y = t * 0.00028;
      for (const p of starLayers) p.material.uniforms.uTime.value = t;

      // 云海
      for (const c of cloudLayers){
        c.mat.uniforms.uTime.value = t;
        if (c.amp){
          c.m.position.y = c.baseY + Math.sin(t * 0.13 + c.phase) * c.amp;
        }
      }

      // 近星呼吸与重生
      for (const s of nearStars){
        if (s.alive){
          const pulse = 0.86 + 0.14 * Math.sin(t * 1.35 + s.phase);
          s.sp.scale.setScalar(s.base * pulse);
          s.sp.material.opacity = 0.78 + 0.22 * pulse;
        } else {
          s.timer += dt;
          if (s.flash){
            const k = Math.min(s.timer / 0.75, 1);
            s.flash.scale.setScalar(s.base * (2 + k * 3.4));
            s.flash.material.opacity = 1 - k;
            if (k >= 1){ nearGroup.remove(s.flash); s.flash.material.dispose(); s.flash = null; }
          }
          if (s.timer > 3.4){
            s.alive = true; s.timer = 0;
            s.sp.position.copy(s.home);
            s.sp.scale.setScalar(s.base * 0.02);
          }
        }
      }

      // 灯笼轻晃
      for (const L of lanterns){
        const sw = Math.sin(t * 1.05 + L.phase) * 0.028;
        L.g.rotation.z = sw;
        L.g.rotation.x = Math.cos(t * 0.83 + L.phase) * 0.022;
        const fl = 0.86 + 0.14 * Math.sin(t * 7.3 + L.phase) * Math.sin(t * 3.1 + L.phase * 2);
        L.light.intensity = 7.2 + fl * 2.4;
        L.halo.material.opacity = 0.5 + fl * 0.16;
      }

      // 流星
      for (const m of meteors){
        if (m.dur > 0){
          m.life += dt;
          const k = m.life / m.dur;
          if (k >= 1){ m.dur = 0; m.mat.opacity = 0; m.wait = 7 + Math.random() * 18; }
          else {
            const head = 1400 * k;
            const arr = m.line.geometry.attributes.position;
            const dir = m.to.clone().sub(m.from).normalize();
            const hx = m.from.x + dir.x * head, hy = m.from.y + dir.y * head, hz = m.from.z + dir.z * head;
            arr.setXYZ(0, hx, hy, hz);
            arr.needsUpdate = true;
            m.mat.opacity = Math.sin(Math.PI * Math.min(k * 1.6, 1)) * 0.85;
          }
        } else {
          m.wait -= dt;
          if (m.wait <= 0) spawnMeteor(m);
        }
      }
    }

    renderer.render(scene, camera);

    frames++; acc += dt;
    if (acc >= 0.5){
      fpsShown = Math.round(frames / acc);
      fpsEl.textContent = fpsShown + ' FPS';
      acc = 0; frames = 0;
      // 自适应渲染分辨率：掉帧就降，余量足就缓慢回调
      const nowT = performance.now();
      if (state.quality > 0 && !state.paused && fpsShown > 0 && nowT - lastDprAdjust > 2000){
        if (fpsShown < 50 && autoScale > 0.66){
          autoScale = Math.max(0.68, autoScale - 0.09);
          lastDprAdjust = nowT; syncPixelRatio();
        } else if (fpsShown > 58 && autoScale < 1){
          autoScale = Math.min(1, autoScale + 0.05);
          lastDprAdjust = nowT; syncPixelRatio();
        }
      }
    }
  }

  // 后台暂停
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    last = performance.now();
  });

  requestAnimationFrame(frame);
  setTimeout(() => {
    veil.classList.add('hide');
    document.documentElement.dataset.ready = 'true';
    // 嵌在展厅里时主动报一声，父页面不必猜 iframe 内部有没有画出来
    if (window.self !== window.top){
      try {
        window.parent.postMessage({ type: 'poetic-realms:scene-ready' }, '*');
      } catch (e) { /* 父页面不可达就只靠自己显示 */ }
    }
  }, 900);

  // 供外部检测
  window.__scene = { renderer, scene, camera, state, fps: () => fpsShown };
}
</script>
</body>
</html>
