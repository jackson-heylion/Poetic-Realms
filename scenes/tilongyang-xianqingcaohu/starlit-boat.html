<style>
*{box-sizing:border-box}

#fps{position:fixed;right:28px;top:26px;text-align:right;font:10px/1.9 system-ui,sans-serif;letter-spacing:.14em;color:#8d90a0;text-shadow:0 2px 14px #000c}

#bar .btn{font:11px/1 system-ui,sans-serif;letter-spacing:.05em;padding:9px 12px;color:#e6dfd0;text-decoration:none;cursor:pointer;background:#131a26b8;border:1px solid #6d748c80;border-radius:2px;backdrop-filter:blur(8px);transition:background .18s,border-color .18s}
#bar .btn:hover{background:#1e2735e0;border-color:#98a0b8}

.embed #bar,.embed #fps{display:none}
@media(max-width:680px){#hud{top:38px;left:20px}h1{font-size:26px;letter-spacing:.16em;margin:12px 0 9px}blockquote{font-size:12px;line-height:2}#hud p{font-size:10px;max-width:210px;line-height:1.85}#fps{top:12px;right:14px;font-size:9px}#bar{right:11px;bottom:11px;gap:5px}#bar .btn{padding:8px 10px;font-size:10px}}
</style>

<body>
<div id="stage"></div>
<div id="vignette"></div>
<div id="hud"><div class="brand">POETIC REALMS / 一诗一境</div><h1>题龙阳县青草湖</h1>
<blockquote>醉后不知天在水，<br>满船清梦压星河。</blockquote>
<p>元 · 唐珙<br>轻移视点，湖天随视线流转；星河低垂及水。</p></div>
<div id="fps">— FPS</div>
<div id="bar">
  <a class="btn" href="../../catalog.html?poem=tilongyang-xianqingcaohu" target="_top">← 返回诗境</a>
  <button class="btn" id="btnReset" type="button">重置视角</button>
  <button class="btn" id="btnQuality" type="button">画质：标准</button>
  <button class="btn" id="btnPause" type="button">暂停</button>
</div>

<div id="veil"><div class="t">夜色初合</div></div>
<script>if(window.self!==window.top)document.documentElement.classList.add("embed");</script>
<script type="module">
const CDN = [
  'https://lib.baomitu.com/three.js/0.160.0/three.module.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
];
const veil = document.getElementById('veil');
const errEl = document.getElementById('notice');
function fail(msg){ errEl.className='show'; errEl.textContent = msg; veil.classList.add('hide'); }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
(async () => {
  let THREE = null;
  for (const url of CDN){
    try { THREE = await withTimeout(import(url), 10000); break; } catch (e) { /* 换下一个镜像 */ }
  }
  if (!THREE){ fail('未能载入三维引擎（baomitu / bootcdn / jsdelivr 均不可用），请检查网络后刷新。'); return; }
  try { boot(THREE); } catch (e){ console.error(e); fail('场景初始化失败：' + (e && e.message ? e.message : '未知错误')); }
})();

const DEG = Math.PI/180;
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp = (a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

function boot(THREE){
  const rnd = mulberry32(20717);

  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  document.getElementById('stage').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 8000);

  scene.add(new THREE.HemisphereLight(0x33486b, 0x060a12, 1.10));
  const moon = new THREE.DirectionalLight(0xbfd0ee, 1.55);
  moon.position.set(0.4, 0.8, -0.3);
  scene.add(moon);

  /* ---------- 夜空 ---------- */
  const C = {
    zenith : new THREE.Color(0x03060e),
    mid    : new THREE.Color(0x07101d),
    horizon: new THREE.Color(0x101d2e),
    galaxy : new THREE.Color(0x6f7fae)
  };
  /* 银河极轴：让银道斜跨画面上方 */
  const gal = new THREE.Vector3(0.28, -0.90, -0.31).normalize();
  const skyU = {
    uTime:{value:0}, uZenith:{value:C.zenith}, uMid:{value:C.mid},
    uHorizon:{value:C.horizon}, uGal:{value:C.galaxy}, uGalAxis:{value:gal}
  };

  const SKY_GLSL = `
    uniform vec3 uZenith, uMid, uHorizon, uGal, uGalAxis;
    uniform float uTime;
    float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
    float vn(vec2 p){
      vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y);
    }
    float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<5;i++){ s+=a*vn(p); p*=2.03; a*=0.5; } return s; }

    float starField(vec3 d, float dens){
      vec2 uv = vec2(atan(d.z, d.x) * 0.15915494, asin(clamp(d.y, -1.0, 1.0)) * 0.31830989);
      vec2 g = uv * dens;
      vec2 id = floor(g), f = fract(g);
      float pick = h21(id + 3.7);
      if (pick < 0.42) return 0.0;
      vec2 o = vec2(h21(id), h21(id + 11.3)) * 0.62 + 0.19;
      float dist = length(f - o);
      float mag = pow(h21(id + 5.1), 4.0);
      float tw = 0.72 + 0.28 * sin(uTime * 1.7 + h21(id + 2.2) * 30.0);
      return smoothstep(0.055, 0.0, dist) * mag * tw;
    }

    vec3 skyColor(vec3 d){
      float h = max(d.y, 0.0);
      vec3 c = mix(uHorizon, uMid, smoothstep(0.0, 0.20, h));
      c = mix(c, uZenith, smoothstep(0.16, 0.66, h));

      /* 银河：沿大圆的宽带 + 暗尘 */
      float lat = dot(d, uGalAxis);
      float az = atan(d.z, d.x);
      float warp = fbm(vec2(az * 1.7, lat * 3.1) + vec2(0.0, uTime*0.003));
      float band = exp(-pow((lat + (warp - 0.5) * 0.055) / 0.125, 2.0));
      float dust = fbm(vec2(az * 5.2, lat * 11.0) + vec2(uTime * 0.004, 0.0));
      float lane = smoothstep(0.42, 0.62, fbm(vec2(az * 2.9, lat * 6.0) + 17.0));
      float glow = band * (0.35 + 0.75 * dust) * (1.0 - 0.55 * lane);
      c += uGal * glow * 0.55;
      c += uGal * band * band * 0.12;

      /* 星子 */
      float s = starField(d, 150.0) + 0.55 * starField(d + 0.21, 90.0);
      c += vec3(0.86, 0.90, 1.0) * s * (0.85 + 0.75 * band);

      /* 地平线一带的微光 */
      c += vec3(0.05, 0.07, 0.10) * exp(-h * 9.0);
      return c;
    }
  `;

  const skyMat = new THREE.ShaderMaterial({
    uniforms: skyU,
    vertexShader:`varying vec3 vDir; void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vDir = wp.xyz - cameraPosition; gl_Position = projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`precision highp float; ${SKY_GLSL} varying vec3 vDir;
      void main(){ gl_FragColor = vec4(skyColor(normalize(vDir)), 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    side: THREE.BackSide, depthWrite:false, depthTest:false
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(5200, 48, 32), skyMat);
  sky.frustumCulled = false; sky.renderOrder = -100;
  scene.add(sky);

  /* ---------- 湖面 ---------- */
  const waterU = {
    uTime:{value:0}, uZenith:{value:C.zenith}, uMid:{value:C.mid},
    uHorizon:{value:C.horizon}, uGal:{value:C.galaxy}, uGalAxis:{value:gal}
  };
  const waterMat = new THREE.ShaderMaterial({
    uniforms: waterU,
    vertexShader:`varying vec3 vW; void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vW = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`precision highp float;
      uniform vec3 uZenith, uMid, uHorizon, uGal, uGalAxis;
      uniform float uTime;
      varying vec3 vW;
      float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
      float vn(vec2 p){
        vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
        return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y);
      }
      float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<4;i++){ s+=a*vn(p); p*=2.03; a*=0.5; } return s; }
      float starField(vec3 d, float dens){
        vec2 uv = vec2(atan(d.z, d.x) * 0.15915494, asin(clamp(d.y, -1.0, 1.0)) * 0.31830989);
        vec2 g = uv * dens;
        vec2 id = floor(g), f = fract(g);
        if (h21(id + 3.7) < 0.42) return 0.0;
        vec2 o = vec2(h21(id), h21(id + 11.3)) * 0.62 + 0.19;
        float dist = length(f - o);
        float mag = pow(h21(id + 5.1), 4.0);
        float tw = 0.72 + 0.28 * sin(uTime * 1.7 + h21(id + 2.2) * 30.0);
        return smoothstep(0.060, 0.0, dist) * mag * tw;
      }
      vec3 skyColor(vec3 d){
        float h = max(d.y, 0.0);
        vec3 c = mix(uHorizon, uMid, smoothstep(0.0, 0.20, h));
        c = mix(c, uZenith, smoothstep(0.16, 0.66, h));
        float lat = dot(d, uGalAxis);
        float az = atan(d.z, d.x);
        float warp = fbm(vec2(az * 1.7, lat * 3.1));
        float band = exp(-pow((lat + (warp - 0.5) * 0.055) / 0.125, 2.0));
        float dust = fbm(vec2(az * 5.2, lat * 11.0));
        float lane = smoothstep(0.42, 0.62, fbm(vec2(az * 2.9, lat * 6.0) + 17.0));
        c += uGal * band * (0.35 + 0.75 * dust) * (1.0 - 0.55 * lane) * 0.55;
        c += uGal * band * band * 0.12;
        float s = starField(d, 150.0) + 0.55 * starField(d + 0.21, 90.0);
        c += vec3(0.86, 0.90, 1.0) * s * (0.85 + 0.75 * band);
        return c;
      }
      void main(){
        vec3 V = normalize(vW - cameraPosition);
        vec2 p = vW.xz;
        float t = uTime;
        vec2 g = vec2(0.0);
        g += vec2(0.62,0.32)*0.0034*cos(dot(p,vec2(0.62,0.32))*0.34 - t*0.30);
        g += vec2(-0.28,0.92)*0.0026*cos(dot(p,vec2(-0.28,0.92))*0.62 - t*0.42);
        g += vec2(0.94,-0.24)*0.0014*cos(dot(p,vec2(0.94,-0.24))*1.35 - t*0.70);
        float dist = length(vW - cameraPosition);
        g *= 1.0 - 0.45*smoothstep(40.0, 380.0, dist);
        vec3 N = normalize(vec3(-g.x*2.6, 1.0, -g.y*2.6));
        float ndv = clamp(dot(N, -V), 0.0, 1.0);
        float F = 0.02 + 0.98*pow(1.0 - ndv, 4.6);
        vec3 R = reflect(V, N); R.y = max(R.y, 0.0015);
        vec3 col = mix(vec3(0.004,0.006,0.011), skyColor(normalize(R)), clamp(F*0.98 + 0.06, 0.0, 0.995));
        float fog = 1.0 - exp(-dist*0.0011);
        col = mix(col, uHorizon*0.55, clamp(fog,0.0,1.0));
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });
  waterMat.depthWrite = false;
  const water = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000, 1, 1), waterMat);
  water.rotation.x = -Math.PI/2;
  water.renderOrder = -30;
  scene.add(water);

  /* ---------- 远岸 ---------- */
  function shoreLine(z, baseY, amp, seed){
    const N = 130, pos = [], col = [];
    const r2 = mulberry32(seed);
    const ph = [r2()*6.28, r2()*6.28, r2()*6.28];
    const hAt = x => baseY + amp*(0.55*Math.abs(Math.sin(x*0.0042 + ph[0])) + 0.28*Math.abs(Math.sin(x*0.0111 + ph[1])) + 0.14*Math.abs(Math.sin(x*0.027 + ph[2])));
    const c0 = new THREE.Color(0x070c15), c1 = new THREE.Color(0x03050a);
    for (let i=0;i<N;i++){
      const x0 = -2600 + (5200/N)*i, x1 = -2600 + (5200/N)*(i+1);
      const y0 = hAt(x0), y1 = hAt(x1);
      pos.push(x0, y0, z, x1, y1, z, x1, -40, z);
      pos.push(x0, y0, z, x1, -40, z, x0, -40, z);
      col.push(c0.r,c0.g,c0.b, c0.r,c0.g,c0.b, c1.r,c1.g,c1.b);
      col.push(c0.r,c0.g,c0.b, c1.r,c1.g,c1.b, c1.r,c1.g,c1.b);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors:true, fog:false, side:THREE.DoubleSide }));
    m.renderOrder = -35;
    scene.add(m);
  }
  shoreLine(-420, -1, 13, 7);
  shoreLine(-900, -1, 26, 19);

  /* ---------- 渔舟 · 醉卧 ---------- */
  renderer.localClippingEnabled = true;
  const boat = new THREE.Group();
  const BL = 4.6, BB = 1.52, BD = 0.54;
  const U_STERN = 0.038, U_BOW = 0.966;
  const sheerAt = u => 0.255
    + 0.310*Math.pow(Math.max(0, 2*u-1), 2.6)
    + 0.120*Math.pow(Math.max(0, 1-2*u), 3.4);
  const halfBeam = u => {
    const sn = Math.pow(Math.max(Math.sin(Math.PI*u), 0.0001), u < 0.5 ? 0.70 : 0.86);
    return BB*0.5*sn;
  };
  const keelAt = u => -BD*Math.pow(Math.max(Math.sin(Math.PI*u), 0.0001), 0.32);
  function hullPt(u, a, inset, lift){
    const ang = a*Math.PI*0.5;
    const sy = sheerAt(u), ky = keelAt(u);
    const y = ky + (sy - ky - (inset||0)*0.62)*Math.pow(1-Math.cos(ang), 0.86) + (lift||0);
    const z = Math.max(halfBeam(u) - (inset||0), 0)*Math.pow(Math.sin(ang), 0.58);
    return [(u-0.5)*BL, y, z];
  }
  const NA = 9;
  function buildSkin(inset, lift){
    const NU = 46, pos = [], uvs = [], idx = [];
    let vbase = 0;
    for (const sgn of [1, -1]){
      for (let i=0;i<=NU;i++){
        const u = U_STERN + (U_BOW-U_STERN)*(i/NU);
        for (let j=0;j<=NA;j++){
          const p = hullPt(u, j/NA, inset, lift);
          pos.push(p[0], p[1], p[2]*sgn);
          uvs.push(u*1.34, (j/NA)*1.05);
        }
      }
      for (let i=0;i<NU;i++){
        for (let j=0;j<NA;j++){
          const a0 = vbase + i*(NA+1) + j, b0 = vbase + (i+1)*(NA+1) + j;
          if (sgn > 0) idx.push(a0, b0, a0+1, b0, b0+1, a0+1);
          else         idx.push(a0, a0+1, b0, b0, a0+1, b0+1);
        }
      }
      vbase += (NU+1)*(NA+1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  function buildRim(){
    const NU = 46, pos = [], idx = [];
    for (const sgn of [1, -1]){
      const base = pos.length/3;
      for (let i=0;i<=NU;i++){
        const u = U_STERN + (U_BOW-U_STERN)*(i/NU);
        const o = hullPt(u, 1, 0, 0), n = hullPt(u, 1, 0.080, -0.032);
        pos.push(o[0], o[1], o[2]*sgn, n[0], n[1], n[2]*sgn);
      }
      for (let i=0;i<NU;i++){
        const a0 = base + i*2, b0 = base + (i+1)*2;
        idx.push(a0, b0, a0+1, b0, b0+1, a0+1);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  function buildCap(uEnd){
    const pts = [];
    for (let j=0;j<=NA;j++) pts.push(hullPt(uEnd, j/NA, 0, 0));
    for (let j=NA;j>=0;j--){ const p = hullPt(uEnd, j/NA, 0, 0); pts.push([p[0], p[1], -p[2]]); }
    const cx = pts.reduce((a,p)=>a+p[0],0)/pts.length;
    const cy = pts.reduce((a,p)=>a+p[1],0)/pts.length;
    const pos = [cx, cy, 0], idx = [];
    pts.forEach(p=>pos.push(p[0], p[1], p[2]));
    for (let i=0;i<pts.length;i++) idx.push(0, 1+i, 1+((i+1)%pts.length));
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  const hullMat = new THREE.MeshStandardMaterial({ color:0x36424f, roughness:0.56, metalness:0.12, side:THREE.DoubleSide });
  const railMat = new THREE.MeshStandardMaterial({ color:0x55647a, roughness:0.48, metalness:0.10 });
  const deckMat = new THREE.MeshStandardMaterial({ color:0x1d2733, roughness:0.86 });
  const matMat  = new THREE.MeshStandardMaterial({ color:0x3c4757, roughness:0.86, side:THREE.DoubleSide });
  const clothMat= new THREE.MeshStandardMaterial({ color:0x222c38, roughness:0.98 });

  boat.add(new THREE.Mesh(buildSkin(0, 0), hullMat));
  boat.add(new THREE.Mesh(buildSkin(0.072, 0.030), deckMat));
  boat.add(new THREE.Mesh(buildRim(), railMat));
  boat.add(new THREE.Mesh(buildCap(U_STERN), deckMat));
  boat.add(new THREE.Mesh(buildCap(U_BOW), deckMat));

  /* 舱底 */
  {
    const NU = 26, pos = [], idx = [];
    const DECK_Y = 0.055;
    for (let i=0;i<=NU;i++){
      const u = 0.135 + (0.945-0.135)*(i/NU);
      const hb = halfBeam(u)*0.80 + 0.012;
      pos.push((u-0.5)*BL, DECK_Y - 0.016, -hb,
               (u-0.5)*BL, DECK_Y, 0,
               (u-0.5)*BL, DECK_Y - 0.016, hb);
    }
    for (let i=0;i<NU;i++){
      const a0 = i*3, b0 = (i+1)*3;
      idx.push(a0, b0, a0+1, b0, b0+1, a0+1);
      idx.push(a0+1, b0+1, a0+2, b0+1, b0+2, a0+2);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    boat.add(new THREE.Mesh(g, deckMat));
  }
  /* 坐板 */
  for (const u of [0.34, 0.86]){
    const w = halfBeam(u)*1.78;
    const th = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.045, w), railMat);
    th.position.set((u-0.5)*BL, sheerAt(u)-0.125, 0);
    boat.add(th);
  }
  /* 竹篷：半圆拱顶 + 两端封板，一次建成 */
  function vaultGeometry(r, len, segs){
    const pos = [], idx = [];
    const half = len/2;
    for (let i=0;i<=segs;i++){
      const a = Math.PI*i/segs;
      const y = Math.sin(a)*r, z = Math.cos(a)*r;
      pos.push(-half, y, z, half, y, z);
    }
    for (let i=0;i<segs;i++){
      const a0 = i*2, b0 = (i+1)*2;
      idx.push(a0, b0, a0+1, b0, b0+1, a0+1);
    }
    for (const sx of [-half, half]){
      const c = pos.length/3;
      pos.push(sx, 0, 0);
      for (let i=0;i<=segs;i++){
        const a = Math.PI*i/segs;
        pos.push(sx, Math.sin(a)*r, Math.cos(a)*r);
      }
      for (let i=0;i<segs;i++){
        if (sx < 0) idx.push(c, c+1+i, c+2+i);
        else        idx.push(c, c+2+i, c+1+i);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  {
    const aw = new THREE.Mesh(vaultGeometry(0.46, 1.32, 16), matMat);
    aw.position.set(0.92, 0.215, 0);
    aw.scale.set(1, 0.66, 1);
    boat.add(aw);
  }
  /* 醉卧的人：一团盖着旧袍的身体，斗笠扣在脸上 */
  {
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.44, 14, 10), clothMat);
    body.scale.set(1.85, 0.46, 0.56);
    body.position.set(-0.30, 0.235, 0.03);
    boat.add(body);

    const chest = new THREE.Mesh(new THREE.SphereGeometry(0.30, 12, 9), clothMat);
    chest.scale.set(1.05, 0.72, 0.85);
    chest.position.set(-1.02, 0.30, 0.0);
    boat.add(chest);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.098, 10, 8), clothMat);
    head.position.set(-1.30, 0.345, 0.0);
    boat.add(head);

    /* 斗笠扣在脸上 */
    const hatProf = [
      new THREE.Vector2(0.250, -0.018),
      new THREE.Vector2(0.228, 0.000),
      new THREE.Vector2(0.184, 0.026),
      new THREE.Vector2(0.130, 0.052),
      new THREE.Vector2(0.078, 0.076),
      new THREE.Vector2(0.033, 0.094),
      new THREE.Vector2(0.000, 0.101)
    ];
    const hat = new THREE.Mesh(new THREE.LatheGeometry(hatProf, 22),
      new THREE.MeshStandardMaterial({ color:0x505a66, roughness:0.92 }));
    hat.position.set(-1.30, 0.360, 0);
    hat.rotation.z = 0.16;
    boat.add(hat);

    /* 垂在船外的手 */
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.034, 0.40, 6), clothMat);
    arm.position.set(-0.62, 0.20, 0.30);
    arm.rotation.set(0.10, 0.0, 1.52);
    boat.add(arm);
  }

  /* 桨：搁在舱里，斜靠船帮 */
  {
    const oar = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.020, 2.5, 6), railMat);
    oar.position.set(0.05, 0.30, -0.42);
    oar.rotation.set(Math.PI/2 - 0.12, 0.0, 0.10);
    boat.add(oar);
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.020, 0.15), railMat);
    blade.position.set(1.28, 0.335, -0.40);
    blade.rotation.set(0, 0.02, 0.10);
    boat.add(blade);
  }

  /* 船体只在水面以上绘制，水面不写深度，倒影再按真实深度遮挡 */
  const aboveWater = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.0);
  boat.traverse(o=>{
    if (o.isMesh){
      o.material = o.material.clone();
      o.material.clippingPlanes = [aboveWater];
    }
  });

  boat.position.set(-4.55, 0.0, -10.4);
  boat.rotation.y = 0.68;
  scene.add(boat);

  /* 倒影 */
  const boatRefl = boat.clone(true);
  const belowWater = new THREE.Plane(new THREE.Vector3(0, -1, 0), -0.002);
  boatRefl.traverse(o=>{
    if (o.isMesh || o.isLine){
      o.material = o.material.clone();
      o.material.transparent = true;
      o.material.opacity = (o.material.opacity != null ? o.material.opacity : 1) * 0.26;
      o.material.depthWrite = false;
      o.material.depthTest = true;
      o.material.side = THREE.DoubleSide;
      o.material.clippingPlanes = [belowWater];
    }
  });
  boatRefl.scale.set(1, -1, 1);
  boatRefl.position.set(-4.55, 0.0, -10.4);
  boatRefl.renderOrder = 6;
  scene.add(boatRefl);

  /* 渔火：船头一盏灯笼 */
  {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.020, 0.026, 0.86, 6), railMat);
    pole.position.set(1.72, sheerAt(0.90)-0.10, 0.0);
    pole.rotation.z = -0.16;
    boat.add(pole);
    const hook = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.020, 0.020), railMat);
    hook.position.set(1.66, sheerAt(0.90)+0.22, 0.0);
    boat.add(hook);
  }
  const flame = new THREE.PointLight(0xffb060, 0.30, 4.5, 2);
  flame.position.set(1.62, sheerAt(0.90)+0.12, 0.18);
  boat.add(flame);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), new THREE.MeshBasicMaterial({ color:0xffc98a }));
  lamp.position.set(1.62, sheerAt(0.90)+0.12, 0.18);
  boat.add(lamp);

  /* ---------- 水面上的银河碎光 ---------- */
  const SPARK_N = 900;
  const sp = new Float32Array(SPARK_N*3), ss = new Float32Array(SPARK_N), sph = new Float32Array(SPARK_N);
  for (let i=0;i<SPARK_N;i++){
    sp[i*3]   = -70 + rnd()*140;
    sp[i*3+1] = 0.02;
    sp[i*3+2] = -120 + rnd()*110;
    ss[i] = 0.6 + rnd()*1.6;
    sph[i] = rnd()*6.283;
  }
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sp,3));
  sparkGeo.setAttribute('aSize', new THREE.BufferAttribute(ss,1));
  sparkGeo.setAttribute('aPhase', new THREE.BufferAttribute(sph,1));
  const sparkMat = new THREE.ShaderMaterial({
    uniforms:{ uTime:{value:0}, uPR:{value:Math.min(window.devicePixelRatio||1,2)} },
    vertexShader:`
      attribute float aSize, aPhase;
      uniform float uTime, uPR;
      varying float vA;
      void main(){
        vec3 p = position;
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPR * (26.0 / max(-mv.z, 1.0)) * (0.6 + 0.4*sin(uTime*1.4 + aPhase));
        vA = 0.35 + 0.35*sin(uTime*1.1 + aPhase*2.0);
      }`,
    fragmentShader:`
      varying float vA;
      void main(){
        vec2 q = gl_PointCoord - 0.5;
        float d = 1.0 - smoothstep(0.0, 0.5, length(q));
        gl_FragColor = vec4(vec3(0.72,0.80,1.0), d*vA*0.5);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  });
  const sparks = new THREE.Points(sparkGeo, sparkMat);
  sparks.frustumCulled = false;
  scene.add(sparks);

  /* ---------- 相机 ---------- */
  const cam = { mx:0, my:0, tmx:0, tmy:0 };
  window.addEventListener('pointermove', (e)=>{
    cam.tmx = (e.clientX/window.innerWidth - 0.5)*2;
    cam.tmy = (e.clientY/window.innerHeight - 0.5)*2;
  }, { passive:true });
  function updateCamera(t){
    cam.mx = lerp(cam.mx, cam.tmx, 0.04);
    cam.my = lerp(cam.my, cam.tmy, 0.04);
    const dx = Math.sin(t*0.043)*0.7;
    const narrow = window.innerWidth/window.innerHeight < 0.85;
    camera.position.set((narrow ? -2.3 : 0) + dx + cam.mx*1.1, (narrow ? 1.35 : 1.55) + Math.sin(t*0.061+0.8)*0.05 - cam.my*0.22, 0.6 + Math.sin(t*0.027)*0.8);
    /* 竖屏：视线左移并抬高，船与银河同框 */
    camera.lookAt(dx*0.8 + cam.mx*2.6 + (narrow ? -15 : 0), (narrow ? 2.95 : 2.55) - cam.my*0.8, narrow ? -62 : -70);
  }

  let qScale = 1;
  function applyFov(){
    const aspect = window.innerWidth/window.innerHeight;
    const hFov = 2*Math.atan(Math.tan(48*DEG*0.5) * (16/9));
    let fov = 2*Math.atan(Math.tan(hFov*0.5)/aspect)/DEG;
    fov = clamp(fov, 38, aspect < 0.85 ? 78 : 72);
    camera.fov = fov; camera.aspect = aspect; camera.updateProjectionMatrix();
  }
  function onResize(){
    applyFov();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2) * qScale);
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  applyFov();
  window.addEventListener('resize', onResize);

  const clock = new THREE.Clock();
  let firstFrame = true, paused = false, simT = 0, fpsAcc = 0, fpsN = 0;
  const fpsEl = document.getElementById('fps');
  const btnPause = document.getElementById('btnPause');
  const btnQuality = document.getElementById('btnQuality');
  btnPause.addEventListener('click', ()=>{ paused = !paused; btnPause.textContent = paused ? '继续' : '暂停'; });
  btnQuality.addEventListener('click', ()=>{ qScale = qScale > 1 ? 1 : 1.5; btnQuality.textContent = '画质：' + (qScale > 1 ? '高' : '标准'); onResize(); });
  document.getElementById('btnReset').addEventListener('click', ()=>{ cam.tmx = cam.tmy = 0; cam.mx = cam.my = 0; simT = 0; });

  function tick(){
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!paused) simT += dt;
    const t = simT;

    updateCamera(t);
    sky.position.copy(camera.position);
    skyU.uTime.value = t;
    waterU.uTime.value = t;
    sparkMat.uniforms.uTime.value = t;

    boat.position.y = Math.sin(t*0.42)*0.030;
    boat.rotation.z = Math.sin(t*0.37+1.0)*0.010;
    boatRefl.position.y = -boat.position.y;
    boatRefl.rotation.z = boat.rotation.z;
    flame.intensity = 0.26 + 0.07*Math.sin(t*3.1) + 0.04*Math.sin(t*7.7);

    renderer.render(scene, camera);

    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5){ fpsEl.textContent = Math.round(fpsN/fpsAcc) + ' FPS'; fpsAcc = 0; fpsN = 0; }
    if (firstFrame){ firstFrame = false; veil.classList.add('hide'); setTimeout(()=>{ veil.style.display='none'; }, 2200); }
    requestAnimationFrame(tick);
  }
  tick();
}
</script>
</body>
