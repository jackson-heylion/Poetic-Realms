(function(){

var HDR="#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n";
var SKY=`uniform vec3 uSun;
uniform vec3 uEye;
uniform float uTime;
float hsh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hsh(i),hsh(i+vec2(1.0,0.0)),f.x),mix(hsh(i+vec2(0.0,1.0)),hsh(i+vec2(1.0,1.0)),f.x),f.y);}
vec3 skyCol(vec3 d){
  float h=clamp(d.y*1.3+0.06,0.0,1.0);
  vec3 c=mix(vec3(0.815,0.835,0.855),vec3(0.345,0.420,0.530),pow(h,0.58));
  float s=max(dot(normalize(d),uSun),0.0);
  c+=vec3(1.0,0.972,0.930)*(pow(s,5.0)*0.12+pow(s,240.0)*0.55);
  if(d.y>0.02){
    vec2 q=d.xz/max(d.y,0.09);
    q=clamp(q,-46.0,46.0);
    float f=nz(q*0.38+vec2(uTime*0.008,0.0))*0.60+nz(q*1.3+vec2(0.0,uTime*0.005))*0.40;
    c=mix(c,vec3(0.960,0.965,0.968),smoothstep(0.40,0.82,f)*smoothstep(0.070,0.180,d.y)*0.62);
  }
  return c;
}`;
/* ---------- 着色器 ---------- */
var VS_TERRAIN=`precision highp float;
attribute vec3 aPos;attribute vec3 aNrm;attribute float aOcc;
uniform mat4 uVP;
varying vec3 vPos;varying vec3 vNrm;varying float vOcc;
void main(){vPos=aPos;vNrm=aNrm;vOcc=aOcc;gl_Position=uVP*vec4(aPos,1.0);}`;
var FS_TERRAIN=HDR+SKY+`
varying vec3 vPos;varying vec3 vNrm;varying float vOcc;
void main(){
  vec3 N=normalize(vNrm);
  vec3 V=normalize(vPos-uEye);
  float dist=length(vPos-uEye);
  float g1=nz(vPos.xz*0.085)*0.6+nz(vPos.xz*0.40)*0.4;
  float g2=nz(vec2(vPos.y*0.10,vPos.x*0.030))*0.5+nz(vec2(vPos.y*0.40,vPos.z*0.040))*0.5;
  float ny=clamp(N.y,0.0,1.0);
  float rock=smoothstep(0.660,0.470,ny+(g1-0.5)*0.07+(g2-0.5)*0.05)*0.72;
  vec3 rockC=mix(vec3(0.330,0.352,0.378),vec3(0.500,0.520,0.545),g1*0.6+g2*0.4);
  vec3 snowC=vec3(0.855,0.892,0.938)*(0.94+0.10*g1);
  vec3 alb=mix(snowC,rockC,rock);
  float land=abs(vPos.x-66.0*sin(vPos.z*0.0135))-(22.0+7.0*sin(vPos.z*0.019+1.1));
  alb*=mix(0.80,1.0,smoothstep(0.0,3.4,land));
  float ndl=max(dot(N,uSun),0.0);
  float ao=mix(0.45,1.0,vOcc);
  vec3 amb=mix(vec3(0.175,0.225,0.310),vec3(0.560,0.620,0.730),ny*0.5+0.5)*ao;
  vec3 col=alb*(amb+vec3(1.0,0.972,0.930)*ndl*0.55*mix(0.55,1.0,vOcc));
  col+=vec3(0.900,0.940,1.0)*pow(max(0.0,1.0-abs(dot(N,V))),8.0)*0.05*(1.0-rock);
  float mist=exp(-max(vPos.y,0.0)*0.048)*smoothstep(40.0,230.0,dist);
  float fog=1.0-exp(-dist*(0.00040+0.0082*mist));
  gl_FragColor=vec4(mix(col,skyCol(V),clamp(fog,0.0,0.99)),1.0);
}`;
var VS_WATER=`precision highp float;
attribute vec3 aPos;
uniform mat4 uVP;
varying vec3 vPos;
void main(){vPos=aPos;gl_Position=uVP*vec4(aPos,1.0);}`;
var FS_WATER=HDR+SKY+`
varying vec3 vPos;
uniform vec3 uBoat;
void main(){
  vec3 V=normalize(vPos-uEye);
  vec2 p=vPos.xz;
  float t=uTime;
  float r1=sin(p.x*1.55+t*1.05)+0.6*sin(p.y*1.05-t*0.68);
  float r2=sin(p.y*1.30-t*1.15+p.x*0.72)+0.5*sin(p.x*2.35+t*0.55);
  float r3=nz(p*1.85+vec2(0.0,t*0.16))-0.5;
  vec3 N=normalize(vec3(-(r1*0.0032+r3*0.019+r2*0.0020),1.0,-(r2*0.0036-r3*0.018)));
  float fres=0.045+0.88*pow(1.0-max(dot(N,-V),0.0),4.2);
  vec3 R=reflect(V,N);R.y=abs(R.y)+0.03;
  vec3 refl=mix(skyCol(normalize(R)),vec3(0.62,0.68,0.72),0.15);
  vec3 col=mix(vec3(0.150,0.190,0.212),refl,clamp(0.16+fres*0.84,0.0,0.92));
  float slush=smoothstep(0.58,0.82,nz(p*0.075+vec2(3.0,7.0))*0.60+nz(p*0.36)*0.40);
  col=mix(col,vec3(0.855,0.890,0.915),slush*0.40*(1.0-fres));
  float streak=nz(vec2(p.x*0.30,p.y*0.055+t*0.02));
  col*=0.972+0.055*streak;
  float edge=(22.0+7.0*sin(p.y*0.019+1.1))-abs(p.x-66.0*sin(p.y*0.0135));
  col=mix(col,vec3(0.815,0.855,0.885),(1.0-smoothstep(0.0,7.0,edge))*0.62);
  col*=mix(0.40,1.0,smoothstep(1.0,5.2,length(p-uBoat.xz)));
  float dist=length(vPos-uEye);
  float fog=1.0-exp(-dist*(0.00040+0.0074*smoothstep(40.0,260.0,dist)));
  gl_FragColor=vec4(mix(col,skyCol(V),clamp(fog,0.0,0.99)),1.0);
}`;
var VS_MESH=`precision highp float;
attribute vec3 aPos;attribute vec3 aNrm;attribute vec3 aCol;
uniform mat4 uVP;uniform mat4 uModel;uniform mat3 uNrm;
varying vec3 vCol;varying vec3 vN;varying vec3 vP;
void main(){vec4 w=uModel*vec4(aPos,1.0);vP=w.xyz;vN=uNrm*aNrm;vCol=aCol;gl_Position=uVP*w;}`;
var FS_MESH=HDR+SKY+`
varying vec3 vCol;varying vec3 vN;varying vec3 vP;
void main(){
  vec3 N=normalize(vN);
  vec3 V=normalize(vP-uEye);
  float ndl=max(dot(N,uSun),0.0);
  vec3 amb=mix(vec3(0.300,0.340,0.400),vec3(0.740,0.790,0.860),N.y*0.5+0.5);
  vec3 col=vCol*(amb+vec3(1.0,0.975,0.940)*ndl*0.50);
  col+=vec3(0.72,0.80,0.90)*pow(1.0-clamp(dot(N,-V),0.0,1.0),3.0)*0.18;
  float dist=length(vP-uEye);
  float mist=exp(-max(vP.y,0.0)*0.048)*smoothstep(40.0,230.0,dist);
  float fog=1.0-exp(-dist*(0.00040+0.0082*mist));
  gl_FragColor=vec4(mix(col,skyCol(V),clamp(fog,0.0,0.99)),1.0);
}`;
var VS_SKY=`precision highp float;
attribute vec2 aPos;
uniform vec3 uFwd;uniform vec3 uRight;uniform vec3 uUp;
varying vec3 vDir;
void main(){vDir=uFwd+uRight*aPos.x+uUp*aPos.y;gl_Position=vec4(aPos,0.9999,1.0);}`;
var FS_SKY=HDR+SKY+`
varying vec3 vDir;
void main(){gl_FragColor=vec4(skyCol(normalize(vDir)),1.0);}`;
var VS_SNOW=`precision highp float;
attribute vec3 aSeed;
uniform mat4 uVP;uniform vec3 uCam;uniform float uTime;uniform float uPx;
varying float vA;
void main(){
  float sp=0.55+aSeed.z*0.85;
  float y=fract(aSeed.y-uTime*0.050*sp);
  float x=fract(aSeed.x+sin(uTime*0.37+aSeed.z*31.0)*0.010+uTime*0.005);
  vec3 w=vec3(uCam.x+(x-0.5)*54.0,uCam.y-7.0+y*26.0,uCam.z+(aSeed.z-0.5)*62.0);
  vec4 cp=uVP*vec4(w,1.0);
  gl_Position=cp;
  float d=max(cp.w,1.0);
  gl_PointSize=clamp(uPx*78.0*(0.40+aSeed.x*0.65)/d,1.0,3.4*uPx);
  vA=0.70*(1.0-smoothstep(9.0,13.0,abs(y-0.5)*26.0));
}`;
var FS_SNOW=HDR+`
varying float vA;
void main(){
  vec2 d=gl_PointCoord-0.5;
  float r=length(d);
  if(r>0.5)discard;
  gl_FragColor=vec4(vec3(0.975,0.985,1.0),smoothstep(0.5,0.10,r)*vA);
}`;
function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error((gl.getShaderInfoLog(s)||"编译失败").slice(0,240));return s;}
function prog(v,f){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error((gl.getProgramInfoLog(p)||"链接失败").slice(0,240));return p;}
var pTerrain,pWater,pMesh,pSky,pSnow;
try{pTerrain=prog(VS_TERRAIN,FS_TERRAIN);pWater=prog(VS_WATER,FS_WATER);pMesh=prog(VS_MESH,FS_MESH);pSky=prog(VS_SKY,FS_SKY);pSnow=prog(VS_SNOW,FS_SNOW);}
catch(e){fail("着色器初始化失败："+e.message);return;}
function U(p,n){var o={};for(var i=0;i<n.length;i++)o[n[i]]=gl.getUniformLocation(p,n[i]);return o;}
var uT=U(pTerrain,["uVP","uSun","uEye","uTime"]);
var uW=U(pWater,["uVP","uSun","uEye","uTime","uBoat"]);
var uM=U(pMesh,["uVP","uSun","uEye","uTime","uModel","uNrm"]);
var uS=U(pSky,["uSun","uEye","uTime","uFwd","uRight","uUp"]);
var uF=U(pSnow,["uVP","uCam","uTime","uPx"]);
/* ---------- 矩阵 ---------- */
function perspective(fovy,asp,n,f){var t=1/Math.tan(fovy/2),o=new Float32Array(16);
  o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;}
function lookAt(e,c,up){var zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2];
  var l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
  var xx=up[1]*zz-up[2]*zy,xy=up[2]*zx-up[0]*zz,xz=up[0]*zy-up[1]*zx;
  l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;
  var yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  return new Float32Array([xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,
    -(xx*e[0]+xy*e[1]+xz*e[2]),-(yx*e[0]+yy*e[1]+yz*e[2]),-(zx*e[0]+zy*e[1]+zz*e[2]),1]);}
function mul(a,b){var o=new Float32Array(16);
  for(var c=0;c<4;c++)for(var r=0;r<4;r++){var s=0;for(var k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
/* ---------- 地形：河谷高度场 ---------- */
function h11(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vn(x,y){var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  var a=h11(xi,yi),b=h11(xi+1,yi),c=h11(xi,yi+1),d=h11(xi+1,yi+1);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;}
function fbm(x,y,oct){var s=0,a=0.5,f=1;for(var i=0;i<oct;i++){s+=a*vn(x*f,y*f);f*=2.03;a*=0.5;}return s;}
function sstep(a,b,x){var t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);}
function riverX(z){return 66*Math.sin(z*0.0135);}
function halfW(z){return 22+7*Math.sin(z*0.019+1.1);}
function terrainH(x,z){
  var t=Math.max(0,Math.abs(x-riverX(z))-halfW(z));
  var ra=fbm(x*0.0105+4.1,z*0.0105+9.7,4), rb=fbm(x*0.0098+21.3,z*0.0098+2.9,3);
  var ridgeA=1-Math.abs(2*ra-1), ridgeB=Math.pow(1-Math.abs(2*rb-1),1.25);
  var shore=Math.min(t,30)*0.20+sstep(0,40,t)*(9*fbm(x*0.020,z*0.020,3)-4.4);
  var mid=sstep(16,130,t)*(4+26*ridgeA+9*fbm(x*0.032,z*0.032,3)+7*fbm(x*0.075,z*0.075,3));
  var far=sstep(70,390,t)*(24+150*ridgeB+26*fbm(x*0.034,z*0.034,3)+16*fbm(x*0.062,z*0.062,2));
  return shore+mid+far-1.8;
}
var NX=184,NZ=236,gx=[],gz=[],i,j,W=NX+1,H=NZ+1;
for(i=0;i<=NX;i++){var s=i/NX*2-1;gx.push((s<0?-1:1)*Math.pow(Math.abs(s),1.85)*520);}
for(j=0;j<=NZ;j++){var tt=j/NZ;gz.push(40-1540*Math.pow(tt,1.72));}
var hg=new Float32Array(W*H);
for(j=0;j<H;j++)for(i=0;i<W;i++)hg[j*W+i]=terrainH(gx[i],gz[j]);
var tv=new Float32Array(W*H*7);
function hAt(ii,jj){return hg[Math.min(NZ,Math.max(0,jj))*W+Math.min(NX,Math.max(0,ii))];}
for(j=0;j<H;j++)for(i=0;i<W;i++){
  var t0=j*W+i,il=i>0?i-1:i,ir=i<NX?i+1:i,ju=j>0?j-1:j,jd=j<NZ?j+1:j;
  var dx=gx[ir]-gx[il],dz=gz[jd]-gz[ju];
  var a=-(hg[j*W+ir]-hg[j*W+il])/dx, b=-(hg[jd*W+i]-hg[ju*W+i])/dz;
  var nl=Math.hypot(a,1,b),hc=hg[t0];
  var oc1=(hAt(i-1,j)+hAt(i+1,j)+hAt(i,j-1)+hAt(i,j+1))*0.25-hc;
  var oc2=(hAt(i-4,j)+hAt(i+4,j)+hAt(i,j-4)+hAt(i,j+4))*0.25-hc;
  var occ=Math.min(1,Math.max(0.26,1-oc1*0.026-oc2*0.022));
  tv[t0*7]=gx[i];tv[t0*7+1]=hc;tv[t0*7+2]=gz[j];
  tv[t0*7+3]=a/nl;tv[t0*7+4]=1/nl;tv[t0*7+5]=b/nl;tv[t0*7+6]=occ;
}
var tIdx=new Uint16Array(NX*NZ*6),k=0;
for(j=0;j<NZ;j++)for(i=0;i<NX;i++){
  var v00=j*W+i,v10=v00+1,v01=v00+W,v11=v01+1;
  tIdx[k++]=v00;tIdx[k++]=v10;tIdx[k++]=v11;tIdx[k++]=v00;tIdx[k++]=v11;tIdx[k++]=v01;
}
/* ---------- 网格工具 ---------- */
var mp=[],mn=[],mc=[];
function quad(A,B,C,D,col,outward){
  var ux=B[0]-A[0],uy=B[1]-A[1],uz=B[2]-A[2],vx=C[0]-A[0],vy=C[1]-A[1],vz=C[2]-A[2];
  var nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz2=ux*vy-uy*vx;
  var l=Math.hypot(nx,ny,nz2)||1;nx/=l;ny/=l;nz2/=l;
  var cx=(A[0]+B[0]+C[0]+D[0])*0.25,cz=(A[2]+B[2]+C[2]+D[2])*0.25;
  if(outward&&(nx*cx+nz2*cz)<0){nx=-nx;ny=-ny;nz2=-nz2;}
  if(outward===2&&ny<0){nx=-nx;ny=-ny;nz2=-nz2;}
  var tri=[[A,B,C],[A,C,D]];
  for(var q=0;q<2;q++)for(var w=0;w<3;w++){
    var p=tri[q][w];mp.push(p[0],p[1],p[2]);mn.push(nx,ny,nz2);mc.push(col[0],col[1],col[2]);
  }
}
function tri3(A,B,C,col){
  var ux=B[0]-A[0],uy=B[1]-A[1],uz=B[2]-A[2],vx=C[0]-A[0],vy=C[1]-A[1],vz=C[2]-A[2];
  var nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz2=ux*vy-uy*vx;
