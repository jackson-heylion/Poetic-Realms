<script type="module">
/* 登高 · 无边落木萧萧下，不尽长江滚滚来
   单文件 three.js 场景：夔门一带的秋日长江为想象的取景，峡谷走向、崖壁层理与江面形态
   均为艺术处理，不作具体地望复原；落木、风向、水色按诗意推演。 */
const CDN = [
  'https://lib.baomitu.com/three.js/0.160.0/three.module.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
];

const canvas = document.getElementById('stage');
const statusBox = document.getElementById('status');
const messageEl = document.getElementById('message');
const retryBtn = document.getElementById('retry');

function fail(text) {
  statusBox.hidden = false;
  messageEl.textContent = text;
  retryBtn.hidden = false;
}
retryBtn.addEventListener('click', () => location.reload());

(async () => {
  const withTimeout = (p, ms) => Promise.race([
    p, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
  let THREE = window.THREE || null;
  for (const url of CDN) {
    if (THREE) break;
    try { THREE = await withTimeout(import(url), 10000); } catch (e) { /* 换下一个镜像 */ }
  }
  if (!THREE) { fail('未能载入三维引擎，请检查网络后重试。'); return; }
  try { boot(THREE); } catch (e) {
    console.error(e);
    fail('场景初始化失败：' + (e && e.message ? e.message : '未知错误'));
  }
})();

function boot(THREE) {
  /* ---------- 随机与噪声 ---------- */
  const mulberry32 = (a) => () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const rnd = mulberry32(20261110);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return s - Math.floor(s); };
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }
  function fbm(x, y, oct = 4) {
    let s = 0, amp = 0.5, f = 1;
    for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, y * f); f *= 2.03; amp *= 0.5; }
    return s;
  }
  // 可平铺噪声：u,v 以 1 为周期
  function pnoise(x, y, per) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const m = (i) => ((i % per) + per) % per;
    const a = hash2(m(xi), m(yi)), b = hash2(m(xi + 1), m(yi));
    const c = hash2(m(xi), m(yi + 1)), d = hash2(m(xi + 1), m(yi + 1));
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }
  function pfbm(u, v, per, oct) {
    let s = 0, amp = 0.5, f = per;
    for (let i = 0; i < oct; i++) { s += amp * pnoise(u * f, v * f, f); f *= 2; amp *= 0.5; }
    return s;
  }

  /* ---------- 渲染器 ---------- */
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  } catch (e) { fail('当前浏览器无法创建 WebGL 上下文。'); return; }
  if (!renderer.capabilities.isWebGL2) { fail('需要 WebGL2 支持才能渲染此场景。'); return; }
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.06;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const FOG_COLOR = new THREE.Color(0xc2b49c);
  const FOG_DENSITY = 0.00052;
  scene.fog = new THREE.FogExp2(FOG_COLOR, FOG_DENSITY);

  const camera = new THREE.PerspectiveCamera(54, innerWidth / innerHeight, 0.4, 6200);

  /* ---------- 程序化贴图 ---------- */
  const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  function heightToNormal(height, size, strength) {
    const c = makeCanvas(size, size), g = c.getContext('2d'), img = g.createImageData(size, size);
    const at = (x, y) => height[((y % size + size) % size) * size + ((x % size + size) % size)];
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const dx = (at(x + 1, y) - at(x - 1, y)) * strength;
      const dy = (at(x, y + 1) - at(x, y - 1)) * strength;
      const len = Math.hypot(dx, dy, 1);
      const i = (y * size + x) * 4;
      img.data[i] = Math.round((-dx / len * 0.5 + 0.5) * 255);
      img.data[i + 1] = Math.round((-dy / len * 0.5 + 0.5) * 255);
      img.data[i + 2] = Math.round((1 / len * 0.5 + 0.5) * 255);
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return tex;
  }

  // 灰岩：宽层理 + 斑驳 + 裂隙，灰度贴图，色相交给顶点色
  function rockTextures(size = 512) {
    const c = makeCanvas(size, size), g = c.getContext('2d'), img = g.createImageData(size, size);
    const height = new Float32Array(size * size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      const warp = pfbm(u * 0.9, v * 1.7, 3, 3);
      const phase = (v * 2.0 + warp * 0.6) * Math.PI * 2;
      const band = 0.5 + 0.5 * Math.sin(phase);
      const seam = Math.pow(band, 40);
      const mottle = pfbm(u * 2.2, v * 2.2, 6, 4);
      const crack = Math.pow(pfbm(u * 4.1, v * 2.6, 9, 3), 5) * 1.6;
      const seep = smooth(0.60, 0.95, pfbm(u * 2.6, v * 0.8, 5, 3));
      let lum = 0.88 + (band - 0.5) * 0.10 + (mottle - 0.5) * 0.30 - seam * 0.34 - crack * 0.26 - seep * 0.10;
      lum = clamp(lum, 0.34, 1.0);
      const i = (y * size + x) * 4;
      img.data[i] = Math.round(lum * 255);
      img.data[i + 1] = Math.round(lum * 252);
      img.data[i + 2] = Math.round(lum * 245);
      img.data[i + 3] = 255;
      height[y * size + x] = band * 0.30 + mottle * 0.55 - seam * 0.9 - crack * 0.7;
    }
    g.putImageData(img, 0, 0);
    const map = new THREE.CanvasTexture(c);
    map.colorSpace = THREE.SRGBColorSpace;
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    map.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return { map, normal: heightToNormal(height, size, 4.0) };
  }

  // 砌石：斑驳 + 细裂隙，用于石台石栏
  function stoneTexture(size = 256) {
    const c = makeCanvas(size, size), g = c.getContext('2d'), img = g.createImageData(size, size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      const mottle = pfbm(u * 2.4, v * 2.4, 6, 4);
      const fine = pfbm(u * 7.0, v * 7.0, 18, 3);
      const crack = Math.pow(pfbm(u * 5.4, v * 4.6, 11, 3), 6) * 1.8;
      const pit = smooth(0.66, 0.92, pfbm(u * 11.0, v * 11.0, 26, 2));
      const lum = clamp(0.90 + (mottle - 0.5) * 0.30 + (fine - 0.5) * 0.10 - crack * 0.34 - pit * 0.12, 0.30, 1.0);
      const i = (y * size + x) * 4;
      img.data[i] = Math.round(lum * 255);
      img.data[i + 1] = Math.round(lum * 252);
      img.data[i + 2] = Math.round(lum * 243);
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return tex;
  }

  // 水面法线：交叉波纹叠加，平铺
  function waterNormalTexture(size = 256) {
    const height = new Float32Array(size * size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      height[y * size + x] =
        pfbm(u, v, 5, 4) * 0.6 +
        pfbm(u * 1.7 + 0.31, v * 1.7 + 0.11, 9, 3) * 0.3 +
        pfbm(u * 3.3 + 0.7, v * 3.3 + 0.53, 17, 2) * 0.14;
    }
    return heightToNormal(height, size, 26);
  }

  // 白沫与流纹
  function foamTexture(size = 256) {
    const c = makeCanvas(size, size), g = c.getContext('2d'), img = g.createImageData(size, size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      const streak = pfbm(u * 1.1, v * 6.2, 6, 4);
      const grain = pfbm(u * 4.4, v * 9.0, 12, 3);
      const wisp = Math.pow(clamp((streak * 0.75 + grain * 0.35 - 0.32) * 2.4, 0, 1), 1.6);
      const i = (y * size + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = Math.round(wisp * 255);
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  // 树皮：纵向裂纹
  function barkTexture(w = 128, h = 256) {
    const c = makeCanvas(w, h), g = c.getContext('2d'), img = g.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const u = x / w, v = y / h;
      const fiber = pfbm(u * 3.2, v * 0.7, 6, 4);
      const crack = Math.pow(pfbm(u * 7.0, v * 1.6, 13, 3), 6);
      const lum = clamp(0.52 + (fiber - 0.5) * 0.9 - crack * 0.55, 0.08, 1);
      const i = (y * w + x) * 4;
      img.data[i] = Math.round(lum * 255);
      img.data[i + 1] = Math.round(lum * 236);
      img.data[i + 2] = Math.round(lum * 210);
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  // 叶片：卵形，带主脉与侧脉，透明度即轮廓
  function leafTexture(size = 128) {
    const c = makeCanvas(size, size), g = c.getContext('2d');
    g.translate(size / 2, size / 2);
    g.beginPath();
    const N = 22;
    for (let i = 0; i <= N; i++) {
      const t = i / N, y = lerp(-0.44, 0.44, t) * size;
      const w = Math.sin(Math.PI * Math.pow(t, 0.86)) * 0.30 * size * (1 - t * 0.25);
      const x = Math.sin(t * 26.0) * 0.012 * size + w;
      i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    for (let i = N; i >= 0; i--) {
      const t = i / N, y = lerp(-0.44, 0.44, t) * size;
      const w = Math.sin(Math.PI * Math.pow(t, 0.86)) * 0.30 * size * (1 - t * 0.25);
      const x = Math.sin(t * 26.0) * 0.012 * size - w;
      g.lineTo(x, y);
    }
    g.closePath();
    const grad = g.createLinearGradient(-size * 0.4, -size * 0.4, size * 0.4, size * 0.4);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, '#c9c2b4');
    g.fillStyle = grad;
    g.fill();
    g.strokeStyle = 'rgba(90,74,50,.30)';
    g.lineWidth = size * 0.012;
    g.beginPath(); g.moveTo(0, -size * 0.45); g.lineTo(0, size * 0.46); g.stroke();
    g.lineWidth = size * 0.007;
    for (let i = 0; i < 8; i++) {
      const t = 0.12 + i * 0.1, y = lerp(-0.44, 0.44, t) * size;
      const w = Math.sin(Math.PI * Math.pow(t, 0.86)) * 0.27 * size;
      g.beginPath(); g.moveTo(0, y); g.quadraticCurveTo(w * 0.6, y - size * 0.04, w * 0.94, y - size * 0.10); g.stroke();
      g.beginPath(); g.moveTo(0, y); g.quadraticCurveTo(-w * 0.6, y - size * 0.04, -w * 0.94, y - size * 0.10); g.stroke();
    }
    g.strokeStyle = 'rgba(70,54,34,.55)';
    g.lineWidth = size * 0.018;
    g.beginPath(); g.moveTo(0, size * 0.42); g.lineTo(size * 0.03, size * 0.52); g.stroke();
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    return tex;
  }

  // 枯草：一丛叶片
  function grassTexture(w = 256, h = 256) {
    const c = makeCanvas(w, h), g = c.getContext('2d');
    for (let i = 0; i < 46; i++) {
      const bx = w * (0.1 + rnd() * 0.8), tipX = bx + (rnd() - 0.5) * w * 0.42;
      const hh = h * (0.35 + rnd() * 0.6);
      const tone = 0.5 + rnd() * 0.5;
      g.strokeStyle = `rgba(${Math.round(168 * tone + 40)},${Math.round(136 * tone + 30)},${Math.round(78 * tone + 18)},${0.65 + rnd() * 0.35})`;
      g.lineWidth = 1.1 + rnd() * 2.2;
      g.beginPath();
      g.moveTo(bx, h);
      g.quadraticCurveTo(bx + (tipX - bx) * 0.2, h - hh * 0.6, tipX, h - hh);
      g.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  // 雾气：柔边团块
  function mistTexture(size = 256) {
    const c = makeCanvas(size, size), g = c.getContext('2d'), img = g.createImageData(size, size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      const dx = u - 0.5, dy = v - 0.5;
      const r = Math.sqrt(dx * dx + dy * dy) * 2;
      const n = fbm(u * 3.4, v * 3.4, 5);
      const a = clamp((1 - r) * 1.15, 0, 1) ** 1.6 * (0.45 + n * 0.85);
      const i = (y * size + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = 255;
      img.data[i + 3] = Math.round(clamp(a, 0, 1) * 255);
    }
    g.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

    half: (z) => 152 + 26 * Math.sin(z * 0.0034 + 0.5) + 14 * Math.sin(z * 0.0095 - 0.8) + 150 * smooth(0, -1100, z)

  const BARS = [
    { x: RIVER.cx(-250) - 96, z: -250, rx: 34, rz: 18, h: 1.5 },
    { x: RIVER.cx(-150) - 34, z: -150, rx: 13, rz: 9, h: 3.4 },

    { x: RIVER.cx(-120) + 40, z: -120, rx: 9, rz: 7, h: 2.6 }
  ];
  function terrainH(x, z) {
    const cx = RIVER.cx(z), hw = RIVER.half(z);
    const d = x - cx, ad = Math.abs(d), u = ad - hw;
    let h;
    if (u < 0) { // 江底
      const t = Math.min(1, -u / (hw * 0.92));
      h = -1.2 - 15 * Math.pow(t, 0.72) * (0.72 + 0.55 * fbm(x * 0.03 + 4, z * 0.03));
      h += 3.4 * fbm(x * 0.012 - 6, z * 0.012 + 2, 4);
    } else {
      const base = 3.2 * u;                 // 近水一段近乎立崖，其上转缓
      const w = smooth(2, 18, u);
      let raw = 210 * (1 - Math.exp(-base / 210));
      const ridge = 1 - Math.abs(fbm(x * 0.0048 + 11, z * 0.0048 - 7, 4) * 2 - 1);
      raw *= 0.86 + 0.30 * ridge;
      h = raw;
      // 脊状噪声：切出沟壑与石梁，避免坡面像布褶
      const r1 = 1 - Math.abs(fbm(x * 0.011 + 3.3, z * 0.011 - 2.1, 4) * 2 - 1);
      const r2 = 1 - Math.abs(fbm(x * 0.036 + 9.1, z * 0.036 + 4.4, 3) * 2 - 1);
      h += w * (16 * (r1 - 0.45) + 5.5 * (r2 - 0.5));
      h += w * 3.4 * (fbm(x * 0.105, z * 0.105, 3) - 0.5);
      h += w * 1.5 * (fbm(x * 0.28, z * 0.28, 2) - 0.5);
      const far = smooth(620, 1500, -z);
      h += far * far * 105 * (0.30 + 0.95 * fbm(x * 0.0032 + 21, z * 0.0032 + 9, 4));
      const back = smooth(280, 400, z);
      h += back * 30 * fbm(x * 0.01, z * 0.01, 3);
    }
    // 沙渚与礁石
    for (const b of BARS) {
      const qx = (x - b.x) / b.rx, qz = (z - b.z) / b.rz;
      const q2 = qx * qx + qz * qz;
      if (q2 < 6) h += b.h * Math.exp(-q2 * 1.25) * (0.75 + 0.5 * fbm(x * 0.08, z * 0.08, 2));
    }
    return h;
  }

  // 两级地形：近处细网格吃住岩层，远处粗网格交给雾气
  function buildTerrain(sizeX, sizeZ, segX, segZ, cx, cz, lift, hole) {
    const geo = new THREE.PlaneGeometry(sizeX, sizeZ, segX, segZ);
    geo.rotateX(-Math.PI / 2);
    geo.translate(cx, 0, cz);
    const pos = geo.attributes.position, uv = geo.attributes.uv;
    const count = pos.count;
    if (hole) {   // 挖去细网格覆盖的部分，避免两层地形互相穿插
      const src = geo.index.array, keep = [];
      for (let i = 0; i < src.length; i += 3) {
        const a = src[i], b = src[i + 1], c = src[i + 2];
        const mx = (pos.getX(a) + pos.getX(b) + pos.getX(c)) / 3;
        const mz = (pos.getZ(a) + pos.getZ(b) + pos.getZ(c)) / 3;
        if (mx > hole.x0 && mx < hole.x1 && mz > hole.z0 && mz < hole.z1) continue;
        keep.push(a, b, c);
      }
      geo.setIndex(keep);
    }
    for (let i = 0; i < count; i++) pos.setY(i, terrainH(pos.getX(i), pos.getZ(i)) + lift);
    geo.computeVertexNormals();
    const nrm = geo.attributes.normal;
    const colors = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const nx = Math.abs(nrm.getX(i)), ny = Math.abs(nrm.getY(i)), nz = Math.abs(nrm.getZ(i));
      // 按主法线轴投影，避免陡壁上的 UV 被拉成竖条
      if (ny > nx && ny > nz) uv.setXY(i, x * 0.30, z * 0.30);
      else if (nx > nz) uv.setXY(i, z * 0.30, y * 0.30);
      else uv.setXY(i, x * 0.30, y * 0.30);
      const slope = 1 - Math.abs(nrm.getY(i));
      const patch = fbm(x * 0.021 + 5, z * 0.021 - 3, 4);
      const fine = fbm(x * 0.19, z * 0.19, 2);
      const grain = fbm(x * 0.62, z * 0.62, 2);
      const facet = fbm(x * 0.33 + 17, z * 0.33 - 9, 3);
      const cleft = smooth(0.55, 0.78, fbm(x * 0.11 - 4, z * 0.11 + 6, 3));
      const t = clamp(patch * 0.85 + fine * 0.4, 0, 1);
      let r = lerp(0.300, 0.560, t), g = lerp(0.302, 0.552, t), b = lerp(0.288, 0.520, t);
      // 缓坡覆土与秋草
      const veg = smooth(0.66, 0.28, slope) * smooth(0.26, 0.60, patch + fine * 0.22);
      r = lerp(r, 0.190 + 0.09 * fine, veg * 0.92);
      g = lerp(g, 0.160 + 0.07 * fine, veg * 0.92);
      b = lerp(b, 0.088 + 0.035 * fine, veg * 0.92);
      // 秋叶灌丛
      const brush = smooth(0.60, 0.80, patch + fine * 0.15) * smooth(0.52, 0.18, slope);
      r = lerp(r, 0.315, brush * 0.55); g = lerp(g, 0.155, brush * 0.55); b = lerp(b, 0.070, brush * 0.55);
      // 沙渚：低平近水处泛白
      const sand = smooth(3.8, 1.1, y) * smooth(0.34, 0.10, slope) * smooth(-0.4, 0.9, y);
      r = lerp(r, 0.615 + 0.08 * grain, sand * 0.92);
      g = lerp(g, 0.575 + 0.07 * grain, sand * 0.92);
      b = lerp(b, 0.475 + 0.06 * grain, sand * 0.92);
      // 水线附近的湿岩
      const wet = smooth(1.0, -0.4, y);
      r = lerp(r, r * 0.52, wet * 0.8); g = lerp(g, g * 0.54, wet * 0.8); b = lerp(b, b * 0.58, wet * 0.8);
      const shade = (0.80 + 0.34 * grain) * (0.82 + 0.36 * facet) * (1.0 - cleft * 0.30);
      colors[i * 3] = r * shade; colors[i * 3 + 1] = g * shade; colors[i * 3 + 2] = b * shade;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mesh = new THREE.Mesh(geo, terrainMat);
    mesh.castShadow = false;      // 低日角下自阴影易出斑，交给顶点色与雾
    mesh.receiveShadow = true;
    return mesh;
  }

    fragmentShader: /* glsl */`
      precision highp float;
      varying vec3 vDir;
      uniform vec3 uSunDir;
      uniform vec3 uFogColor;
      uniform float uTime;

      float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vn(vec2 p){
        vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(h21(i), h21(i + vec2(1,0)), f.x), mix(h21(i + vec2(0,1)), h21(i + vec2(1,1)), f.x), f.y);
      }
      float fbm2(vec2 p){
        float s = 0.0, a = 0.5;
        for(int i = 0; i < 5; i++){ s += a * vn(p); p *= 2.03; a *= 0.5; }

      }

      void main(){
        vec3 dir = normalize(vDir);
        float y = dir.y;
        float mu = max(dot(dir, uSunDir), 0.0);

        // 低日角的瑞利-米氏近似：天顶深蓝，地平线暖白
        vec3 zenith = vec3(0.055, 0.150, 0.405);
        vec3 mid    = vec3(0.300, 0.415, 0.585);
        vec3 horiz  = vec3(0.850, 0.690, 0.520);
        float t = pow(clamp(1.0 - max(y, 0.0), 0.0, 1.0), 3.4);
        vec3 col = mix(zenith, mid, smoothstep(0.0, 0.62, t));
        col = mix(col, horiz, smoothstep(0.45, 1.0, t));
        // 太阳一侧的暖辉
        col += vec3(1.0, 0.56, 0.24) * pow(mu, 4.0) * 0.55 * smoothstep(-0.05, 0.6, y + 0.10);
        col += vec3(1.0, 0.72, 0.40) * pow(mu, 36.0) * 1.35;
        // 日轮
        col += vec3(1.0, 0.94, 0.82) * smoothstep(0.99978, 0.99994, mu) * 30.0;

        // 卷云：高空、被风拉长
        if (y > 0.005) {
          vec2 cuv = dir.xz / max(y, 0.06);
          vec2 drift = vec2(uTime * 0.0042, uTime * 0.0013);
          float cl = fbm2(cuv * vec2(0.30, 0.72) + drift);
          cl += 0.5 * fbm2(cuv * vec2(0.75, 1.7) + drift * 1.6 + 3.1);
          float mask = smoothstep(0.62, 0.92, cl) * smoothstep(0.0, 0.30, y) * (1.0 - smoothstep(0.72, 1.0, y));

        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });

  const WATER = { x0: -300, x1: 330, z0: 330, z1: -1380 };

    const data = new Uint8Array(MASK_W * MASK_H * 4);

  const waterUniforms = {

      precision highp float;

      uniform vec3 uSunColor;
      uniform vec3 uSkyColor;

        float near = smoothstep(1100.0, 40.0, vFogDepth);
        vec3 N = normalize(vec3(

          1.0,

        foam = smoothstep(0.34, 0.84, foam) * smoothstep(0.0, 0.05, depth);

        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`

  const water = new THREE.Mesh(waterGeo, waterMat);

  function treeGeometry(seed, height) {
    const r = mulberry32(seed);
    const positions = [], normals = [], uvs = [], indices = [];
    const tips = [];
    const SIDES = 5;
    function tube(a, b, ra, rb) {
      const dir = new THREE.Vector3().subVectors(b, a).normalize();
      const up = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
      const u = new THREE.Vector3().crossVectors(dir, up).normalize();
      const v = new THREE.Vector3().crossVectors(dir, u).normalize();
      const base = positions.length / 3;
      for (let s = 0; s <= SIDES; s++) {
        const ang = s / SIDES * Math.PI * 2;
        const nx = Math.cos(ang), ny = Math.sin(ang);
        const radial = new THREE.Vector3().addScaledVector(u, nx).addScaledVector(v, ny);
        const p = new THREE.Vector3().copy(a).addScaledVector(radial, ra);
        positions.push(p.x, p.y, p.z);
        normals.push(radial.x, radial.y, radial.z);
        uvs.push(s / SIDES * 2, 0);
      }
      for (let s = 0; s <= SIDES; s++) {
        const ang = s / SIDES * Math.PI * 2;
        const radial = new THREE.Vector3().addScaledVector(u, Math.cos(ang)).addScaledVector(v, Math.sin(ang));
        const p = new THREE.Vector3().copy(b).addScaledVector(radial, rb);
        positions.push(p.x, p.y, p.z);
        normals.push(radial.x, radial.y, radial.z);
        uvs.push(s / SIDES * 2, 1);
      }
      for (let s = 0; s < SIDES; s++) {
        const i0 = base + s, i1 = base + s + 1, i2 = base + SIDES + 1 + s, i3 = base + SIDES + 2 + s;
        indices.push(i0, i2, i1, i1, i2, i3);
      }
    }
    function branch(origin, dir, len, rad, depth) {
      let p = origin.clone(), d = dir.clone().normalize();
      const steps = 3;
      for (let s = 0; s < steps; s++) {
        const next = p.clone().addScaledVector(d, len / steps);
        tube(p, next, rad * (1 - 0.16 * s / steps), rad * (1 - 0.16 * (s + 1) / steps));
        d.x += (r() - 0.5) * 0.22; d.z += (r() - 0.5) * 0.22; d.y += (r() - 0.5) * 0.12;
        d.normalize();
        p = next;
      }
      if (depth >= 4 || rad < 0.022) { tips.push({ p: p.clone(), d: d.clone() }); return; }
      const kids = depth === 0 ? 4 : (r() < 0.42 ? 3 : 2);
      for (let i = 0; i < kids; i++) {
        const ang = r() * Math.PI * 2;
        const tilt = 0.38 + r() * 0.62;
        const nd = d.clone().multiplyScalar(Math.cos(tilt))
          .add(new THREE.Vector3(Math.cos(ang) * Math.sin(tilt), 0.12 + r() * 0.2, Math.sin(ang) * Math.sin(tilt)))
          .normalize();
        branch(p, nd, len * (0.58 + r() * 0.2), rad * 0.6, depth + 1);
      }
    }
    branch(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.04, 1, 0.03), height * 0.42, height * 0.030, 0);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    return { geo, tips };
  }

  const leafMatGPU = new THREE.ShaderMaterial({

      precision highp float;
      attribute vec4 aSeed;
      attribute vec3 aOrigin;
      attribute vec3 aTint;
      uniform float uTime;
      uniform vec3 uWind;
      uniform vec3 uSunDir;
      uniform vec3 uSunColor;
      uniform vec3 uAmb;
      uniform vec3 uFogColor;
      uniform float uFogDensity;
      varying vec2 vUv;
      varying vec3 vColor;

        vec3 p = aOrigin;

        p.x += uWind.x * drift;
        p.z += uWind.z * drift;
        float sw = 1.1 + aSeed.z * 1.8;
        p.x += sin(t * 11.0 + aSeed.y * 52.0) * sw * t;
        p.z += cos(t * 8.4 + aSeed.x * 37.0) * sw * t * 0.8;
        p.y += sin(t * 6.0 + aSeed.w * 21.0) * 0.9 * t;

        float a1 = t * (5.0 + aSeed.y * 9.0) + aSeed.x * 30.0;
        float a2 = t * (3.0 + aSeed.w * 7.0) + aSeed.z * 20.0;
        mat3 R = rotAxis(vec3(0.42, 0.31, 0.85), a1) * rotAxis(vec3(0.86, -0.35, 0.21), a2);
        float size = 0.19 + aSeed.w * 0.15;
        vec3 local = R * vec3(position.xy * vec2(size, size * 1.3), 0.0);
        vec3 world = p + local;

        vec3 N = normalize(R * vec3(0.0, 0.0, 1.0));
        vec3 V = normalize(cameraPosition - world);

        float back = pow(max(dot(-V, uSunDir), 0.0), 2.4);   // 逆光透亮

        vec4 mv = viewMatrix * vec4(world, 1.0);
        vFogDepth = -mv.z;
        vUv = uv;
        gl_Position = projectionMatrix * mv;
      }`,

      precision highp float;

      uniform vec3 uFogColor;

        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });

  {

  {

          p.y += sin(uTime * 7.0 + p.x * 2.2) * 0.34 * aWing;
          vec4 mv = viewMatrix * modelMatrix * vec4(p, 1.0);
          vFogDepth = -mv.z;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform vec3 uFogColor;
        uniform float uFogDensity;
        varying float vFogDepth;
        void main(){
          float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * vFogDepth * vFogDepth);
          vec3 col = mix(vec3(0.10, 0.095, 0.09), uFogColor, clamp(fogFactor, 0.0, 0.85));
          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`
    });
    for (let i = 0; i < 11; i++) {
      const m = new THREE.Mesh(geo, mat.clone());
      const s = 0.7 + rnd() * 0.9;
      m.scale.setScalar(s);
      m.frustumCulled = false;
      m.userData = {
        radius: 70 + rnd() * 190,
        cy: 26 + rnd() * 46,
        cz: -120 - rnd() * 380,
        cx: RIVER.cx(-200),
        phase: rnd() * 6.28,
        speed: 0.055 + rnd() * 0.05,
        bob: rnd() * 6.28
      };
      scene.add(m);
      birds.push(m);
    }
  }

  /* ---------- 相机与交互 ---------- */
  const eye = new THREE.Vector3(PLATFORM.x + 1.2, groundY + 1.70, PLATFORM.z - 1.6);
  const target = new THREE.Vector3(42, 6, -560);
  const dir0 = target.clone().sub(eye).normalize();
  const baseYaw = Math.atan2(-dir0.x, -dir0.z);
  const basePitch = Math.asin(clamp(dir0.y, -1, 1));
  camera.position.copy(eye);
  camera.rotation.order = 'YXZ';
  sun.target.position.set(eye.x, eye.y - 6, eye.z);
  sun.target.updateMatrixWorld();

  let yawOff = 0, pitchOff = 0, yawGoal = 0, pitchGoal = 0;
  let fovGoal = 54, fovNow = 54;
  let dragging = false, lastX = 0, lastY = 0, lastMove = -1e9;

  const onDown = (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture?.(e.pointerId);
    lastMove = performance.now();
  };
  const onMove = (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    yawGoal = clamp(yawGoal - dx * 0.0022, -0.85, 0.85);
    pitchGoal = clamp(pitchGoal - dy * 0.0016, -0.30, 0.28);
    lastMove = performance.now();
  };
  const onUp = () => { dragging = false; };
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    fovGoal = clamp(fovGoal + e.deltaY * 0.02, 34, 76);
    lastMove = performance.now();
  }, { passive: false });
  canvas.addEventListener('dblclick', () => { yawGoal = 0; pitchGoal = 0; fovGoal = 54; });
  canvas.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft') yawGoal = clamp(yawGoal + 0.05, -0.85, 0.85);
    else if (k === 'ArrowRight') yawGoal = clamp(yawGoal - 0.05, -0.85, 0.85);
    else if (k === 'ArrowUp') pitchGoal = clamp(pitchGoal + 0.03, -0.30, 0.28);
    else if (k === 'ArrowDown') pitchGoal = clamp(pitchGoal - 0.03, -0.30, 0.28);
    else return;
    e.preventDefault(); lastMove = performance.now();
  });

  /* ---------- 画质、暂停与循环 ---------- */
  const pauseBtn = document.getElementById('pause');
  const qualityBtn = document.getElementById('quality');
  const resetBtn = document.getElementById('reset');
  const fpsEl = document.getElementById('fps');
  let qualityHigh = !mobile;
  let paused = false;
  let simTime = 0;
  let last = performance.now();
  let frames = 0, fpsClock = 0, fpsValue = 0;

  function applyPixelRatio() {
    const dpr = Math.min(devicePixelRatio || 1, qualityHigh ? 2 : 1);
    renderer.setPixelRatio(dpr);
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  function applyQuality() {
    applyPixelRatio();
    leafGeo.instanceCount = qualityHigh ? LEAF_COUNT : Math.floor(LEAF_COUNT * 0.42);
    leafGeo.attributes.position.needsUpdate = false;
    for (const m of mists) m.mesh.visible = true;
    qualityBtn.textContent = qualityHigh ? '画质：精细' : '画质：流畅';
  }
  qualityBtn.addEventListener('click', () => { qualityHigh = !qualityHigh; applyQuality(); });
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? '继续' : '暂停';
  });
  resetBtn.addEventListener('click', () => { yawGoal = 0; pitchGoal = 0; fovGoal = 54; });

  addEventListener('resize', applyPixelRatio);
  applyQuality();

  let contextLost = false;
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault(); contextLost = true;
    fail('图形上下文已丢失，画面暂停。请点击重新载入。');
  });
  canvas.addEventListener('webglcontextrestored', () => { if (contextLost) location.reload(); });

  const wind = new THREE.Vector3();
  function tick(now) {
    requestAnimationFrame(tick);
    if (contextLost) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) simTime += dt;

    // 风：低频阵风，与落叶、雾气同步
    const gust = 0.62 + 0.38 * Math.sin(simTime * 0.31) + 0.22 * Math.sin(simTime * 0.87 + 1.7);
    wind.set(0.66 * gust, 0, -0.42 * gust).normalize().multiplyScalar(1.1 + gust * 0.7);
    leafUniforms.uWind.value.copy(wind);
    leafUniforms.uTime.value = simTime;
    waterUniforms.uTime.value = simTime;
    skyUniforms.uTime.value = simTime;
    grassMesh.material.uniforms.uTime.value = simTime;
    for (const b of birds) b.material.uniforms.uTime.value = simTime + b.userData.bob;

    // 相机：缓动 + 极轻的手持呼吸
    yawOff += (yawGoal - yawOff) * Math.min(1, dt * 4.2);
    pitchOff += (pitchGoal - pitchOff) * Math.min(1, dt * 4.2);
    fovNow += (fovGoal - fovNow) * Math.min(1, dt * 3.6);
    const breatheY = Math.sin(simTime * 0.27) * 0.0016 + Math.sin(simTime * 0.63 + 2.1) * 0.0009;
    const breatheP = Math.sin(simTime * 0.19 + 1.1) * 0.0013;
    camera.position.y = eye.y + Math.sin(simTime * 0.42) * 0.03;
    camera.rotation.set(basePitch + pitchOff + breatheP, baseYaw + yawOff + breatheY, 0);
    if (Math.abs(camera.fov - fovNow) > 0.01) {
      camera.fov = fovNow;
      camera.updateProjectionMatrix();
    }
    sky.position.copy(camera.position);

    for (const m of mists) {
      const s = m.mesh;
      s.position.x = m.baseX + Math.sin(simTime * m.speed + m.phase) * 16;
      s.position.y += Math.sin(simTime * 0.12 + m.phase) * 0.004;
      s.lookAt(camera.position.x, s.position.y, camera.position.z);
    }
    for (const b of birds) {
      const u = b.userData;
      const a = u.phase + simTime * u.speed * 6.28;
      b.position.set(
        u.cx + Math.cos(a) * u.radius,
        u.cy + Math.sin(simTime * 0.4 + u.bob) * 3.2,
        u.cz + Math.sin(a) * u.radius * 0.55
      );
      b.rotation.y = -a + Math.PI / 2;
      b.rotation.z = Math.sin(a * 2.0) * 0.18;
    }

    renderer.render(scene, camera);

    frames++; fpsClock += dt;
    if (fpsClock > 0.5) {
      fpsValue = Math.round(frames / fpsClock);
      frames = 0; fpsClock = 0;
      if (fpsEl) fpsEl.textContent = fpsValue + ' fps';
    }
  }
  requestAnimationFrame(tick);
  requestAnimationFrame(() => { statusBox.hidden = true; });
  window.__scene = { renderer, scene, camera, get fps() { return fpsValue; } };
}
</script>
</body>
</html>
