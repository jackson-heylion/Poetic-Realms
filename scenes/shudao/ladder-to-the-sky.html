  quality: QUAL[quality].name, size: [RW, RH], hdr: HDR, ready, paused, touring, trees: treeMeshes.map(m => m.count) });
window.__shudaoStep = dt => step(dt, true);
function step(dt, force) {
  clock += dt; U.uTime.value = clock;
  updateTOD(dt); updateCamera(dt); updateBirds(clock); updateCaravan(dt, clock, camera.position.z);
  const c = tod.cur;
  volMat.uniforms.uMist.value.set(c.mist, 410, 85, .012); volMat.uniforms.uWind.value.set(clock * .0021, clock * .0004, clock * .0012);
  UP.uLamp.value.w = c.night * 2.4;
  if (sunMoved && (tod.t >= 1 || (shTick++ % 4) === 0 || force)) { updateFarShadow(); if (tod.t >= 1) sunMoved = false; }
  if (QUAL[quality].shNear) { camera.getWorldDirection(fwd); focus.copy(camera.position).addScaledVector(fwd, 95); updateNearShadow(focus); }
  renderFrame(1 - view.fade);
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, .1); last = now;
  if (fatal || paused || document.hidden || !hostVisible) return;
  step(dt, false); updateAudio(dt);
  if (!ready) { ready = true; hideMsg(); document.documentElement.dataset.ready = '1';
    try { if (parent !== window) parent.postMessage({ type: 'poetic-realms:scene-ready' }, '*'); } catch (err) { /* 独立打开时无宿主 */ } }
  stat.frames++; stat.acc += dt;
  if (stat.acc >= .75) {
    stat.fps = Math.round(stat.frames / stat.acc); stat.frames = 0; stat.acc = 0;
    fpsEl.textContent = stat.fps + ' FPS · ' + RW + '×' + RH + ' · ' + renderer.info.render.calls + ' draws · ' + Math.round(renderer.info.render.triangles / 1000) + 'k 三角';
    // 未手动选过画质时，持续低帧自动降一档
    if (!userQuality && quality > 0 && clock > 4) { stat.low = stat.fps < 24 ? stat.low + 1 : 0; if (stat.low >= 5) { stat.low = 0; setQuality(quality - 1, false); } }
  }
}
requestAnimationFrame(frame);
} // boot
})();
