function makeNoise(seed) {

function fbm(n, x, y, oct) { let a = 0, f = 1, amp = .5, sum = 0; for (let i = 0; i < oct; i++) { a += n(x * f, y * f) * amp; sum += amp; f *= 2.03; amp *= .5; } return a / sum; }

const PEAKS = [
  { x: -30, z: -45, h: 340, sx: 218, sz: 104 }, { x: -305, z: 34, h: 272, sx: 178, sz: 96 },
  { x: 268, z: -18, h: 292, sx: 188, sz: 99 }, { x: -528, z: 78, h: 202, sx: 152, sz: 101 },

  { x: -196, z: 208, h: 126, sx: 146, sz: 88 }

        col+=vec3(0.48,0.25,0.11)*pow(1.0-clamp(y*3.0,0.0,1.0),3.0)*pow(sd,2.0)*0.85;
        col+=vec3(1.0,0.78,0.52)*(pow(sd,5.0)*0.16+pow(sd,22.0)*0.30+pow(sd,240.0)*0.90);
        col+=vec3(1.0,0.96,0.86)*smoothstep(0.9986,0.9994,sd)*2.0;
        float band=smoothstep(0.03,0.30,d.y)*(1.0-smoothstep(0.55,0.95,d.y));
        float cl=n2(d.xz*7.0/max(d.y+0.28,0.18));
        col=mix(col,vec3(0.94,0.91,0.87),smoothstep(0.50,0.76,cl)*band*0.17);
        gl_FragColor=vec4(col,1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(3600, 36, 20), skyMat);
  sky.frustumCulled = false; scene.add(sky);

  /* 远山剪影环与江湖底盘：只负责纵深，细节交给雾 */
  function ridgeRing(R, baseH, amp, tint, seed) {
    const seg = 150, pos = [], col = [], idx = [], nn = makeNoise(seed), c = new THREE.Color(tint);
    for (let i = 0; i <= seg; i++) {
      const a = i / seg * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      const r = R + 96 * fbm(nn, ca * 2.3, sa * 2.3, 3);
      const h = baseH + amp * (.32 + .68 * ridge(nn, ca * 3.2 + 7, sa * 3.2 - 4, 4));
      const x = ca * r, z = sa * r;
      pos.push(x, -10, z, x, h, z);
      col.push(c.r * .82, c.g * .86, c.b * .92, c.r, c.g, c.b);
      if (i < seg) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, fog: true }));
  }
  scene.add(ridgeRing(1500, 120, 190, 0x8799a6, 771), ridgeRing(2050, 90, 230, 0x9caab3, 913));

  /* 主体高度场：三平面程序化材质，保留 three 的光照、阴影与雾 */
  const SEG = isMobile ? 160 : 288, EXT = 1000, detailTex = makeDetailTex(THREE);
  const ground = new THREE.PlaneGeometry(EXT * 2, EXT * 2, SEG, SEG);
  ground.rotateX(-Math.PI / 2);
  const pa = ground.attributes.position;
  for (let i = 0; i < pa.count; i++) pa.setY(i, H(pa.getX(i), pa.getZ(i)));
  pa.needsUpdate = true; ground.computeVertexNormals(); ground.computeBoundingSphere();
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .94, metalness: 0 });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uDetail = { value: detailTex };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nvarying vec3 vWNrm;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos=(modelMatrix*vec4(transformed,1.0)).xyz;\nvWNrm=normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform sampler2D uDetail; varying vec3 vWPos; varying vec3 vWNrm;
        vec3 tri(vec3 p, vec3 n, float s){
          vec3 w=pow(abs(n),vec3(4.0)); w/=max(w.x+w.y+w.z,0.0001);
          return texture2D(uDetail,p.zy*s).rgb*w.x
               + texture2D(uDetail,p.xz*s).rgb*w.y
               + texture2D(uDetail,p.xy*s).rgb*w.z; }`)
      .replace('#include <map_fragment>', `#include <map_fragment>
        vec3 nn=normalize(vWNrm);
        float slope=1.0-clamp(nn.y,0.0,1.0);
        float alt=vWPos.y;
        vec3 d1=tri(vWPos,nn,0.012), d2=tri(vWPos,nn,0.058);
        float blotch=d1.r, rock=d1.g+d2.g*0.45, grain=d2.b;
        float treeline=298.0+(blotch-0.5)*96.0-slope*130.0;
        float veg=clamp((1.0-smoothstep(treeline-72.0,treeline+52.0,alt))
                 *(1.0-smoothstep(0.48,0.90,slope))*(0.50+0.70*blotch),0.0,1.0);
        vec3 forest=mix(vec3(0.038,0.078,0.042),vec3(0.092,0.150,0.070),blotch);
        vec3 rockC=mix(vec3(0.160,0.158,0.150),vec3(0.325,0.315,0.295),rock);
        vec3 baseC=mix(rockC,mix(vec3(0.086,0.140,0.070),forest,0.70),veg);
        baseC=mix(baseC,vec3(0.395,0.380,0.352),smoothstep(292.0,362.0,alt)*(0.30+0.40*grain));
        float strata=sin(vWPos.y*0.21+d1.b*11.0)*0.5+0.5;
        baseC*=0.80+0.28*strata*(1.0-veg);
        baseC*=0.82+0.32*grain;
        baseC*=0.88+0.24*blotch;
        baseC*=0.86+0.14*smoothstep(0.0,130.0,alt);
        baseC*=0.80+0.20*clamp(nn.y,0.0,1.0);
        diffuseColor.rgb*=baseC*1.85;`);
  };
  const terrain = new THREE.Mesh(ground, mat);
  scene.add(terrain);
  const plain = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), mat); // 底盘共用同一材质，方形网格边不再显形
  plain.rotation.x = -Math.PI / 2; plain.position.y = -6.2; scene.add(plain);

  /* 云海：多层水平云毯 + 山腰立雾，全部用同一张程序化云纹理 */
  const cloudTex = makeCloudTex(THREE), clouds = [];
  for (let i = 0; i < 6; i++) {
    const t = cloudTex.clone(); t.needsUpdate = true;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(880 + i * 150, 880 + i * 150),
      new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: .15 + (i % 3) * .035,
        depthWrite: false, side: THREE.DoubleSide, fog: false, color: 0xfff4e6 }));
    m.rotation.x = -Math.PI / 2; m.rotation.z = rnd() * 6.28;
    m.position.set((rnd() * 2 - 1) * 360, 38 + i * 18 + rnd() * 14, (rnd() * 2 - 1) * 360);
    m.renderOrder = 3; m.userData.spd = .0016 + rnd() * .0022; scene.add(m); clouds.push(m);
  }
  const mist = [];
  for (let i = 0; i < 8; i++) {
    const t = cloudTex.clone(); t.needsUpdate = true;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(620 + rnd() * 420, 250 + rnd() * 160),
      new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: .15, depthWrite: false,
        side: THREE.DoubleSide, fog: false, color: 0xeaf0f0 }));
    const a = rnd() * 6.28;
    m.position.set(Math.cos(a) * 330, 150 + rnd() * 90, Math.sin(a) * 330);
    m.lookAt(0, 170, 0); m.renderOrder = 3; scene.add(m); mist.push(m);
  }

  /* 针叶林：合并低模树形，InstancedMesh 一次绘制；坡度与海拔共同决定分布 */
  function mergeGeos(geos) {
    let vc = 0, ic = 0;
    for (const g of geos) { vc += g.attributes.position.count; ic += g.index.count; }
    const pos = new Float32Array(vc * 3), nrm = new Float32Array(vc * 3), idx = new Uint32Array(ic);
    let vo = 0, io = 0;
    for (const g of geos) {
      pos.set(g.attributes.position.array, vo * 3); nrm.set(g.attributes.normal.array, vo * 3);
      const gi = g.index.array;
      for (let i = 0; i < gi.length; i++) idx[io++] = gi[i] + vo;
      vo += g.attributes.position.count;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    out.setIndex(new THREE.BufferAttribute(idx, 1)); out.computeBoundingSphere(); return out;
  }
  const parts = [];
  const trunk = new THREE.CylinderGeometry(.34, .62, 4.6, 6); trunk.translate(0, 2.3, 0); parts.push(trunk);
  for (const [r, h, y] of [[3.9, 5.0, 3.2], [3.3, 4.9, 5.6], [2.7, 4.5, 8.0], [2.0, 4.1, 10.2], [1.2, 3.3, 12.3]]) {
    const c = new THREE.ConeGeometry(r, h, 7); c.translate(0, y, 0); parts.push(c);
  }
  const treeGeo = mergeGeos(parts);
  const TREE_MAX = isMobile ? 700 : 2100;
  const trees = new THREE.InstancedMesh(treeGeo,
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .95, flatShading: true }), TREE_MAX);
  trees.frustumCulled = false;
  const dummy = new THREE.Object3D(), tint = new THREE.Color();
  let placed = 0, guard = 0;
  while (placed < TREE_MAX && guard++ < TREE_MAX * 14) {
    const x = (rnd() * 2 - 1) * 620, z = (rnd() * 2 - 1) * 620, h = H(x, z);
    if (h < 26 || h > 232) continue;
    const e = 7, gx = (H(x + e, z) - H(x - e, z)) / (2 * e), gz = (H(x, z + e) - H(x, z - e)) / (2 * e);
    if (Math.hypot(gx, gz) > .92) continue;
    const s = .72 + rnd() * .92;
    dummy.position.set(x, h - 1.1, z);
    dummy.rotation.set(0, rnd() * 6.28, 0);
    dummy.scale.set(s * (.86 + rnd() * .3), s * (1.0 + rnd() * .55), s * (.86 + rnd() * .3));
    dummy.updateMatrix(); trees.setMatrixAt(placed, dummy.matrix);
    tint.setHSL(.255 + rnd() * .055, .26 + rnd() * .20, .088 + rnd() * .078);
    trees.setColorAt(placed, tint); placed++;
  }
  trees.count = placed; trees.instanceMatrix.needsUpdate = true;
  if (trees.instanceColor) trees.instanceColor.needsUpdate = true;
  scene.add(trees);

  /* 盘旋的飞鸟：给静态山体一处活的尺度参照 */
  const wing = new THREE.BufferGeometry();
  wing.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, -1.4, -1.7, .35, .6, 0, 0, .25,
    0, 0, -1.4, 0, 0, .25, 1.7, .35, .6], 3));
  wing.computeVertexNormals();
  const birds = [];
  for (let i = 0; i < 11; i++) {
    const b = new THREE.Mesh(wing, new THREE.MeshBasicMaterial({ color: 0x2c3336, side: THREE.DoubleSide, fog: true }));
    b.userData = { a: rnd() * 6.28, r: 190 + rnd() * 330, y: 250 + rnd() * 160, sp: .10 + rnd() * .13, s: 1.4 + rnd() * 1.8 };
    b.scale.setScalar(b.userData.s); scene.add(b); birds.push(b);
  }

  /* 相机：五种视点共用一组轨道参数，切换时平滑插值；入山另加密雾 */
  const VIEWS = [
    { name: '横看 · 成岭', desc: '自正面远望，群峰连成一道横岭', yaw: 0, pitch: .14, dist: 830, ty: 140, fog: .00042 },
    { name: '侧看 · 成峰', desc: '绕到岭的一端，横岭收作一座孤峰', yaw: 1.49, pitch: .13, dist: 810, ty: 146, fog: .00042 },
    { name: '远观 · 高低', desc: '退远抬高，远近层峦显出高下', yaw: -.30, pitch: .26, dist: 1360, ty: 116, fog: .00034 },
    { name: '入山 · 不识', desc: '行至山腰，云岚满目，不见真面', yaw: .68, pitch: .015, dist: 285, ty: 172, fog: .00135 },
    { name: '巡游 · 各不同', desc: '视点绕山缓行，岭与峰往复相生', yaw: 0, pitch: .17, dist: 850, ty: 132, fog: .00042 }
  ];
  const cam = { yaw: 0, pitch: .14, dist: 830, ty: 140 }, want = Object.assign({}, cam);
  let view = 4, auto = true, fogWant = .00042;
  const viewname = document.getElementById('viewname'), viewdesc = document.getElementById('viewdesc');
  const l1 = document.getElementById('line1'), l2 = document.getElementById('line2');
  const navButtons = [...document.querySelectorAll('nav button')];
  function selectView(i) {
    view = i; auto = (i === 4);
    const v = VIEWS[i];
    if (i !== 4) Object.assign(want, { yaw: v.yaw, pitch: v.pitch, dist: v.dist, ty: v.ty });
    fogWant = v.fog; viewname.textContent = v.name; viewdesc.textContent = v.desc;
    l1.classList.toggle('on', i === 0 || i === 1 || i === 4);
    l2.classList.toggle('on', i === 2 || i === 3 || i === 4);
    navButtons.forEach((b, k) => b.classList.toggle('on', k === i));
  }
  navButtons.forEach(b => b.addEventListener('click', () => selectView(+b.dataset.view)));
  selectView(4);

  let drag = false, lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    want.yaw -= (e.clientX - lx) * .0042; want.pitch = clamp(want.pitch + (e.clientY - ly) * .0032, -.12, .72);
    lx = e.clientX; ly = e.clientY;
  });
  canvas.addEventListener('pointerup', () => { drag = false; });
  canvas.addEventListener('pointercancel', () => { drag = false; });
  canvas.addEventListener('wheel', e => { e.preventDefault(); want.dist = clamp(want.dist * (1 + Math.sign(e.deltaY) * .085), 190, 2100); }, { passive: false });
  canvas.addEventListener('dblclick', () => selectView(4));
  addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= '5') selectView(+e.key - 1);
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  });

  let paused = false, hidden = false;
  const pauseBtn = document.getElementById('pause');
  function togglePause() { paused = !paused; pauseBtn.textContent = paused ? '继续' : '暂停'; }
  pauseBtn.addEventListener('click', togglePause);
  document.addEventListener('visibilitychange', () => { hidden = document.hidden; });
  const qBtn = document.getElementById('quality');
  function applyQuality() {
    const dpr = quality ? Math.min(devicePixelRatio || 1, isMobile ? 1.4 : 1.75) : 1;
    renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    trees.count = quality ? placed : Math.min(placed, 480);
    clouds.forEach((c, i) => { c.visible = quality || i < 4; });
    mist.forEach((m, i) => { m.visible = quality || i < 2; });
    qBtn.textContent = '画质：' + (quality ? '精细' : '流畅');
  }
  qBtn.addEventListener('click', () => { quality = 1 - quality; applyQuality(); });
  addEventListener('resize', () => applyQuality());
  applyQuality();

  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fatal = true; paused = true; showError('图形上下文丢失，正在等待恢复…'); });
  canvas.addEventListener('webglcontextrestored', () => { fatal = false; paused = false; hideError(); });

  const fpsEl = document.getElementById('fps');
  let last = performance.now(), acc = 0, frames = 0, fps = 0, clock = 0;
  window.__tixilinbi = () => ({ fps, view: VIEWS[view].name, triangles: renderer.info.render.triangles,
    calls: renderer.info.render.calls, trees: trees.count, ready: document.documentElement.dataset.ready || '0' });
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, .05); last = now;
    if (paused || hidden) return;
    clock += dt;
    if (auto && !drag) { want.yaw += dt * .058; want.pitch = .17 + Math.sin(clock * .09) * .055; }
    const k = 1 - Math.exp(-dt * 3.2);
    cam.yaw = lerp(cam.yaw, want.yaw, k); cam.pitch = lerp(cam.pitch, want.pitch, k);
    cam.dist = lerp(cam.dist, want.dist, k); cam.ty = lerp(cam.ty, want.ty, k);
    scene.fog.density = lerp(scene.fog.density, fogWant, k * .6);
    const cp = Math.cos(cam.pitch);
    camera.position.set(Math.sin(cam.yaw) * cam.dist * cp, cam.ty + Math.sin(cam.pitch) * cam.dist, Math.cos(cam.yaw) * cam.dist * cp);
    camera.lookAt(0, cam.ty, 0);
    sky.position.copy(camera.position);
    for (const c of clouds) { c.material.map.offset.x += c.userData.spd * dt * 6; c.position.x += Math.sin(clock * .06 + c.id) * dt * .6; }
    for (const m of mist) { m.material.map.offset.x += dt * .003; m.position.y += Math.sin(clock * .3 + m.id) * dt * .5; }
    for (const b of birds) {
      const u = b.userData; u.a += dt * u.sp;
      b.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(u.a * 2.1) * 22, Math.sin(u.a) * u.r * .8);
      b.rotation.y = -u.a + Math.PI / 2; b.rotation.z = Math.sin(clock * 9 + u.a) * .35;
    }
    renderer.render(scene, camera);
    document.documentElement.dataset.ready = '1';
    if (!fatal) hideError();
    frames++; acc += dt;
    if (acc >= .6) { fps = Math.round(frames / acc); frames = 0; acc = 0;
      fpsEl.textContent = fps + ' FPS · ' + renderer.info.render.calls + ' draws · ' +
        Math.round(renderer.info.render.triangles / 1000) + 'k 三角'; }
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
