name: Validate catalogue and scenes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate metadata and scenes
        run: node scripts/validate.mjs
      - name: Test all AI Agent task prompts
        run: node scripts/test-agent-prompt.mjs
