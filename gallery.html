<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f5">
<meta name="description" content="诗境展厅：同一首诗的多个独立 HTML 三维场景，可切换浏览。">
<title>诗境 · 展厅</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/gallery.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" aria-label="返回诗境首页"><b>诗境</b><span>POETIC REALMS</span></a>
  <nav class="topnav" aria-label="主导航">
    <a href="catalog.html">馆藏</a>
    <a href="catalog.html#tasks">共建</a>
    <a href="https://github.com/jackson-heylion/Poetic-Realms" target="_blank" rel="noopener">GitHub ↗</a>
  </nav>
</header>

<main class="wrap">
  <div class="gallery-intro">
    <div>
      <h1 id="gallery-title">正在加载诗境…</h1>
      <p id="gallery-verse"></p>
    </div>
    <a id="gallery-detail" class="btn" href="catalog.html">查看诗文与创作 ↗</a>
  </div>

  <div class="gallery-bar">
    <div id="gallery-options" class="gallery-options" role="group" aria-label="选择场景版本"></div>
    <span class="spacer"></span>
    <span id="gallery-count">—</span>
    <span id="gallery-current" aria-live="polite"></span>
    <button class="btn btn-icon" id="gallery-prev" type="button" aria-label="上一个场景">←</button>
    <button class="btn btn-icon" id="gallery-next" type="button" aria-label="下一个场景">→</button>
    <a class="btn" id="gallery-standalone" href="#" target="_blank" rel="noopener">独立打开 ↗</a>
  </div>

  <section class="stage" id="gallery-stage" aria-label="三维场景">
    <div id="gallery-empty">正在准备作品…</div>
    <iframe id="gallery-frame" title="诗境 3D 场景" loading="eager" allowfullscreen hidden></iframe>
  </section>

  <p class="gallery-note">同一首诗可收录多个独立 HTML。切换版本会重新载入场景，避免多个渲染器同时运行。</p>
</main>
</body>
</html>
